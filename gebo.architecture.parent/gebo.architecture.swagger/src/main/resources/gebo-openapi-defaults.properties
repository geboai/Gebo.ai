# Defaults applied to every Gebo application that ships this module, that is
# to every build activating its swagger-on profile. They are contributed
# through @PropertySource on SwaggerConfig, so an application.yml of its own
# always wins over what is written here.
#

# Emit the served specification as OpenAPI 3.0.1 rather than springdoc's own
# 3.1.0 default. The specifications are not only read by a browser: they are
# the input of the swagger-codegen v3 generators producing the java and angular
# client stubs under gebo.api.clients, and those generators do not understand
# the 3.1 type syntax - every scalar they meet there degrades to Object / any,
# losing the enums, the dates and the collection item types. Pinning 3.0 keeps
# the generated stubs typed.
springdoc.api-docs.version=OPENAPI_3_0
