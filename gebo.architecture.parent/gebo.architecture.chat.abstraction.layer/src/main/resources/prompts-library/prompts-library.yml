      userReference: /prompts-library/en/default-chat-agent-user-prompt.txt
      chatHistory: REQUIRED
      contextDocuments: REQUIRED
      toolsCalling: REQUIRED
      description: Default Chat Agent prompt
      #prompt used by the ranker service to drop the ranked fragments that are
      #completely useless for the query: no chat session is involved, the query is
      #carried by a session-less chat request context
    - promptUse: ranker-irrelevant-fragments-filter-prompt
      langCode: en
      systemReference: /prompts-library/en/ranker-irrelevant-fragments-filter-prompt-system-prompt.txt
      userReference: /prompts-library/en/ranker-irrelevant-fragments-filter-prompt-user-prompt.txt
      chatHistory: NOT_REQUIRED
      contextDocuments: NOT_REQUIRED
      toolsCalling: NOT_REQUIRED
      description: Ranker irrelevant fragments filter prompt
  uses:
    - code: prompt-template-wizard-default
      description: Default prompt used by the prompt-template creation wizard to draft a new prompt template from a user's use-case description.
      module: chat
      placeholders:
        - placeholder: question
          description: The user's description of the desired prompt template's purpose.
    - code: chat-history-documents-consolidation
      description: Consolidates prior chat history and retrieved documents into a compact working summary used internally by the pipeline.
      module: chat
      placeholders:
        - placeholder: documents
          description: Rendered block of retrieved/attached documents or fragments for this request (can be empty).
        - placeholder: question
          description: The user's current question or request text.
    - code: summarize-chat-description
      description: Generates a short human-readable title/description summarizing a chat session, shown in the chat list.
      module: chat
      placeholders:
        - placeholder: question
          description: The chat content used as the basis for the generated summary/title.
    - code: history-consolidation-prompt
      description: Compresses the chat history (and any prior consolidated summary) down to a target size while preserving the relevant context.
      module: chat
      placeholders:
        - placeholder: historySizeTarget
          description: The target size (in tokens) the consolidated chat history should be compressed to.
        - placeholder: consolidated
          description: The previously consolidated history summary, if any, to further compress.
        - placeholder: documents
          description: Rendered block of retrieved/attached documents or fragments for this request (can be empty).
        - placeholder: question
          description: The user's current question or request text.
    - code: standard-chat-prompt
      description: Default general-purpose chat prompt used when no retrieval-augmented context is required.
      module: chat
      placeholders:
        - placeholder: documents
          description: Rendered block of retrieved/attached documents or fragments for this request (can be empty).
        - placeholder: question
          description: The user's current question or request text.
    - code: standard-rag-prompt
      description: Default Retrieval-Augmented Generation (RAG) chat prompt that blends retrieved company knowledge with general model knowledge.
      module: chat
      placeholders:
        - placeholder: documents
          description: Rendered block of retrieved documents/chunks from the RAG system for this request (can be empty).
        - placeholder: question
          description: The user's current question or request text.
    - code: default-pipeline-routing-decision-prompt
      description: Routes an incoming chat turn to the right pipeline strategy (plain chat, RAG, tools, deep search, etc.) by having the model choose a deliverable type.
      module: chat
      placeholders:
        - placeholder: actualTimestamp
          description: The current date/time, given to the model for time-aware reasoning.
        - placeholder: deepSearchDataSources
          description: Catalog describing the deep-search data sources available to be selected.
        - placeholder: deliverable
          description: The set of candidate deliverable/routing types the model can choose from.
        - placeholder: deliverableExplanation
          description: Explanation of what each candidate deliverable/routing type means.
        - placeholder: documents
          description: Rendered block of retrieved/attached documents or fragments already available for this request.
        - placeholder: internalKnowledgeBaseCatalog
          description: Catalog describing the internal knowledge base collections available for retrieval.
        - placeholder: question
          description: The user's current question or request text.
        - placeholder: toolsList
          description: Description of the tools available to be called for this request.
    - code: default-pipeline-rag-output-prompt
      description: Produces the final answer for the RAG pipeline step, using the documents retrieved for the routed request.
      module: chat
      placeholders:
        - placeholder: documents
          description: Rendered block of retrieved documents/chunks used as evidence for the answer.
        - placeholder: question
          description: The user's current question or request text.
    - code: default-pipeline-chat-output-prompt
      description: Produces the final answer for the plain-chat pipeline step (no retrieval involved).
      module: chat
      placeholders:
        - placeholder: documents
          description: Rendered block of any attached documents or fragments for this request (can be empty).
        - placeholder: question
          description: The user's current question or request text.
    - code: default-pipeline-tools-call-output-prompt
      description: Produces the final answer for the pipeline step that follows a tool-calling turn.
      module: chat
      placeholders:
        - placeholder: question
          description: The user's current question or request text.
        - placeholder: toolsList
          description: Description of the tools that were available to be called for this request.
    - code: deep-search-file-analisys-prompt
      description: Analyzes a single file/document found during a deep-search run and extracts the information relevant to the ongoing research.
      module: chat
      placeholders:
        - placeholder: agentDeliverableCompleteness
          description: Guidance on how complete/exhaustive the deep-search deliverable being built should be.
        - placeholder: consolidated
          description: The research findings consolidated so far in the deep-search run.
        - placeholder: documents
          description: Rendered content of the file/document under analysis.
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: deep-search-data-sources-file-analisys-prompt
      description: Analyzes a file/document coming from an external deep-search data source and extracts the information relevant to the ongoing research.
      module: chat
      placeholders:
        - placeholder: agentDeliverableCompleteness
          description: Guidance on how complete/exhaustive the deep-search deliverable being built should be.
        - placeholder: format
          description: The structured-output format/schema instructions the model must comply with.
        - placeholder: consolidated
          description: The research findings consolidated so far in the deep-search run.
        - placeholder: documents
          description: Rendered content of the file/document under analysis.
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: deep-search-consolidation-prompt
      description: Consolidates the findings gathered across a deep-search run into the running research summary.
      module: chat
      placeholders:
        - placeholder: agentDeliverableCompleteness
          description: Guidance on how complete/exhaustive the deep-search deliverable being built should be.
        - placeholder: consolidated
          description: The research findings consolidated so far, to be merged with the new documents.
        - placeholder: documents
          description: Newly gathered documents/fragments to fold into the consolidated research summary.
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: deep-search-content-rating-prompt
      description: Rates how relevant a retrieved content fragment is to the deep-search research goal, used to filter out noise.
      module: chat
      placeholders:
        - placeholder: format
          description: The structured-output format/schema instructions the model must comply with.
        - placeholder: documents
          description: The content fragment(s) being rated for relevance.
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: deep-search-keyword-generation-prompt
      description: Generates the search keywords used to drive the next round of a deep-search run.
      module: chat
      placeholders:
        - placeholder: format
          description: The structured-output format/schema instructions the model must comply with.
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: deep-search-search-query-extraction-prompt
      description: Extracts the concrete search queries to run against a given deep-search data source.
      module: chat
      placeholders:
        - placeholder: dataSourceDescription
          description: Description of the specific deep-search data source being queried.
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: default-pipeline-initial-query-rewriting-prompt
      description: Rewrites the user's raw question into a clearer, self-contained query before the pipeline routes and processes it.
      module: chat
      placeholders:
        - placeholder: actualTimestamp
          description: The current date/time, given to the model for time-aware reasoning.
        - placeholder: deliverableTypesList
          description: List of the deliverable/output types the rewritten query may need to support.
        - placeholder: question
          description: The user's raw current question or request text.
    - code: default-pipeline-image-prompt-crafting-prompt
      description: Crafts the image-generation prompt to submit to the image model, from the rewritten user query.
      module: chat
      placeholders:
        - placeholder: actualTimestamp
          description: The current date/time, given to the model for time-aware reasoning.
        - placeholder: rewrittenQuery
          description: The user's query as rewritten by the initial query-rewriting pipeline step.
    - code: default-pipeline-rag-search-planner
      description: Plans the retrieval strategy (what/how to search) for the RAG pipeline before the actual document search runs.
      module: chat
      placeholders:
        - placeholder: question
          description: The user's current question or request text.
    - code: deep-search-empty-results-fallback-prompt
      description: Produces a graceful fallback answer when a deep-search run returns no usable results.
      module: chat
      placeholders:
        - placeholder: question
          description: The original research question driving the deep-search run.
    - code: default-pipeline-chat-with-documents-prompt
      description: Answers a chat turn where the user has attached documents directly to the conversation (not retrieved via RAG).
      module: chat
      placeholders:
        - placeholder: documents
          description: Rendered content of the documents the user attached to the conversation.
        - placeholder: question
          description: The user's current question or request text.
    - code: default-pipeline-pure-search-datasources-selection-prompt
      description: Selects which deep-search data sources should be queried for a "pure search" pipeline turn.
      module: chat
      placeholders:
        - placeholder: deepSearchDataSources
          description: Catalog describing the deep-search data sources available to be selected.
        - placeholder: documents
          description: Rendered block of any documents/fragments already available for this request.
        - placeholder: question
          description: The user's current question or request text.
    - code: default-pipeline-pure-search-fallback-prompt
      description: Fallback answer for the "pure search" pipeline step when the selected data sources produce nothing usable.
      module: chat
      placeholders:
        - placeholder: question
          description: The user's current question or request text.
    - code: default-pipeline-pure-search-summary-prompt
      description: Summarizes the results gathered by the "pure search" pipeline step into the final answer.
      module: chat
      placeholders:
        - placeholder: consolidated
          description: The results consolidated so far by the "pure search" pipeline step.
        - placeholder: documents
          description: Rendered block of the documents/fragments gathered by the "pure search" pipeline step.
        - placeholder: question
          description: The user's current question or request text.
    - code: default-chat-agent-prompt
      description: Main loop prompt for the default single-agent chat agent (ChatAgentService), driving its iterate-until-done control loop.
      module: chat
      placeholders:
        - placeholder: AGENT_CONTROL_CONTINUE_PROMPT_PARAM
          description: The control token the agent must emit to signal it needs another loop iteration.
        - placeholder: AGENT_CONTROL_FINISHED_PROMPT_PARAM
          description: The control token the agent must emit to signal its work is complete.
        - placeholder: CURRENT_ITERATION
          description: The current iteration number of the agent's control loop.
        - placeholder: MAX_ITERATIONS
          description: The maximum number of iterations allowed for the agent's control loop.
        - placeholder: AGENT_SESSION_STORY
          description: Narrative reconstruction of the agent session's turns so far.
        - placeholder: question
          description: The user's current question or request text.
    - code: ranker-irrelevant-fragments-filter-prompt
      description: Filters out retrieved fragments that are completely irrelevant to the query before ranking/using them, independent of any chat session.
      module: chat
      placeholders:
        - placeholder: documents
          description: The retrieved fragments being screened for relevance.
        - placeholder: question
          description: The query the fragments are being screened against.
