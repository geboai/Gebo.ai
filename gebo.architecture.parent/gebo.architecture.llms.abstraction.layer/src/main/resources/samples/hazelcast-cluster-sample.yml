# =============================================================================
# Sample Hazelcast cluster configuration for the Gebo.ai LLMs abstraction layer
# =============================================================================
#
# Purpose
# -------
# When several application instances run the SAME LLM configuration (e.g. the
# monolith replicated, or the brain / vectorizator / graphsearch microservices),
# every instance keeps its own memory-resident, live LLM model clients built by
# the IGRuntimeModelConfigurationDao implementations. Enabling Hazelcast turns on
# the cross-node cluster bus (module: gebo.architecture.hazelcast) so that an
# admin insert/update/delete of a model on one node is propagated live to the
# others: each node rebuilds/reconfigures/drops the matching live client.
#
# How to use
# ----------
# This file is a SAMPLE and is intentionally placed under src/main/resources/
# samples/ so Spring Boot does NOT auto-load it. To activate clustering, copy the
# `gebo.hazelcast` block into your application's own application.yml (or an
# externalized config), or start with:
#   --spring.config.additional-location=classpath:samples/hazelcast-cluster-sample.yml
#
# Safe default: if you do nothing, gebo.hazelcast.enabled stays false and the
# application runs standalone (single instance) with a no-op cluster bus.
#
# All keys below map to ai.gebo.architecture.hazelcast.GeboHazelcastProperties.
# =============================================================================

gebo:
  hazelcast:
    # Master switch. false (default) => no Hazelcast member is started and the
    # cluster message bus degrades to a no-op local implementation.
    enabled: true

    # Logical cluster name. Only members sharing the SAME name join the SAME
    # cluster. Use one value per logical Gebo.ai cluster.
    cluster-name: gebo-cluster

    # Name of the local Hazelcast member instance (informational / diagnostics).
    instance-name: gebo-hazelcast

    # Network port the local member binds to.
    port: 5701

    # If the chosen port is busy, try the next one. Handy when co-locating
    # several members on one host or in tests. Set false to fail-fast on a
    # fixed port in production.
    port-auto-increment: true

    # -------------------------------------------------------------------------
    # Discovery option A (RECOMMENDED for production): explicit TCP/IP members.
    # When this list is non-empty, TCP/IP discovery is used and multicast is
    # forced off. List every instance's host or host:port.
    # -------------------------------------------------------------------------
    members:
      - "gebo-node-a:5701"
      - "gebo-node-b:5701"
      - "gebo-node-c:5701"

    # -------------------------------------------------------------------------
    # Discovery option B: multicast auto-discovery (only honoured when the
    # `members` list above is empty). Convenient on a flat LAN / dev network;
    # not recommended across most cloud/container networks.
    # -------------------------------------------------------------------------
    multicast-enabled: false
    multicast-group: 224.2.2.3
    multicast-port: 54327
