ai.gebo.rag-threashold-autotune.config.enabled: false	
# RAG retrieval tuning.
# Outbound LLM client networking. The shipped default of 80000 ms was measured to be
# too low for this workload: a SUMMARY deliverable was cut mid-stream at exactly
# 80.008 s, and a dropped stream is never retried because the tokens already emitted
# cannot be replayed - the answer simply ends where it was. Raised so that a multi
# cycle report has room to finish; 180000 ms then cut a deep search analysis of about
# 110k tokens of input at exactly 3 minutes. See docs/LLMS-NETWORKING-PARAMS.md.
ai.gebo.llms.default.clients.config:
  web-client-config:
    response-timeout: 240000

ai.gebo.ragsearch.config:
  # Hybrid retrieval: run the lexical (full text) leg beside the semantic one and
  # split the requested topK between them, instead of querying the lexical index
  # only when the semantic leg under delivers. With a populated vector store the
  # semantic leg always filled the quota, so the lexical index was never reached
  # and questions carrying rare literal terms (exact phrases, proper nouns, codes)
  # could not be answered even when the lexical index ranked the right chunk first.
  hybrid-search-enabled: true
  # Half the budget to each leg. Lower it to favour semantic recall, raise it to
  # favour literal matches.
  hybrid-full-text-share: 0.5
  # Minimum cosine similarity a fragment must reach to be retrieved. The 0.50
  # default admitted essentially every neighbour: over a sample of 176 retrieved
  # fragments on the reference corpus the WEAKEST scored 0.523, so nothing was ever
  # filtered and bulky low-signal documents (indexes, catalogues) crowded the
  # results. 0.57 keeps a bit more of the tail than 0.60 while still dropping the
  # weakest neighbours.
  default-similarity-threshold: 0.57
ai.gebo.agents.standard.enabled: true
# Found documents the search tools and the document-search agents load and chunk
# at the same time (2 when not set)
ai.gebo.agents.standard.search-documents-parallelism: 2
# Search services calls (web, native, every search tool, agent and deep search): best
# effort, a system out of service or not answering within timeout-seconds is reported
# (to the model when the caller is a tool) and the others are searched; retries: times
# a failure that can pass (not responding, out of service) is tried again, none by
# default. The clients of the searched systems (web providers, Jira, Confluence,
# SharePoint, the connector microservices) connect and read within the
# http-*-timeout-seconds during searches and search result downloads, coherent with a
# sloppy network.
ai.gebo.search.calls:
  retries: 0
  timeout-seconds: 60
  retry-pause-millis: 1000
  http-connect-timeout-seconds: 15
  http-read-timeout-seconds: 60
# Results of the services searching an open network (the web search providers): once
# a search has given its pool of candidates, the pages are loaded at once, grouped by
# host. Each host gets at most per-host-concurrency pages at a time, with
# per-host-pause-millis between its requests, and its other pages are not requested
# after per-host-failures-before-skip failed ones (so no site is overloaded or blocks
# the search). Each page within per-page-deadline-seconds, the whole loading within
# loading-phase-deadline-seconds: what has not arrived by then is not read. With
# capped, only the first candidates-cap candidates are loaded. Every page not loaded,
# not read or not relevant is told to the agent with its reason, never among the
# answer's documents. Systems sized to answer (Confluence, SharePoint, Jira, the
# connector microservices) keep loading a few results at a time.
ai.gebo.search.open-network-loading:
  capped: false
  candidates-cap: 20
  per-page-deadline-seconds: 60
  loading-phase-deadline-seconds: 60
  per-host-concurrency: 2
  per-host-pause-millis: 500
  per-host-failures-before-skip: 2
# Web search results: after each search, a best-effort HEAD request per distinct
# result URL fills the result size from its declared Content-Length (unknown when
# the server declares none). Low timeouts: the search waits for it, never fails on it.
ai.gebo.websearch.size-probe:
  enabled: true
  timeout-ms: 1500
  parallelism: 8
# The knowledge base contents a model call may take: the room its messages leave of its
# context (two thirds of it go to contents) divided by this (3 when not set), for the
# chats with knowledge bases, the pipelines, the knowledge base agents of the networks
# and the search tools (whose answer is never sized by the model). A search tool whose
# model call shares no room takes its topK (knowledge base) or 4000 tokens (the others).
# ai.gebo.agents.standard.knowledge-base-search-room-divisor, when set, applies to the
# search tools only.
ai.gebo.llms.knowledge-base-search-room-divisor: 3
# In-flight LLM sub-analysis calls of a deep search per data source (2 when not set);
# with ai.gebo.deepsearch.max-concurrent-sources it caps the concurrent LLM calls
ai.gebo.deepsearch.analysis-parallelism: 2
# Deep search analyses folded into a running report, stopping once the consolidation model
# judges it enough (true when not set; false: stop on the satisfactory batches count)
ai.gebo.deepsearch.sufficiency-check-enabled: true
# The security factor of every tokens budget: a consolidation or deep analysis is given
# documents for (context length - prompt - the values filling it - the consolidation it carries)
# times this factor, and every check of what fits a model's context (chat with documents, the
# router's documents, the knowledge base searches, the deep search's direct analysis, the agents'
# budget) takes this share of it; the rest is left to the token estimation error and to what
# the model writes (0.7 when not set; 0 < factor <= 1)
ai.gebo.llms.tokens-budget.factor: 0.7
# A tool's result of up to this many tokens reaches the model whole even when the room its
# model call leaves to the tools' results is used up: the outcome of an action (a file created,
# replaced or deleted, a call refused and why), which replaced by a "does not fit" message the
# model takes for a failure and acts again on blind. Longer results are cut or replaced as
# before (256 when not set; 0 admits none over the room)
ai.gebo.llms.tokens-budget.always-admitted-result-tokens: 256
# The release of what the chunking sessions leave behind: the cached chunks whose session no
# longer exists, and the cache files no record names, are deleted once older than this many
# seconds, which is also the interval between two checks
# (300 when not set): it covers the moments a distributed run has no settled state
ai.gebo.documents-cache.orphans.grace-seconds: 300
# The life of a cached document copy: deleted, record and file, once not accessed for this
# many seconds (300 when not set)
ai.gebo.documents-cache.ttl-seconds: 300
# Share of an analysis batch one piece of a document read whole (chat with documents) fills,
# and the least batch budget an analysis lane goes on with (0.25 when not set; 0 < factor < 1)
ai.gebo.deepsearch.chunk-filling-factor: 0.25
# PDF ingestion: a page whose text is in columns (a vertical gutter through almost every
# line, in the page's own text direction) is read one column after the other; any other page
# is read as before. Takes effect on the documents ingested afterwards (true when not set)
ai.gebo.ingestion.pdf.column-aware-extraction: true
# A2A servers: the hosts a file an A2A caller names by a link (instead of sending its
# bytes) is fetched from, comma separated (none when not set: no link is fetched and the
# caller is told the attachment was not taken). The fetch is a plain GET, without
# credentials of this installation and without following redirects.
ai.gebo.a2a.server.linked-files-hosts:
# Images, recordings and videos into the knowledge bases. Two steps, each with its switch.
# 1) Ingestion: with a switch on, the readers give each media as it is, beside the texts -
#    an image file, the pictures inside Word, PowerPoint, Excel, OpenDocument and web page
#    files, a PDF page without text (rendered); a recording file; a video file. No model is
#    called while reading or chunking. All off when not set.
ai.gebo.images.ingestion-enabled: false
# the images of one document taken at most, and the size of one image, in megabytes
ai.gebo.images.max-images-per-document: 30
ai.gebo.images.max-image-mb: 20
# an image smaller than this, in bytes, is taken for a decoration (a bullet, a rule) and passed over
ai.gebo.images.min-image-bytes: 2048
ai.gebo.recordings.ingestion-enabled: false
ai.gebo.recordings.max-recording-mb: 20
ai.gebo.videos.ingestion-enabled: false
ai.gebo.videos.max-video-mb: 20
# 2) Vectorization: with a switch on and a model for it configured, each media is turned
#    into text - an image described by a chat model that reads pictures, a recording or a
#    video transcribed by the default transcription model - and that text is embedded as
#    the document's texts are. Each costs a model call at every vectorization of its
#    document. All off when not set: the media are then left out.
ai.gebo.vectorizator.embed-images: false
ai.gebo.vectorizator.embed-recordings: false
ai.gebo.vectorizator.embed-videos: false
# the chat model configuration describing images; unset: the default chat model when it
# reads pictures, else the first configured one that does
ai.gebo.vectorizator.image-model-code:
# a media larger than this, in megabytes, is not given to a model
ai.gebo.vectorizator.max-media-mb: 20
# Languages whose stop words the chunks' keyword filter ignores when neither the
# keywords' nor the chunk's language is detected with confidence (it,en when not set)
ai.gebo.search.keyword-stop-words.fallback-languages: it,en
# Deep search tools (deepSearchKnowledgeBase, deepSearchWeb, deepSearch<Product>) of the
# agents operating their own tools: the length of the analysis they return is asked to
# the model by the depth the agent chooses; this caps a runaway one, in tokens.
ai.gebo.agents.standard.deep-search-tools.max-analysis-tokens: 16000
# Deep searches a single user request can make, whatever the sources (8 when not set
# or not a positive number); one more is refused, telling the agent to answer with what
# it has.
ai.gebo.agents.standard.deep-search-tools.max-deep-searches-per-request: 8
# Coverage of a deep search: the tool measures how much of what it found the analysis
# covers and, when the coverage is thin for an analysis, asks the agent to complete it.
# Thin when the analysis reports something missing; when documents found were left
# unread (the analysis stopped before their fragments); when more than
# barely-read-share of its sources were read in at most barely-read-fragments
# fragments of a longer document (knowledge bases, whose documents can be read whole);
# or when it rests on fewer than min-documents-used documents out of at least
# min-documents-found it used or left unread. The documents judged irrelevant and the
# documents of the knowledge bases no search reached are reported, never judged. A
# FOCUSED deep search is never thin. With gate-enabled the agentic loop discards once
# an answer written on a thin coverage no search of the same kind of source completed,
# and the agent completes it; off, the coverage is only reported.
ai.gebo.agents.standard.deep-search-tools.coverage.gate-enabled: true
ai.gebo.agents.standard.deep-search-tools.coverage.min-documents-used: 2
ai.gebo.agents.standard.deep-search-tools.coverage.min-documents-found: 3
ai.gebo.agents.standard.deep-search-tools.coverage.barely-read-fragments: 2
ai.gebo.agents.standard.deep-search-tools.coverage.barely-read-share: 0.5
# Open-chat pipeline (pipelineCode=open-chat): a "pure chat" experience that never
# RAGs the internal knowledge base. It answers freely via a KB-free network of agents,
# can search external systems, and can chat over uploaded/picked files. Its agents
# network also requires ai.gebo.agents.standard.enabled=true (it reuses the standard
# searcher/tool agents and controller/writer services with free-response prompts).
ai.gebo.openchat.enabled: true
ai.gebo.chatpipes.defaultPipelineStepIsChatAgent: true
# Secrets declared by the configuration instead of created through the admin UI:
# one list per secret type, each entry with the code the rest of the configuration
# references plus the content under `secret`. They are resolved BEFORE the vault
# and before Mongo, and every write path refuses them - create, update and delete
# alike - so rotation means editing this file, not a UI action. See §6.2 of
# docs/APPLICATION-YML-ADMIN-MANUAL.md for the full field list per type.
#
# Everything here is a credential in plaintext: prefer ${ENV_VAR} over literals.
#ai.gebo.secrets.config:
#  username-password:
#    - code: nightly-ingestion-account
#      description: Service account of the nightly ingestion
#      context-code: SYSTEMS
#      secret:
#        username: ingestion
#        password: ${INGESTION_PASSWORD}
#  token:
#    - code: my-llm-api-key
#      context-code: LLMS
#      secret:
#        token: ${SOME_API_KEY}
#        user: gebo
#Google search api for LLM search web function
#ai.gebo.googlesearch:
#                  enabled: true
#                  apiKey: <put here your api key>
#                  customSearchEngineId: <put here your search engine id>
ai:
  gebo:
    userflows:
      activation-workflow-enabled: true
      forgot-password-workflow-enabled: true
      ticket-validity-timeout-ms: 600000
      mail-server: localhost
      mail-port: 1025
      mail-user-name:
      mail-password:
      mail-sender: no-reply@gebo.ai
      gebo-reachable-base-address: http://localhost:12999

# The files that go to a chat model as they are, when the model takes them: with a request
# of a conversation (the uploads no reader turned into text, the pictures generated before)
# and when a tool shows a file to its model. One switch and one set of limits for each kind
# of file; every kind is off when not set, and then no file of that kind reaches a model and
# such an upload is accepted or refused as if the model took text only. The limits count for
# one request, and for one round of tool calls. The estimated tokens are the room kept in
# the context for each file: an estimate, every provider counts a picture, a recording or a
# page its own way and none is asked beforehand - raise the limits knowing the context length
# of the models that answer.
ai.gebo.images.chat-enabled: false
ai.gebo.images.chat-max-images: 2
ai.gebo.images.chat-max-image-mb: 2
ai.gebo.images.chat-max-total-mb: 4
ai.gebo.images.chat-estimated-tokens-per-image: 1500
ai.gebo.recordings.chat-enabled: false
ai.gebo.recordings.chat-max-recordings: 1
ai.gebo.recordings.chat-max-recording-mb: 5
ai.gebo.recordings.chat-max-total-mb: 5
ai.gebo.recordings.chat-estimated-tokens-per-recording: 5000
ai.gebo.videos.chat-enabled: false
ai.gebo.videos.chat-max-videos: 1
ai.gebo.videos.chat-max-video-mb: 10
ai.gebo.videos.chat-max-total-mb: 10
ai.gebo.videos.chat-estimated-tokens-per-video: 10000
# any other file a model takes as it is (a PDF no reader turned into text, an office file)
ai.gebo.documents.chat-enabled: false
ai.gebo.documents.chat-max-documents: 1
ai.gebo.documents.chat-max-document-mb: 2
ai.gebo.documents.chat-max-total-mb: 2
ai.gebo.documents.chat-estimated-tokens-per-document: 5000
# The conversation's files sent to the remote A2A agents a network calls, when the agent's
# card says it takes them: off when not set. They are among the files above, so the kinds
# switched on there apply first; these are the megabytes of one file and of one message.
ai.gebo.a2a.clients.send-files-enabled: false
ai.gebo.a2a.clients.send-max-file-mb: 2
ai.gebo.a2a.clients.send-max-total-mb: 4
