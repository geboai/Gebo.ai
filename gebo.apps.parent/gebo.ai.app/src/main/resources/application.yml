springdoc.api-docs.version: OPENAPI_3_0
spring.application.name: gebo-ai-monolith
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.core: INFO
    org.springframework.core.codec: INFO
server:
  port: 12999
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  http2:
    enabled: true
  servlet:
    contextPath: /
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  # Traces are exported over OTLP only when an endpoint is given, e.g. with
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
  # (Spring Boot 4's management.opentelemetry.tracing.export.otlp.endpoint; the old
  # management.otlp.tracing.endpoint is no longer read). Left unset here on purpose:
  # an installation without a collector exports nothing instead of failing every batch.
  # The metrics scraper reaches /actuator/prometheus anonymously only on the separate
  # management port, set with MANAGEMENT_SERVER_PORT and never published (see
  # dockers/docker-compose-deploy/docker-compose.observability.yml).
spring.servlet.multipart:
  enabled: true
  maxFileSize: 100MB
  maxRequestSize: 100MB
