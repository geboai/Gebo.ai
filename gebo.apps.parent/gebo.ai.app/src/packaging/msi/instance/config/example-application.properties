# ---------------------------------------------------------------------------
# Gebo.ai - OPTIONAL full-stack configuration. THIS FILE IS NOT READ.
#
# The installation is already working from application.properties next to this
# file, which needs MongoDB only. Use the settings below only if you want to
# replace parts of that setup with server-backed components, by copying the
# lines you need INTO application.properties.
#
# None of this is required. Each section is an independent choice.
# ---------------------------------------------------------------------------

# ---- Qdrant instead of the embedded vector store --------------------------
# A server-backed vector store: faster on large corpora and it keeps the corpus
# out of the JVM heap. Requires a running Qdrant (no Windows installer; usually
# run as a container).
#
# Switching store does NOT migrate anything: the new store starts empty and the
# knowledge bases have to be ingested again.
#ai.gebo.vectorstore.use=QDRANT
#ai.gebo.vectorstore.qdrant.host=127.0.0.1
#ai.gebo.vectorstore.qdrant.port=6334
#ai.gebo.vectorstore.qdrant.tls=false
#ai.gebo.vectorstore.qdrant.apiKey=<your api key>

# ---- Tuning the embedded vector store instead -----------------------------
# Usually unnecessary. The data file defaults to
# <work directory>\vectorstore-local\<embedding model code>.json
#ai.gebo.vectorstore.local.directory=D:\\gebo-vectors
# Persist after every batch instead of on a 30s debounce. Safer against a hard
# kill, but the whole store is rewritten each time, so ingestion gets much slower.
#ai.gebo.vectorstore.local.saveOnEveryWrite=true
#ai.gebo.vectorstore.local.minimumSaveIntervalSeconds=30
#ai.gebo.vectorstore.local.warnAboveFragments=100000

# ---- GraphRAG (Neo4j) -----------------------------------------------------
# Adds knowledge-graph extraction and graph-aware retrieval. Requires a running
# Neo4j with the APOC plugin.
#ai.gebo.neo4j.enabled=true
#spring.neo4j.uri=bolt://localhost:7687
#spring.neo4j.authentication.username=neo4j
#spring.neo4j.authentication.password=secret

# ---- Full-text search (OpenSearch) ----------------------------------------
# Adds keyword/full-text retrieval alongside the semantic one. Requires a
# running OpenSearch.
#ai.gebo.opensearch.enabled=true
#ai.gebo.opensearch.protocol=https
#ai.gebo.opensearch.host=localhost
#ai.gebo.opensearch.port=9200
#ai.gebo.opensearch.username=admin
#ai.gebo.opensearch.password=<your password>

# ---- MongoDB with authentication enabled ----------------------------------
# A default MongoDB Windows installation has access control disabled. If you
# created users, point the connection string at them.
#ai.gebo.mongodb.connectionString=mongodb://user:password@localhost:27017/gebo-ai?authSource=admin

# ---- MongoDB as a replica set ---------------------------------------------
# Only needed for real multi-document transactions; a standalone mongod cannot
# do them, and the platform detects that and runs without them. Initialise the
# set with rs.initiate() before setting this.
#ai.gebo.mongodb.connectionString=mongodb://localhost:27017/gebo-ai?replicaSet=rs0
#ai.gebo.mongodb.transactionsEnabled=true

# ---- Per-installation security -------------------------------------------
#ai.gebo.security.auth.tokenSecret=<a long random hex string of your own>
#ai.gebo.security.auth.tokenExpirationMsec=1800000
#ai.gebo.security.cors.allowedOrigins=http://localhost:12999,http://localhost:4200
