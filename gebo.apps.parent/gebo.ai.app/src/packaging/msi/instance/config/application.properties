# ---------------------------------------------------------------------------
# Gebo.ai - Windows installation configuration (ACTIVE).
#
# This file is READ BY THE APPLICATION. Spring Boot picks it up because the
# service launcher sets -Duser.dir=$APPDIR\instance, so this folder is the
# "./config/" directory Spring Boot searches, and an external file here wins
# over the application.yml packaged inside the jar.
#
# It is deliberately configured so that MONGODB IS THE ONLY SERVICE YOU HAVE TO
# INSTALL. MongoDB is the one dependency that ships a Windows installer, so the
# graph and full-text stacks are switched off and the vectors are kept by the
# embedded vector store, in-process, under the instance data directory.
#
# To use the full stack instead (Qdrant + Neo4j + OpenSearch), see
# example-application.properties next to this file.
# ---------------------------------------------------------------------------

# ---- Web endpoint ---------------------------------------------------------
# Open http://localhost:12999/ after the service starts; the first page asks
# you to create the administrative account.
server.port=12999
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.http2.enabled=true
server.servlet.contextPath=/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.maxFileSize=100MB
spring.servlet.multipart.maxRequestSize=100MB

logging.level.root=INFO
logging.level.org.springframework=INFO

# ---- MongoDB: the only service to install --------------------------------
# Matches a default MongoDB Windows installation, which starts as a service on
# 27017 with access control DISABLED - so no credentials are set here. If you
# enabled authentication, put the user in the connection string:
#   mongodb://user:password@localhost:27017/gebo-ai?authSource=admin
ai.gebo.mongodb.enabled=true
ai.gebo.mongodb.databaseName=gebo-ai
ai.gebo.mongodb.connectionString=mongodb://localhost:27017/gebo-ai

# ---- Vector store: embedded, no service ----------------------------------
# LOCAL keeps the vectors in an embedded store persisted under the instance
# data directory (GEBO_WORK_DIRECTORY, set by the service launcher), so no
# vector database has to be installed.
#
# It holds the corpus in memory and scans all of it per query, which suits a
# single-machine installation. Past roughly 100k fragments the log says so, and
# at that point move to a server-backed store (see example-application.properties).
#
# NOTE: MONGO is NOT an alternative here. MongoDB's $vectorSearch is served by
# the separate "mongot" binary, which MongoDB publishes for Linux only and which
# requires a replica set rather than the standalone mongod this installation
# talks to. Selecting MONGO would accept writes and fail every query.
ai.gebo.vectorstore.use=LOCAL

# ---- GraphRAG / Neo4j: off -----------------------------------------------
# Neo4j has no part in this installation. With the switch off, none of the graph
# beans are registered, so nothing tries to reach bolt://localhost:7687.
# Turning it on requires a running Neo4j - see example-application.properties.
ai.gebo.neo4j.enabled=false

# ---- Full-text search / OpenSearch: off ----------------------------------
# Same reasoning: no OpenSearch service, so no full-text beans are registered.
# Semantic (vector) retrieval is unaffected and remains fully available.
ai.gebo.opensearch.enabled=false

# ---- Storage and shares --------------------------------------------------
# The work directory is set by the service launcher (GEBO_WORK_DIRECTORY) and
# can also be changed from the administration UI.
ai.gebo.config.setupConfiguresWorkdir=true

# Let an administrator pick the folders to ingest from the UI rather than
# hardcoding them here.
ai.gebo.filesystem.allowFilesystemSharesUI=true
ai.gebo.filesystem.shares=

# ---- Before exposing this installation beyond localhost ------------------
# The JWT signing secret shipped in the application defaults is a PUBLISHED
# value, identical in every installation. Set your own here before the service
# is reachable from another machine:
#   ai.gebo.security.auth.tokenSecret=<a long random hex string of your own>
#   ai.gebo.security.cors.allowedOrigins=http://localhost:12999
