spring:
  application:
    # Canonical (underscore) microservice id of the registry itself.
    name: eureka_gebo_ai

# Eureka server listens here; the microservice clients default their
# eureka.client.service-url.defaultZone to http://localhost:8761/eureka/.
server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    # Standalone registry: do not try to register with, or fetch a registry from,
    # itself. For an HA cluster, set these true and peer the nodes via
    # service-url.defaultZone (comma-separated peer /eureka/ urls).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://${eureka.instance.hostname}:${server.port}/eureka/}
