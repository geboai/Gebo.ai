spring:
  application:
    # Canonical microservice id (underscore form), also the Eureka service-id.
    name: gateway_gebo_ai
  cloud:
    gateway:
      server:
        webflux:
          # Spring Cloud's own discovery locator auto-routes EVERY service that
          # registers with Eureka. Left OFF on purpose: it would publish anything
          # that happens to register - including services never meant to sit behind
          # the public edge - the moment it appears.
          #
          # GeboTopologyRouteDefinitionLocator is the allow-list version of it: it
          # derives one route per member of the gebo.microservices.topology map
          # below,
          #     /<contextName>/**  -->  lb://<discovery-id>   (no path rewriting)
          # (e.g. /brain/api/x -> lb://brain-gebo-ai/brain/api/x), which is the
          # addressing GeboMicroserviceUrlResolver's GATEWAY strategy already
          # assumes. The <contextName> segment IS the backend's own
          # server.servlet.context-path, so it is forwarded unchanged - no
          # StripPrefix. So a service becomes routable by being DECLARED below, not
          # by merely registering, and adding one is a config change - no rebuild.
          #
          # Instances stay fully dynamic either way: lb:// resolves the live
          # instances from Eureka per call, so scaling or replacing a backend needs
          # nothing from the gateway.
          #
          # Set gebo.gateway.routing.topology.enabled: false to switch those routes
          # off. 'routes' below is for extra hand-written routes; the topology ones
          # are added to whatever is listed here.
          discovery:
            locator:
              enabled: false
          routes:
            # heimdall (the security service) hosts NO messaging module, so it has no
            # entry in the topology map below and the topology locator derives no route
            # for it. It is routed by hand here - and ONLY its admin surface.
            #
            # This route is deliberately NOT /heimdall/**. heimdall serves two
            # secrets surfaces:
            #   api/admin/SecretsController    metadata + create/delete, @PreAuthorize
            #                                  ADMIN - a UI surface, routed below;
            #   api/cluster/SecretsController  the WHOLE interface, decrypted secret
            #                                  CONTENT included - a service-to-service
            #                                  surface that must never be reachable from
            #                                  a browser.
            # A blanket /heimdall/** would publish the second one at the edge.
            # Worse, it would arrive at heimdall from the GATEWAY's address, so if the
            # gateway were ever added to the cluster participants allow-list the guard
            # would wave it through. Keep this path prefix narrow; do not widen it.
            #
            # No StripPrefix: heimdall's own server.servlet.context-path is
            # /heimdall, so /heimdall/api/admin/** is exactly the path its Spring
            # context expects - forwarded unchanged, same as every topology route.
            - id: heimdall_admin
              uri: lb://heimdall-gebo-ai
              predicates:
                - Path=/heimdall/api/admin/**

# Dedicated HTTP port. Every Gebo microservice owns one port of the 13000-13017
# block (gateway 13000 ... eureka 13017), so the whole deployment can run side by
# side on a single host and every container publishes that same port. The gateway
# is the edge: this is where the Angular UI and the aggregated API are served.
server:
  port: 13000

# ---------------------------------------------------------------------------
# Swagger / OpenAPI console (aggregated).
#
# INERT unless the gateway is built with -P swagger-on: without that profile
# springdoc is not on the classpath, nothing reads these keys, no /swagger-ui/**
# is served, and GeboGatewaySwaggerRoutingConfig (@ConditionalOnClass) registers
# no api-docs routes. Production builds therefore expose no API console at all.
#
# The gateway owns no controller, so its own spec is empty; what it serves is the
# BACKENDS' specs. Each entry below is one item of the Swagger UI's "Select a
# definition" dropdown AND, read back by GeboGatewaySwaggerRoutingConfig, one
# proxy route:  <url>  ->  lb://<name>/<contextPath>/v3/api-docs  (the backend's
# own server.servlet.context-path, e.g. /brain, prefixed onto the standard path).
#
#   name = the microservice id (its Eureka service-id / lb:// target)
#   url  = the gateway path the browser fetches that spec from
#
# Only services that are themselves built with THEIR swagger-on profile publish
# a /v3/api-docs to proxy - today: brain, vectorizator, graphicator, fulltextor,
# tyr. Adding a service to the console is one entry here.
# ---------------------------------------------------------------------------
springdoc:
  swagger-ui:
    urls:
      - name: brain_gebo_ai
        url: /api-docs/brain_gebo_ai
      - name: vectorizator_gebo_ai
        url: /api-docs/vectorizator_gebo_ai
      - name: graphicator_gebo_ai
        url: /api-docs/graphicator_gebo_ai
      - name: fulltextor_gebo_ai
        url: /api-docs/fulltextor_gebo_ai
      - name: tyr_gebo_ai
        url: /api-docs/tyr_gebo_ai

# Eureka discovery client. This is what gives the gateway a populated
# DiscoveryClient, so lb://<microserviceId> routes and Spring Cloud LoadBalancer
# actually resolve backend instances (previously there was no discovery source, so
# lb:// had no servers). Points at the eureka.gebo.ai registry; override
# EUREKA_CLIENT_SERVICEURL_DEFAULTZONE for a distributed deployment.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:13017/eureka/}
  instance:
    # Registered under the DNS-safe id: a URI host cannot contain '_', so
    # lb://gateway_gebo_ai is unroutable ("Invalid host"). virtual-host-name is the
    # key Spring Cloud actually resolves instances BY, so appname alone is not
    # enough. spring.application.name keeps the canonical id for topology/queues.
    appname: gateway-gebo-ai
    virtual-host-name: gateway-gebo-ai
    secure-virtual-host-name: gateway-gebo-ai
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Shared microservices topology (3 levels):
#   microserviceId  ->  messagingModuleId  ->  [ messagingSystemId ]
#
# microserviceId is the microservice name in its dot-free, underscore form
# (e.g. brain_gebo_ai). It is derived from the application name by the rule
# '.' -> '_'. A running service discovers itself by applying the same rule to its
# spring.application.name. So this one map drives both the messaging routing table
# (each service's <id>.inputq) and the gateway/LoadBalancer set.
#
# NOTE the underscore id is NOT the LoadBalancer service-id: a URI host may not
# contain '_', so lb://brain_gebo_ai has a null host and Spring Cloud Gateway
# rejects it ("Invalid host"). The service-id is the id's DNS-SAFE form
# ('_' -> '-', e.g. brain-gebo-ai), which each service registers as its Eureka
# appname/virtual-host-name; the gateway derives it with
# GeboMicroservice.toDiscoveryServiceId(). Keys below stay canonical.
#
# This is the COMPLETE, code-deduced topology, materialised here so it can be
# edited without recompiling. It is bound by GeboMicroservicesTopologyProperties
# into a GeboMicroservicesTopology bean.
#
#   include-defaults: false  -> this block is the whole truth for the gateway
#                               (add/remove/modify a service here and it takes
#                               effect). Set true to instead ADD to / OVERRIDE
#                               the built-in defaults shipped in the topology jar.
#
# Keys are plain (underscore) - no dots - so no Spring bracket syntax is needed.
# systemIds are list values and may contain dots freely.
#
# Notes on systemIds:
#   * Processing modules expose stable, code-declared systems.
#   * Content-handler modules host the shared content-infrastructure systems
#     (module-ioc-dispatcher-component, resources-dispose-component,
#     system-settings-controller-component) plus a Content.Handler.<code> system
#     that most handlers register DYNAMICALLY per configured endpoint - add those
#     here as needed.
# ---------------------------------------------------------------------------
gebo:
  microservices:
    topology:
      include-defaults: false
      services:
        # --- Core / orchestration services ---
        brain_gebo_ai:
          core-module:
            - user-messages-concentrator-component
            - mongo-dispose-documents-component
            - session-shrinker
            - sessionLifeCycleService
          brain-module: []
        # heimdall_gebo_ai is a microservice (AuthN/AuthZ + secrets) but hosts NO
        # messaging module, so it has no entry in this messaging topology map - and
        # therefore gets no route from the topology locator. It is routed by hand,
        # admin surface only, in spring.cloud.gateway...routes above: a blanket route
        # would also publish its cluster secrets surface at the edge.
        #
        # Note this map is the gateway's OWN topology (include-defaults: false). The
        # other services keep the built-in defaults from the topology jar, where
        # heimdall_gebo_ai IS a member - which is what lets their secrets client
        # resolve its base url. Do not "fix" the omission by adding it here.
        chunker_gebo_ai:
          tokenizer-module:
            - tokenizer-component
            - dispose-chunking-session-for-jobs
        # rag-threashold-autotune-module.rag-threashold-autotune-component is not
        # implemented by vectorizator - see GeboStandardMicroservices for why it must
        # stay out of this map (only brain has that local component, and it's a
        # same-service broadcast receiver, never a cross-service target).
        vectorizator_gebo_ai:
          vectorizator-module:
            - vectorization-component
            - vectorization-emitter-component
            - vectorization-dispose-component
        # fulltextor is the renamed textsearch microservice (full-text host).
        fulltextor_gebo_ai:
          fulltext-module:
            - fulltext-indexing-component
        # graphicator is the renamed graphsearch microservice (knowledge-graph host).
        graphicator_gebo_ai:
          knowledge-graph-module:
            - knowledge-graph-component
        # tyr is the workflows/usage/jobs-tracking microservice. It does not implement
        # scheduler-module.scheduler-component or async-publishing-job-module's
        # async-publishing-job-component/job-status-notifier - those are pure
        # same-service local self-loops on every content-handler (see
        # GeboStandardMicroservices for the full explanation) - so they must stay out
        # of this map. job-status-replication-receiver is one genuine component;
        # jobs-master-module/user-messages-concentrator-component is the other - every
        # content-processing microservice sends GContentsProcessingStatusUpdatePayload
        # there to feed ContentsBatchProcessedRepository (see GeboStandardMicroservices).
        tyr_gebo_ai:
          async-publishing-job-module:
            - job-status-replication-receiver
          jobs-master-module:
            - user-messages-concentrator-component
            - end-of-workflow-compute-service

        # --- Content services (one per gebo.systems.parent handler) ---
        # Each hosts the shared content-infrastructure systems; some also a
        # static default Content.Handler.<code>. Additional Content.Handler.<code>
        # systems are registered dynamically per configured endpoint - add here.
        git_gebo_ai:
          git-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
            - Content.Handler.DEFAULT.GIT.CONTENT.HANDLER
        filesystem_gebo_ai:
          shared-filesystem-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
            - Content.Handler.DEFAULT.FILESYSTEM.CONTENT.HANDLER
        uploads_gebo_ai:
          uploads-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
            - Content.Handler.DEFAULT.UPLOADS.CONTENT.HANDLER
        userspace_gebo_ai:
          userspace-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
            - Content.Handler.USERSPACE-CONTENTSYSTEM
        sharepoint_gebo_ai:
          sharepoint-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        confluence_gebo_ai:
          confluence-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        jira_gebo_ai:
          jira-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        aws_s3_gebo_ai:
          aws-s3-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        googledrive_gebo_ai:
          google-drive-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        mcpclient_gebo_ai:
          mcp-client-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        # webdav-cms.handler's own module id kept the pre-existing "webdab" spelling
        # (GStandardModulesConstraints.WEBDAB_CMS_MODULE) - not a typo introduced here.
        webdav_gebo_ai:
          webdab-cms-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
        integration_gebo_ai:
          integration-module:
            - module-ioc-dispatcher-component
            - resources-dispose-component
            - system-settings-controller-component
