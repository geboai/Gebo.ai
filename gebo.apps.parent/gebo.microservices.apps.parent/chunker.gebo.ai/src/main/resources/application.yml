spring:
  application:
    # Canonical microservice id (underscore form): matches the shared topology
    # entry and the Eureka service-id that @LoadBalanced / lb:// lookups resolve.
    name: chunker_gebo_ai

# Eureka discovery client: registers this service under its application name
# (chunker_gebo_ai) so client-side load balancing resolves it to a live instance.
# Points at the eureka.gebo.ai registry; override
# EUREKA_CLIENT_SERVICEURL_DEFAULTZONE for a distributed deployment.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    # Registered under the DNS-safe id: a URI host cannot contain '_', so
    # lb://chunker_gebo_ai is unroutable ("Invalid host"). virtual-host-name is the
    # key Spring Cloud actually resolves instances BY, so appname alone is not
    # enough. spring.application.name keeps the canonical id for topology/queues.
    appname: chunker-gebo-ai
    virtual-host-name: chunker-gebo-ai
    secure-virtual-host-name: chunker-gebo-ai
    prefer-ip-address: true
