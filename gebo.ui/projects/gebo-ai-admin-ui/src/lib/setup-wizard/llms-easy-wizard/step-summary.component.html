<div class="grid">
  <div class="col-12">
    @if (setupComplete) {
      <span id="SummaryComplete" class="gebo-status-title" gebo-ai-text>
        The required models are configured. The system is ready to work.
      </span>
    } @else {
      <span id="SummaryIncomplete" class="gebo-status-meta" gebo-ai-text>
        A default chat model and an embedding model are still required for the system to work.
      </span>
    }
  </div>

  <div class="col-12">
    <p-fieldset id="ActiveConfigSection" gebo-ai-label legend="Active configuration">
      <div class="grid">
        @for (row of rows; track row.descriptor.id) {
          <div class="col-12 md:col-6">
            <gebo-ai-field [id]="row.descriptor.fieldId" [label]="row.label">
              <div gebo-ai-field-element>
                <gebo-ai-llms-easy-class-status [configured]="row.configured"
                  [required]="row.descriptor.required" [currentCode]="row.currentCode"
                  [currentProvider]="row.currentProvider" [providers]="row.providers">
                </gebo-ai-llms-easy-class-status>
              </div>
            </gebo-ai-field>
          </div>
        }
      </div>
    </p-fieldset>
  </div>
</div>
