@if (configured) {
  <span class="pi pi-check-circle gebo-easy-status-icon gebo-easy-status-icon--ok"></span>
  @if (currentCode) {
    <span class="gebo-status-title">{{currentCode}}</span>
    @if (currentProvider) {
      <span class="gebo-status-meta"> &nbsp;({{currentProvider}})</span>
    }
  }
} @else {
  <span class="pi pi-times-circle gebo-easy-status-icon"
    [style.color]="required ? 'var(--gebo-danger, #dc2626)' : 'var(--gebo-text-strong, #111827)'"></span>
  <span id="ClassStatusNotConfigured" class="gebo-status-meta" gebo-ai-text>Not configured yet</span>
  @if (providers.length) {
    <div class="gebo-easy-supported">
      <span id="ClassStatusSupportedBy" class="gebo-easy-supported__label" gebo-ai-text>Supported by providers:</span>
      <span class="gebo-easy-supported__names">{{providers.join(', ')}}</span>
    </div>
  }
}
