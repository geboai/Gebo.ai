<p-panel id="EasySetupLLMS" [formGroup]="formGroup">
    <div class="grid">
        <div class="col-12">
            <gebo-ai-field id="vendorId" label="Choose your large language model vendor"
                help="Choose the initial vendor for your default chat and embedding models">
                <p-selectbutton [options]="choosableVendors" formControlName="vendorId" optionLabel="name"
                    optionValue="vendorId" aria-labelledby="basic" [required]="true" gebo-ai-field-element />
            </gebo-ai-field>
        </div>
        <div class="col-4" *ngIf="choosableIdentities?.length">
            <gebo-ai-field id="secretId" label="Choose provider credentials (api key)" help="Choose one of the existing credentials for the selected llm provider">
                <geboai-editable-listbox-component [data]="choosableIdentities" formControlName="secretId"></geboai-editable-listbox-component>
            </gebo-ai-field>
        </div>
        <div class="col-4" *ngFor="let preset of presetsSummary">
             <gebo-ai-field *ngIf="preset.type==='CHAT' && preset.mainUse==='CHAT'" id="ChatModel" label="Default chat model" help="The default chat model will be responsable on answering users questions, and executing worflows for wich there aren't specifically configured models. It has to be powerfull and reliable, with a good balance between cost, performance and outcome quality.">
                <geboai-editable-listbox-component formControlName="defaultChatModel" [data]="preset.presetChoices" gebo-ai-field-element ></geboai-editable-listbox-component>
             </gebo-ai-field>
             <gebo-ai-field *ngIf="preset.type==='CHAT' && preset.mainUse==='INTERNAL_SERVICES'" id="InternalServiceModel" label="Internal services chat model" help="The chat model configured for internal services will be responsable on extracting informations, summarizing and executing internal workflows.">
                <geboai-editable-listbox-component formControlName="internalServicesModel" [data]="preset.presetChoices" gebo-ai-field-element ></geboai-editable-listbox-component>
             </gebo-ai-field>
             <gebo-ai-field *ngIf="preset.type==='EMBEDDING'" id="EmbeddingModel" label="Default embedding model" help="This model will be responsable of doing semantic indexing (embedding) and retrieve of your data and documents">
                <geboai-editable-listbox-component formControlName="embeddingModel" [data]="preset.presetChoices" gebo-ai-field-element ></geboai-editable-listbox-component>
             </gebo-ai-field>
        </div>
    </div>
</p-panel>
