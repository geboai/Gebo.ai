<p-blockUI id="BlockUi" gebo-ai-label [target]="EasySetupLLMS" [blocked]="loading || modelsLookupsRunning>0">
    <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="EasySetupLLMS" #EasySetupLLMS [formGroup]="formGroup">
    <div class="grid">
        <div class="col-4 col-sm-12 col-xs-12">
            <gebo-ai-field id="vendorId" label="Choose your large language model vendor" [required]="true"
                help="Choose the initial vendor for your default chat and embedding models">
                <p-selectbutton [options]="choosableVendors" formControlName="vendorId" optionLabel="name"
                    optionValue="vendorId" aria-labelledby="basic" [required]="true" gebo-ai-field-element
                    [allowEmpty]="false" />
            </gebo-ai-field>
        </div>
        <div class="col-4  col-sm-12 col-xs-12">
            <gebo-ai-field id="WebSiteLink" label="Provider web site"
                help="Click here for general provider informations.">
                <a [href]="vendorSetupMetaInfos?.parentModel?.webSite" target="_blank"
                    gebo-ai-field-element>{{vendorSetupMetaInfos?.parentModel?.webSite}}</a>
            </gebo-ai-field>
        </div>
        <div class="col-4 col-sm-12 col-xs-12"><gebo-ai-field id="AcquireCreditLink" label="Purchase provider's credit"
                help="Click here to buy credit for your api key(s).">
                <a [href]="vendorSetupMetaInfos?.parentModel?.acquireKeyUrl" target="_blank"
                    gebo-ai-field-element>{{vendorSetupMetaInfos?.parentModel?.acquireKeyUrl}}</a>

            </gebo-ai-field>
        </div>
        <div class="col-12">
            <gebo-ai-api-key-component formControlName="secretId" [contextCode]="secretContext"
                [apiKeyDescription]="secretDescription" [backendValidation]="validateCredentials"
                [backendValidationOnChange]="true"></gebo-ai-api-key-component>
        </div>
        <div class="col-12" *ngIf="presetsSummary.length>0">
            <p-toggleButton id="ToggleLlmsDetail" gebo-ai-label [(ngModel)]="showLlmsDetail"
                [ngModelOptions]="{standalone:true}" onLabel="Choose llms" offLabel="Suggested settings"
                onIcon="pi pi-eye" offIcon="pi pi-eye-slash"></p-toggleButton>
        </div>
        <ng-container *ngIf="showLlmsDetail">
        <div class="col-4 col-xs-12 col-sm-6" *ngFor="let preset of presetsSummary">
            <gebo-ai-field *ngIf="preset.type==='CHAT' && preset.mainUse==='CHAT'" id="ChatModel"
                label="Default chat model"
                help="The default chat model will be responsable on answering users questions, and executing worflows for wich there aren't specifically configured models. It has to be powerfull and reliable, with a good balance between cost, performance and outcome quality.">
                <geboai-editable-listbox-component formControlName="defaultChatModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <gebo-ai-field *ngIf="preset.type==='CHAT' && preset.mainUse==='INTERNAL_SERVICES'"
                id="InternalServiceModel" label="Internal services chat model"
                help="The chat model configured for internal services will be responsable on extracting informations, summarizing and executing internal workflows.">
                <geboai-editable-listbox-component formControlName="internalServicesModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <gebo-ai-field *ngIf="preset.type==='EMBEDDING'" id="EmbeddingModel" label="Default embedding model"
                help="This model will be responsable of doing semantic indexing (embedding) and retrieve of your data and documents">
                <geboai-editable-listbox-component formControlName="embeddingModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <gebo-ai-field *ngIf="preset.type==='RANKING'" id="RankingModel" label="Default ranker model"
                help="This model will be responsable of doing reranking on your documents and score most fitting for your questions">
                <geboai-editable-listbox-component formControlName="rankerModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <gebo-ai-field *ngIf="preset.type==='TRANSCRIPT'" id="ImagesModel" label="Default transcript model"
                help="This model will be responsable of transcript service">
                <geboai-editable-listbox-component formControlName="transcriptModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <gebo-ai-field *ngIf="preset.type==='TTS'" id="ImagesModel" label="Default text to speech model"
                help="This model will be responsable of doing text to speech conversion">
                <geboai-editable-listbox-component formControlName="ttsModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <gebo-ai-field *ngIf="preset.type==='IMAGESGEN'" id="ImagesModel" label="Default image generation model"
                help="This model will be responsable of doing image generation">
                <geboai-editable-listbox-component formControlName="imagesModel" [data]="preset.modelChoices"
                    gebo-ai-field-element></geboai-editable-listbox-component>
            </gebo-ai-field>
            <!-- Only one field is rendered per preset, so this flags the combo just above it -->
            <div *ngIf="preset.presetUnavailable"
                class="p-message p-message-error flex align-items-center p-2 gap-2 mt-2"
                style="background-color: #fde7e9; border-left: 6px solid #e24c4c; color: #b3261e;">
                <span class="p-message-icon pi pi-exclamation-circle" style="font-size: 1.2rem;"></span>
                <div class="p-message-text" gebo-ai-text>Preconfigured model is not in this provider anymore, please
                    select one</div>
            </div>
        </div>
        </ng-container>
        <div class="col-12"></div>
        <div class="col-3">
            <p-button id="CreateAdvancedBtn" gebo-ai-label [outlined]="true" label="Create and activate"
                (onClick)="doAutoConfigure()" [disabled]="formGroup.invalid" icon="pi pi-save" severity="success"
                styleClass="w-full"></p-button>
        </div>
    </div>
</p-panel>
