<p-blockUI id="BlockUILock"  [target]="mcpUI" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #mcpUI header="Configure Gebo MCP Servers">
  <div class="grid geboLargeButtonsBar">
    <div class="col-6">
      <p-button id="McpAddBtn" gebo-ai-label icon="pi pi-plus" label="Add MCP Server Configuration" styleClass="w-full" [outlined]="true"
        (onClick)="addMcpConfig()"></p-button>
    </div>
  </div>
  <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
  <div class="grid">
    <div class="col-12">
      <p-table id="Table" gebo-ai-label [value]="mcpConfigs" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header pTemplate="header">
          <tr>
            <th id="ConfigCodeHeader" gebo-ai-text>Config code</th>
            <th id="DescriptionHeader" gebo-ai-text>Description</th>
            <th id="UrlHeader" gebo-ai-text>Relative URL</th>
            <th id="EnabledHeader" gebo-ai-text>Enabled</th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template #body let-item pTemplate="body">
          <tr>
            <td>{{ item.code }}</td>
            <td>{{ item.description }}</td>
            <td>{{ item.exportedUniqueRelativeUrl }}</td>
            <td>
              <i class="pi" [ngClass]="{'pi-check-circle text-green-500': item.enabled, 'pi-times-circle text-red-500': !item.enabled}"></i>
            </td>
            <td>
              <p-button id="EditMcpBtn" gebo-ai-label label="Edit MCP Server" icon="pi pi-pencil" [outlined]="true"
                (onClick)="editMcpConfig(item)"></p-button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</p-panel>
