<p-tabs [value]="0">
  <p-tablist>
    @for (tab of endpointTabs; track tab; let i = $index) {
      <p-tab [value]="i" gebo-ai-text>{{tab.label + ' logs'}}</p-tab>
    }
  </p-tablist>
  <p-tabpanels>
    @for (tab of endpointTabs; track tab; let i = $index) {
      <p-tabpanel [value]="i">
        <gebo-ai-log-table-component [className]="tab.className" [jobType]="'CONTENTS_READING_VECTORIZING'"></gebo-ai-log-table-component>
      </p-tabpanel>
    }
  </p-tabpanels>
</p-tabs>
