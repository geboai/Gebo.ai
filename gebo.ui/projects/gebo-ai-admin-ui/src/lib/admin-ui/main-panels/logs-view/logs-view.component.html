<div class="grid">
  <div class="col-12">
    <gebo-ai-field id="datasourceTypes" label="Data source types"
      help="Data source types whose ingestion logs are listed. Leave empty to list them all.">
      <p-multiselect id="datasourceTypesSelector" gebo-ai-label gebo-ai-field-element styleClass="w-full"
        [options]="endpointTypes" optionLabel="label" optionValue="className" [(ngModel)]="selectedClassNames"
        [showToggleAll]="true" [filter]="true" placeholder="All data source types"></p-multiselect>
    </gebo-ai-field>
  </div>
  <div class="col-12">
    <gebo-ai-log-table-component [classNames]="selectedClassNames"
      [jobType]="'CONTENTS_READING_VECTORIZING'"></gebo-ai-log-table-component>
  </div>
</div>
