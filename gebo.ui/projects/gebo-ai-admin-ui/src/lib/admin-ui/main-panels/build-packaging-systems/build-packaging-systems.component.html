<p-tabs [value]="0">
  <p-tablist>
    @for (item of nodes; track item; let i = $index) {
      <p-tab [value]="i">{{titleOf(item)}}</p-tab>
    }
  </p-tablist>
  <p-tabpanels>
  @for (item of nodes; track item; let i = $index) {
    <p-tabpanel [value]="i">
      <p-table  [value]="item.configs" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th id="CodeHeader" gebo-ai-text>Code</th>
            <th id="DescriptionHeader" gebo-ai-text>Description</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-config>
          <tr>
            <td>{{ config.code }}</td>
            <td>{{ config.description }}</td>
          </tr>
        </ng-template>
      </p-table>
    </p-tabpanel>
  }
  </p-tabpanels>
</p-tabs>
