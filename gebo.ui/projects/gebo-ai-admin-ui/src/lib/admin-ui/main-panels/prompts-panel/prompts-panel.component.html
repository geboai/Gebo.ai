<p-blockUI id="PromptsBlockUI" [target]="promptUI" [blocked]="loadingPrompts">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="PromptsPanel" gebo-ai-label #promptUI header="Prompt templates">
  @if (prompts?.length) {
    <p-table [value]="prompts" [paginator]="true" [rows]="promptsPageSize" [first]="promptsFirst"
      [rowsPerPageOptions]="[10, 20, 30]" (onPage)="onPromptPageChange($event)"
      responsiveLayout="scroll" styleClass="p-datatable-striped">
      <ng-template pTemplate="header">
        <tr>
          <th id="UseCodeHeader" gebo-ai-text>Use code</th>
          <th id="LanguageHeader" gebo-ai-text>Language</th>
          <th id="DescriptionHeader" gebo-ai-text>Description</th>
          <th id="EmptyHeader" gebo-ai-text></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-model>
        <tr>
          <td>
            {{ model.promptUse }}
            @if (model.configDeclarated) {
              <i class="pi pi-lock ml-2 text-secondary" title="Declared in the server configuration"></i>
            }
          </td>
          <td>{{ model.langCode }}</td>
          <td>{{ model.description }}</td>
          <td><p-button id="ConfigureBtn" gebo-ai-label (onClick)="editPrompt(model)" [outlined]="true"
            label="configure" icon="pi pi-wrench"></p-button></td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-panel>
