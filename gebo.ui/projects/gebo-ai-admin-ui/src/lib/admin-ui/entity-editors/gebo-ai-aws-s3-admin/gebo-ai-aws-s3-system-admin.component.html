<p-blockUI id="LockIconBlockUI"  [target]="awsS3SystemCtrl" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #awsS3SystemCtrl header="Editing AWS S3 system" [formGroup]="formGroup">
  @if (!isWizardMode) {
    <div class="geboButtonsBar" style="vertical-align: baseline;">
      <div class="grid">
        <div class="col-3">
          <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save" severity="success"
          [disabled]="this.formGroup.invalid || canSave===false" styleClass="w-full"></p-button>
        </div>
        <div class="col-3">
          <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)"
            styleClass="w-full" />
          </div>
          <div class="col-3">
            <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash" (onClick)="doDelete()"
              styleClass="w-full" [disabled]="canDelete===false" />
            </div>
          </div>
        </div>
      }

      <div class="geboDialogContent">
        <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
        <p-tabs [value]="0">
            <p-tablist>
              <p-tab [value]="0" gebo-ai-text>General settings</p-tab>
            </p-tablist>
            <p-tabpanels>
          <p-tabpanel [value]="0">
            <div class="grid">

              <div class="col-6">
                <gebo-ai-field id="description" label="Description" help="Enter the description of the AWS S3 system." [required]="true">
                  <input
                    id="description"
                    formControlName="description"
                    maxlength="120"
                    [required]="true"
                    pInputText
                    gebo-ai-field-element
                    />
                  </gebo-ai-field>
                </div>
                <div class="col-6">
                  <gebo-ai-field id="code" label="Unique Code" help="Automatically generated unique code of the AWS S3 system.">
                    <input
                      id="code"
                      formControlName="code"
                      readonly="true"
                      pInputText
                      gebo-ai-field-element
                      />
                    </gebo-ai-field>
                  </div>
                  <div class="col-6">
                    <gebo-ai-field id="awsEndpoint" label="Custom S3 endpoint" help="Optional custom S3-compatible endpoint URL. Leave empty to use the standard AWS S3 endpoint for the region defined in the identity.">
                      <input
                        type="text"
                        id="awsEndpoint"
                        formControlName="awsEndpoint"
                        class="col-12"
                        pInputText
                        gebo-ai-field-element
                        />
                      </gebo-ai-field>
                    </div>
                    <div class="col-6">
                      <gebo-ai-field id="s3SecretCode" label="Identity used" help="Select or create the AWS connection identity (access key, secret key and region) to access the AWS S3 system" [required]="true">
                        <geboai-editable-listbox-component
                          id="s3SecretCode"
                          formControlName="s3SecretCode"
                          placeholder="Select an identity"
                          [optionsObservable]="identitiesObservable"
                          [required]="true"
                          [createNewRecordRequest]="newSecretAction"
                          gebo-ai-field-element
                          >
                        </geboai-editable-listbox-component>
                      </gebo-ai-field>
                    </div>
                  </div>
                </p-tabpanel>
              </p-tabpanels>
          </p-tabs>
            </div>
          </p-panel>
