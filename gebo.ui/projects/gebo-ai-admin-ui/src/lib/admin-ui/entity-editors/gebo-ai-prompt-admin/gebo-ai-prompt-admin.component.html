<p-blockUI id="LockBlockUI" [target]="promptAdminUI" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #promptAdminUI header="Editing prompt template">
  @if (!isWizardMode) {
    <div class="geboButtonsBar" style="vertical-align: baseline;">
      <div class="grid">
        <div class="col-4">
          <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()"
            icon="pi pi-save" severity="success" [disabled]="saveDisabled" styleClass="w-full"></p-button>
        </div>
        <div class="col-4">
          <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast"
            (onClick)="cancelAction.emit(true)" styleClass="w-full" />
        </div>
        <div class="col-4">
          <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger"
            icon="pi pi-trash" (onClick)="doDelete()" styleClass="w-full" [disabled]="deleteDisabled" />
        </div>
      </div>
    </div>
  }
  <div class="geboDialogContent">
    <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
    @if (!editingEnabled) {
      <p-message id="EditingDisabledMsg" severity="info" styleClass="w-full mb-2">
        <span id="EditingDisabledText" gebo-ai-text>Prompt template editing is disabled on this deployment; the editor is read only.</span>
      </p-message>
    }
    <div class="grid" [formGroup]="formGroup">
      <div class="col-12">
        <gebo-ai-prompt-editing-component formControlName="promptTemplate"></gebo-ai-prompt-editing-component>
      </div>
    </div>
  </div>
</p-panel>
