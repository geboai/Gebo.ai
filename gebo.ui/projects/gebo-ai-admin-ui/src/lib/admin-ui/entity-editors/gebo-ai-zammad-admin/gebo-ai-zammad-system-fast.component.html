<p-blockUI id="BlockUI" [target]="zammadSystemCtrl" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #zammadSystemCtrl header="Create Zammad system configuration" [formGroup]="formGroup">
  <div class="geboButtonsBar" style="vertical-align: baseline;">
    <div class="grid">
      <div class="col-4">
        <p-button id="CreateBtn" gebo-ai-label [outlined]="true" label="Create" (onClick)="doInsert()" icon="pi pi-save" severity="success"
          styleClass="w-full" [disabled]="this.formGroup.invalid || loading"></p-button>
      </div>
      <div class="col-4">
        <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)"
          styleClass="w-full" />
      </div>
    </div>
  </div>

  <div class="geboDialogContent">
    <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>

    <div class="grid">
      <div class="col-6">
        <gebo-ai-field id="description" label="Description" help="Enter the description of the Zammad system." [required]="true">
          <input pInputText id="description" formControlName="description" maxlength="120" [required]="true" gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-12">
        <gebo-ai-field id="baseUri" label="Base internet address" help="Address of the Zammad server, without /api/v1 (e.g. https://helpdesk.example.com)" [required]="true">
          <input type="text" id="baseUri" pInputText formControlName="baseUri" class="col-12 required" [required]="true" gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="accessToken" label="Access token" help="Access token of the Zammad account Gebo.ai reads with (Profile, Token Access), with the ticket.agent and knowledge_base.reader permissions. Token access must be enabled in Settings, System, API." [required]="true">
          <input type="password" pInputText id="accessToken" formControlName="accessToken" class="col-12 required" [required]="true" gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-12">
        <small id="VisibilityNote" gebo-ai-text>Gebo.ai reads what this account can see in Zammad, internal notes and internal answers included: use an agent limited to the groups you want to share.</small>
      </div>
    </div>
  </div>
</p-panel>
