<p-blockUI id="BlockUi" gebo-ai-label [target]="anthropicUI" [blocked]="loading">
    <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #anthropicUI header="Editing deep search configuration" [formGroup]="formGroup">
    <div class="geboDialogContent">
        <p-messages id="Messages" gebo-ai-label [(value)]="userMessages" [enableService]="false" [closable]="false" />
        <p-tabView id="TabView" gebo-ai-label class="standardTabDialogueHeight">
            <p-tabPanel id="SearchSettingTab" gebo-ai-label header="Search setting">

                <div class="grid geboDialogContent">
                    <div class="col-6">
                        <gebo-ai-field id="description" label="Description"
                            help="Enter the description of the deep search configuration" [required]="true">
                            <input pInputText id="description" formControlName="description" maxlength="120"
                                [required]="true" gebo-ai-field-element />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6">
                        <gebo-ai-field id="code" label="Unique Code"
                            help="Automatically generated unique code of the deep search configuration">
                            <input pInputText id="code" formControlName="code" readonly="true" gebo-ai-field-element />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6">
                        <gebo-ai-field id="searchType" label="Search type"
                            help="Select between single hop semantic search or multi hop" [required]="true">
                            <p-selectbutton [options]="searchTypeOptions" formControlName="searchType"
                                optionLabel="description" optionValue="code" [required]="true" />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6" [formGroup]="getform('ragQueryOptions')">
                        <gebo-ai-field id="topK" label="Number of retrieved text segments (TopK)"
                            title="Number of retrieved text segments in similarity with the user text that will be retrieved"
                            [required]="true">
                            <p-inputNumber id="topK" formControlName="topK" [min]="1" [max]="1000"
                                [maxFractionDigits]="0" styleClass="w-full" gebo-ai-field-element />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6" *ngIf="!searchType || searchType==='MULTI_HOP'">
                        <gebo-ai-field id="firstHopSimilarityThreashold" label="Search similarity threashold"
                            help="First hop semantic similarity threashold (between 0.5 to 1.0)">
                            <p-inputNumber id="firstHopSimilarityThreashold"
                                formControlName="firstHopSimilarityThreashold" [min]="minThreashold"
                                [max]="maxThreashold" [maxFractionDigits]="2" styleClass="w-full"
                                gebo-ai-field-element />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6" *ngIf="!searchType || searchType==='MULTI_HOP'">
                        <gebo-ai-field id="secondHopSimilarityThreashold" label="Second hop similarity threashold"
                            help="Second hop semantic similarity threashold (between 0.5 to 1.0)">
                            <p-inputNumber id="secondHopSimilarityThreashold"
                                formControlName="secondHopSimilarityThreashold" [min]="minThreashold"
                                [max]="maxThreashold" [maxFractionDigits]="2" styleClass="w-full"
                                gebo-ai-field-element />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6" *ngIf="searchType==='SINGLE_HOP'" [formGroup]="getform('ragQueryOptions')">
                        <gebo-ai-field id="similarityThreashold" label="Search similarity threashold"
                            help="Semantic similarity threashold (between 0.5 to 1.0)">
                            <p-inputNumber formControlName="similarityThreashold" [min]="minThreashold"
                                [max]="maxThreashold" [maxFractionDigits]="2" styleClass="w-full"
                                gebo-ai-field-element />
                        </gebo-ai-field>
                    </div>
                    <div class="col-6" *ngIf="searchType==='SINGLE_HOP'">

                    </div>
                </div>
            </p-tabPanel>
            <p-tabPanel id="LLmsSettingsTab" gebo-ai-label header="Large language model setting">
                <div class="grid geboDialogContent">
                    <div class="col-6">
                        <gebo-ai-field id="chatModelConfiguration" label="Used llm" help="Specify large language model used for Deep search, default one will be
                                    used if none is selected.">
                            <p-select gebo-ai-field-element styleClass="w-full" formControlName="chatModelConfiguration"
                                styleClass="w-full" id="chatModelConfiguration" [options]="chatModelsData"
                                optionLabel="description"></p-select>
                        </gebo-ai-field>

                    </div>
                    <div class="col-6"
                        *ngIf="formGroup.controls['chatModelConfiguration']?.value?false:true && defaultChatModel">
                        <gebo-ai-field id="defaultModel" label="Default large language model"
                            help="The default large language model will be used for Deep search processing">
                            <label id="defaultModel">{{defaultChatModel?.description}}</label>
                        </gebo-ai-field>

                    </div>
                    <div class="col-12">
                        <gebo-ai-field id="analisysPrompt" label="Documents analisys prompt"
                            help="Edit the prompt that will be used for documents fragment relevant information extraction.">
                            <textarea rows="6" cols="250" pTextarea id="analisysPromptCtrl" gebo-ai-label
                                placeholder="Insert prompt for documents relevant information extraction"
                                formControlName="analisysPrompt" gebo-ai-field-element></textarea>
                        </gebo-ai-field>
                    </div>
                    <div class="col-3">
                        <gebo-ai-prompt-wizard-component [deliveryFormGroup]="formGroup"
                            deliveryPromptControlName="analisysPrompt"
                            [ragWizardMode]="false"></gebo-ai-prompt-wizard-component>
                    </div>
                    <div class="col-9">

                    </div>
                    <div class="col-12">
                        <gebo-ai-field id="consolidationPrompt" label="Extracted informations consolidation prompt"
                            help="Edit the prompt that will be used to consolidate in a single report rilevant informations extracted from retrieved documents.">
                            <textarea rows="6" cols="250" pTextarea id="consolidationPromptCtrl" gebo-ai-label
                                placeholder="Insert prompt for extracted relevant information consolidation" formControlName="consolidationPrompt" gebo-ai-field-element></textarea>
                        </gebo-ai-field>
                    </div>
                    <div class="col-3">
                        <gebo-ai-prompt-wizard-component [deliveryFormGroup]="formGroup"
                            deliveryPromptControlName="consolidationPrompt"
                            [ragWizardMode]="false"></gebo-ai-prompt-wizard-component>
                    </div>
                    <div class="col-9">

                    </div>
                </div>

            </p-tabPanel>
        </p-tabView>
        <div class="geboButtonsBar" style="vertical-align: baseline;" *ngIf="!isWizardMode">
            <div class="grid">
                <div class="col-4">
                    <p-button id="InsertBtn" gebo-ai-label [outlined]="true" label="Insert" (onClick)="doSave()"
                        icon="pi pi-save" severity="success" [disabled]="this.formGroup.invalid || canSave===false"
                        styleClass="w-full"></p-button>
                </div>
                <div class="col-4">
                    <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast"
                        (onClick)="cancelAction.emit(true)" styleClass="w-full" />
                </div>
                <div class="col-4">
                    <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger"
                        icon="pi pi-trash" (onClick)="doDelete()" [disabled]="true" styleClass="w-full" />
                </div>
            </div>
        </div>
    </div>

</p-panel>
