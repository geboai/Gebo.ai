<p-blockUI id="BlockUI" gebo-ai-label [target]="bedrockUI" [blocked]="loading">
    <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #bedrockUI header="Editing Amazon Transcribe speech to text configuration" [formGroup]="formGroup">
    <div class="grid geboLargeButtonsBar" *ngIf="!isWizardMode">
        <div class="col-4">
            <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save"
                severity="success" [disabled]="this.formGroup.invalid || canSave===false" styleClass="w-full"></p-button>
        </div>
        <div class="col-4">
            <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)" styleClass="w-full"></p-button>
        </div>
        <div class="col-4">
            <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash" (onClick)="doDelete()" styleClass="w-full"
                [disabled]="canDelete===false"></p-button>
        </div>
    </div>
    <div class="geboDialogContent">
        <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
        <div class="grid standardTabDialogueHeight">
            <div class="col-6">
                <gebo-ai-field id="description" label="Description" help="Enter the description of the transcript configuration" [required]="true">
                    <input pInputText id="description" formControlName="description" maxlength="120" [required]="true"
                        gebo-ai-field-element />
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="code" label="Unique Code" help="Automatically generated unique code of the configuration">
                    <input pInputText id="code" formControlName="code" readonly="true" gebo-ai-field-element />
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="apiSecretCode" label="AWS credentials" help="Choose the AWS credentials (access key id / secret access key). Leave empty to use the instance IAM role.">
                    <geboai-editable-listbox-component formControlName="apiSecretCode" placeholder="Select AWS credentials"
                        [optionsObservable]="identitiesObservable"
                        [createNewRecordRequest]="newSecretAction" gebo-ai-field-element>
                    </geboai-editable-listbox-component>
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="region" label="AWS region" help="AWS region hosting the Amazon Transcribe endpoint (e.g. us-east-1)" [required]="true">
                    <input pInputText id="region" formControlName="region" maxlength="40" placeholder="us-east-1"
                        [required]="true" gebo-ai-field-element />
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="choosedModel" label="Transcribe model" help="Amazon Transcribe streaming mode." [required]="true">
                    <p-select styleClass="w-full" formControlName="choosedModel" id="choosedModel" placeholder="Select a model"
                        [required]="true" [options]="modelChoicesData" optionLabel="description" gebo-ai-field-element>
                    </p-select>
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="languageCode" label="Language code" help="BCP-47 language code of the audio (e.g. en-US)" [required]="true">
                    <input pInputText id="languageCode" formControlName="languageCode" maxlength="20" placeholder="en-US"
                        [required]="true" gebo-ai-field-element />
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="mediaEncoding" label="Media encoding" help="Encoding of the audio stream">
                    <p-select styleClass="w-full" formControlName="mediaEncoding" id="mediaEncoding" placeholder="Select an encoding"
                        [options]="mediaEncodingOptions" optionLabel="label" optionValue="value" gebo-ai-field-element>
                    </p-select>
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="sampleRateHertz" label="Sample rate (Hz)" help="Sample rate of the audio stream (default 16000)">
                    <input pInputText type="number" id="sampleRateHertz" formControlName="sampleRateHertz" gebo-ai-field-element />
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="defaultModel" label="set this as default transcript model" help="If true this will be used as default transcript model where none is indicated">
                    <p-checkbox formControlName="defaultModel" id="defaultModel" [binary]="true" [trueValue]="true"
                        [falseValue]="false" gebo-ai-field-element></p-checkbox>
                </gebo-ai-field>
            </div>
        </div>
    </div>
</p-panel>
