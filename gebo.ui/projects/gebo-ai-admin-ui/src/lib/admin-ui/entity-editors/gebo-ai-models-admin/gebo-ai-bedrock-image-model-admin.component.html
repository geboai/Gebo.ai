<p-blockUI id="BlockUI" gebo-ai-label [target]="bedrockUI" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #bedrockUI header="Editing AWS Bedrock image model configuration" [formGroup]="formGroup">
  @if (!isWizardMode) {
    <div class="grid geboLargeButtonsBar">
      <div class="col-4">
        <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save"
        severity="success" [disabled]="this.formGroup.invalid || canSave===false" styleClass="w-full"></p-button>
      </div>
      <div class="col-4">
        <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)" styleClass="w-full"></p-button>
      </div>
      <div class="col-4">
        <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash" (onClick)="doDelete()" styleClass="w-full"
        [disabled]="canDelete===false"></p-button>
      </div>
    </div>
  }
  <div class="geboDialogContent">
    <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
    <div class="grid standardTabDialogueHeight">
      <div class="col-6">
        <gebo-ai-field id="description" label="Description" help="Enter the description of the image model configuration" [required]="true">
          <input pInputText id="description" formControlName="description" maxlength="120" [required]="true"
            gebo-ai-field-element />
          </gebo-ai-field>
        </div>
        <div class="col-6">
          <gebo-ai-field id="code" label="Unique Code" help="Automatically generated unique code of the image model configuration">
            <input pInputText id="code" formControlName="code" readonly="true" gebo-ai-field-element />
          </gebo-ai-field>
        </div>
        <div class="col-6">
          <gebo-ai-field id="apiSecretCode" label="AWS credentials" help="Choose the AWS credentials (access key id / secret access key). Leave empty to use the instance IAM role.">
            <geboai-editable-listbox-component formControlName="apiSecretCode" placeholder="Select AWS credentials"
              [optionsObservable]="identitiesObservable"
              [createNewRecordRequest]="newSecretAction" gebo-ai-field-element>
            </geboai-editable-listbox-component>
          </gebo-ai-field>
        </div>
        <div class="col-6">
          <gebo-ai-field id="choosedModel" label="AWS Bedrock image model choice" help="Choose the AWS Bedrock image generation model to work with." [required]="true">
            <p-select styleClass="w-full" formControlName="choosedModel" id="choosedModel" placeholder="Select a model"
              [required]="true" [options]="modelChoicesData" optionLabel="description" gebo-ai-field-element>
            </p-select>
          </gebo-ai-field>
        </div>
        <div class="col-6">
          <gebo-ai-field id="defaultModel" label="set this as default image model" help="If true this will be used as default image model where an image model is not indicated">
            <p-checkbox formControlName="defaultModel" id="defaultModel" [binary]="true" [trueValue]="true"
            [falseValue]="false" gebo-ai-field-element></p-checkbox>
          </gebo-ai-field>
        </div>
        <div class="col-3">
          <gebo-ai-field id="width" label="Width (px)" help="Generated image width in pixels">
            <input pInputText type="number" id="width" formControlName="width" gebo-ai-field-element />
          </gebo-ai-field>
        </div>
        <div class="col-3">
          <gebo-ai-field id="height" label="Height (px)" help="Generated image height in pixels">
            <input pInputText type="number" id="height" formControlName="height" gebo-ai-field-element />
          </gebo-ai-field>
        </div>
        <div class="col-3">
          <gebo-ai-field id="cfgScale" label="CFG scale" help="Prompt adherence / classifier-free guidance scale">
            <input pInputText type="number" id="cfgScale" formControlName="cfgScale" gebo-ai-field-element />
          </gebo-ai-field>
        </div>
        <div class="col-3">
          <gebo-ai-field id="seed" label="Seed" help="Optional deterministic generation seed">
            <input pInputText type="number" id="seed" formControlName="seed" gebo-ai-field-element />
          </gebo-ai-field>
        </div>
      </div>
    </div>
  </p-panel>
