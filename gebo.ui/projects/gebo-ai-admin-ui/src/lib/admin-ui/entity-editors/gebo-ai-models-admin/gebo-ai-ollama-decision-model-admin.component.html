<p-blockUI id="BlockUILock" [target]="OllamaUI" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #OllamaUI header="Editing Ollama local (or lan) decision model configuration" [formGroup]="formGroup">
  @if (!isWizardMode) {
    <div class="grid geboLargeButtonsBar">
      <div class="col-4">
        <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save" severity="success"
        [disabled]="this.formGroup.invalid || canSave===false" styleClass="w-full"></p-button>
      </div>
      <div class="col-4">
        <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)" styleClass="w-full" />
      </div>
      <div class="col-4">
        <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash" (onClick)="doDelete()" styleClass="w-full"
          [disabled]="canDelete===false" />
      </div>
    </div>
  }

  <div class="geboDialogContent">
    <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>

    <div class="grid">
      <div class="col-12">
        <p-message severity="info" styleClass="w-full">
          <span id="DecisionModelUseNote" gebo-ai-text>A decision model answers yes/no, choice and score questions about a text. The default one judges the relevance of the retrieved fragments in place of the service chat model. Only the models the Ollama server reports with the decision capability (such as d1-omni) are offered.</span>
        </p-message>
      </div>
    </div>

    <div class="grid standardTabDialogueHeight">
      <div class="col-6">
        <gebo-ai-field id="description" label="Description" help="Enter the description of the decision model configuration" [required]="true">
          <input pInputText id="description" formControlName="description" maxlength="120" [required]="true"
            gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="code" label="Unique Code" help="Automatically generated unique code of the decision model configuration">
          <input pInputText id="code" formControlName="code" readonly="true" gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="baseUrl" label="Base ollama server address" help="Base address (like http://servername:234/) the ollama local or lan server responds." [required]="true">
          <input pInputText id="baseUrl" formControlName="baseUrl" [required]="true"
            gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="apiSecretCode" label="Ollama token" help="Choose the Ollama token to be used for this model" placeholder="Select a token">
          <geboai-editable-listbox-component id="apiSecretCode" formControlName="apiSecretCode"
            [optionsObservable]="identitiesObservable" [createNewRecordRequest]="newSecretAction"
            gebo-ai-field-element>
          </geboai-editable-listbox-component>
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="choosedModel" label="Ollama decision model choice" help="Choose the Ollama decision model to work with." [required]="true" placeholder="Select a model">
          <p-select styleClass="w-full" id="choosedModel" formControlName="choosedModel" dataKey="code"
            [required]="true" [options]="modelChoicesData" optionLabel="description"
            class="col-12" gebo-ai-field-element></p-select>
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="defaultModel" label="set this as default decision model" help="If true this will be used as default decision model where decision model is not indicated">
          <p-checkbox formControlName="defaultModel" id="defaultModel" [binary]="true" [trueValue]="true"
          [falseValue]="false" gebo-ai-field-element></p-checkbox>
        </gebo-ai-field>
      </div>
    </div>
  </div>
</p-panel>
