<p-blockUI id="BlockUILock"  [target]="BedrockUI" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #BedrockUI header="Editing AWS Bedrock chat model configuration" [formGroup]="formGroup">
  @if (!isWizardMode) {
    <div class="grid geboVeryLargeButtonsBar">
      <div class="col-3">
        <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save"
        severity="success" [disabled]="this.formGroup.invalid || canSave===false" styleClass="w-full"></p-button>
      </div>
      <div class="col-3">
        <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)" styleClass="w-full" />
      </div>
      <div class="col-3">
        <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash" (onClick)="doDelete()" styleClass="w-full"
          [disabled]="canDelete===false" />
        </div>
        <div class="col-3">
          <gebo-ai-test-chat-component [chatModelCode]="entity?.code"></gebo-ai-test-chat-component>
        </div>
      </div>
    }
    <div class="geboDialogContent">
      <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
      <p-tabs [value]="0" id="TabView" class="standardTabDialogueHeight">
            <p-tablist>
              <p-tab [value]="0" gebo-ai-text>General infos</p-tab>
              <p-tab [value]="1" gebo-ai-text>Advanced settings</p-tab>
              <p-tab [value]="2" gebo-ai-text>Model access settings</p-tab>
            </p-tablist>
            <p-tabpanels>
        <p-tabpanel [value]="0">
          <div class="grid">
            <div class="col-6">
              <gebo-ai-field id="description" label="Description" help="Enter the description of the model configuration" [required]="true">
                <input pInputText id="description" formControlName="description" maxlength="120"
                  [required]="true" gebo-ai-field-element />
                </gebo-ai-field>
              </div>
              <div class="col-6">
                <gebo-ai-field id="code" label="Unique Code" help="Automatically generated unique code of the model configuration">
                  <input pInputText id="code" formControlName="code" readonly="true" gebo-ai-field-element />
                </gebo-ai-field>
              </div>
              <div class="col-6">
                <gebo-ai-field id="apiSecretCode" label="AWS credentials" help="Choose the AWS credentials (access key id / secret access key) to be used for this model. Leave empty to use the instance IAM role." >
                  <geboai-editable-listbox-component formControlName="apiSecretCode"
                    placeholder="Select AWS credentials"
                    [optionsObservable]="identitiesObservable" [createNewRecordRequest]="newSecretAction"
                  gebo-ai-field-element></geboai-editable-listbox-component>
                </gebo-ai-field>
              </div>
              <div class="col-6">
                <gebo-ai-field id="choosedModel" label="AWS Bedrock chat model choice" help="Choose the AWS Bedrock chat model to work with." [required]="true">
                  <p-select id="SelectModel" gebo-ai-label styleClass="w-full" formControlName="choosedModel" placeholder="Select a model"
                    [required]="true" [options]="modelChoicesData" optionLabel="description"
                  gebo-ai-field-element></p-select>
                </gebo-ai-field>
              </div>
              <div class="col-6">
                <gebo-ai-field id="forUses" label="Model usage(s)" help="Uses that the Gebo.ai platform will consider this model for." placeholder="Choose model uses">
                  <gebo-ai-chat-model-use-component formControlName="forUses" gebo-ai-field-element></gebo-ai-chat-model-use-component>
                </gebo-ai-field>
              </div>
              <div class="col-6">
                <gebo-ai-field id="defaultModel" label="set this as default chat model" help="If true this will be used as default chat model where chat model is not indicated">
                  <p-checkbox formControlName="defaultModel" id="defaultModel" [binary]="true"
                    [trueValue]="true" [falseValue]="false"
                  gebo-ai-field-element></p-checkbox>
                </gebo-ai-field>
              </div>
            </div>
            <gebo-ai-standard-chat-model-settings-component [formGroup]="formGroup"></gebo-ai-standard-chat-model-settings-component>
          </p-tabpanel>
          <p-tabpanel [value]="1">
            <gebo-advanced-chatmodel-group-component [mode]="mode" [entityDataLoaded]="entityDataLoaded"
            [formGroup]="formGroup"></gebo-advanced-chatmodel-group-component>
          </p-tabpanel>
          <p-tabpanel [value]="2">
            <gebo-ai-access-control [formGroup]="formGroup"></gebo-ai-access-control>
          </p-tabpanel>
        </p-tabpanels>
          </p-tabs>
      </div>
    </p-panel>
