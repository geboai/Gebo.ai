<p-blockUI id="BlockUIButton" gebo-ai-label [target]="openaiUI" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #openaiUI [header]="'Editing ranking model configuration'"
  [formGroup]="formGroup">

  @if (!isWizardMode) {
    <div class="grid geboLargeButtonsBar">
      <div class="col-4">
        <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save"
          severity="success" [disabled]="this.formGroup.invalid || canSave===false"
        styleClass="w-full"></p-button>
      </div>
      <div class="col-4">
        <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast"
          (onClick)="cancelAction.emit(true)" styleClass="w-full" />
        </div>
        <div class="col-4">
          <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash"
            (onClick)="doDelete()" styleClass="w-full" [disabled]="canDelete===false" />
          </div>
        </div>
      }
      <div class="geboDialogContent">
        <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
        <div class="grid">
          <div class="col-12">
            <h3><span id="TitleFragment" gebo-ai-text>Editing ranking model
            provider:</span>{{modelType?.description}}
          </h3>
        </div>
      </div>

      <div class="grid">
        <div class="col-6">
          <gebo-ai-field id="description" label="Description"
            help="Enter the description of the model configuration" [required]="true">
            <input pInputText id="description" formControlName="description" maxlength="120" [required]="true"
              gebo-ai-field-element />
            </gebo-ai-field>
          </div>
          <div class="col-6">
            <gebo-ai-field id="code" label="Unique Code"
              help="Automatically generated unique code of the model configuration">
              <input pInputText id="code" formControlName="code" readonly="true" gebo-ai-field-element />
            </gebo-ai-field>
          </div>
          <div class="col-6">
            <gebo-ai-field id="baseUrl" label="ranking model  API base server address"
              help="Base address of ranking model ." [required]="true">
              <input pInputText id="baseUrl" formControlName="baseUrl" [readOnly]="modelType?.baseUrl?true:false"
                [required]="true" gebo-ai-field-element />
              </gebo-ai-field>
            </div>
            <div class="col-6">
              <gebo-ai-field id="apiSecretCode" label="ranking model  API token"
                help="Choose the ranking model  API token to be used for this model (optional)">
                <geboai-editable-listbox-component formControlName="apiSecretCode" placeholder="Select a token"
                  [optionsObservable]="identitiesObservable" [createNewRecordRequest]="newSecretAction"
                  gebo-ai-field-element>
                </geboai-editable-listbox-component>
              </gebo-ai-field>
            </div>
            <div class="col-6">
              <gebo-ai-field id="choosedModel" label="ranking model  ranking model choice"
                help="Choose the ranking model  ranking model to work with." [required]="true">
                <p-select styleClass="w-full" formControlName="choosedModel" id="choosedModel"
                  placeholder="Select a model" [required]="true" [options]="modelChoicesData"
                optionLabel="description" gebo-ai-field-element></p-select>
              </gebo-ai-field>
            </div>

            <div class="col-6">
              <gebo-ai-field id="defaultModel" label="set this as default ranking model"
                help="If true this will be used as default ranking model where ranking model is not indicated">
                <p-checkbox formControlName="defaultModel" id="defaultModel" [binary]="true" [trueValue]="true"
                [falseValue]="false" gebo-ai-field-element></p-checkbox>
              </gebo-ai-field>
            </div>
            <div class="col-6">
              <!--  contextLength: new FormControl(),
              maxDocumentsPerRequest: new FormControl(),
              maxDocumentTokens: new FormControl(),
              responseReserveTokens: new FormControl(),-->
              <gebo-ai-field id="contextLength" label="Context length (tokens)"
                help="Amount of text an AI model can consider when processing (if not set 8192 will be used)">
                <p-inputNumber id="contextLength" formControlName="contextLength" [min]="4096" [max]="64000"
                  [maxFractionDigits]="0" styleClass="w-full" gebo-ai-field-element />
                </gebo-ai-field>
              </div>
              <div class="col-6">
                <!--  contextLength: new FormControl(),
                maxDocumentsPerRequest: new FormControl(),
                maxDocumentTokens: new FormControl(),
                responseReserveTokens: new FormControl(),-->
                <gebo-ai-field id="maxDocumentsPerRequest" label="Max number of document per request"
                  help="Maximum amount of documents that the model will receive per request">
                  <p-inputNumber id="maxDocumentsPerRequest" formControlName="maxDocumentsPerRequest" [min]="10" [max]="1024"
                    [maxFractionDigits]="0" styleClass="w-full" gebo-ai-field-element />
                  </gebo-ai-field>
                </div>
                <div class="col-6">
                  <!--  contextLength: new FormControl(),
                  maxDocumentsPerRequest: new FormControl(),
                  maxDocumentTokens: new FormControl(),
                  responseReserveTokens: new FormControl(),-->
                  <gebo-ai-field id="maxDocumentTokens" label="Max length for each documents (tokens)"
                    help="Maximum length in tokens that each document can be">
                    <p-inputNumber id="maxDocumentTokens" formControlName="maxDocumentTokens" [min]="1024" [max]="16000"
                      [maxFractionDigits]="0" styleClass="w-full" gebo-ai-field-element />
                    </gebo-ai-field>
                  </div>
                  <div class="col-6">
                    <!--  contextLength: new FormControl(),
                    maxDocumentsPerRequest: new FormControl(),
                    maxDocumentTokens: new FormControl(),
                    responseReserveTokens: new FormControl(),-->
                    <gebo-ai-field id="responseReserveTokens" label="Context length reserved for the response (tokens)"
                      help="Maximum context length in tokens reserved for the response">
                      <p-inputNumber id="responseReserveTokens" formControlName="responseReserveTokens" [min]="1024" [max]="16000"
                        [maxFractionDigits]="0" styleClass="w-full" gebo-ai-field-element />
                      </gebo-ai-field>
                    </div>
                  </div>


                </div>
              </p-panel>
