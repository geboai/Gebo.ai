<p-dialog id="Dialog" gebo-ai-label [maximizable]="true" [visible]="openWindow" [modal]="true"
    [style]="{width:'40%',height:'40%'}" [closable]="true" [showHeader]="true" (visibleChange)="skipWindow()">


    <p-panel id="UserPasswordChangePanel" gebo-ai-label header="Change user's password">
        <div class="grid geboVeryLargeButtonsBar">
            <div class="col-3">
                <p-button id="ChangePasswordBtn" gebo-ai-label [outlined]="true" label="Change"
                    (onClick)="doChangePassword()" icon="pi pi-save" severity="success"
                    [disabled]="this.formGroup.invalid"></p-button>
            </div>
            <div class="col-3">
                <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast"
                    (onClick)="skipWindow()" />
            </div>

        </div>
        <p-blockUI id="BlockUI" gebo-ai-label [blocked]="loading">
            <i class="pi pi-lock" style="font-size: 3rem"></i>
        </p-blockUI>
        <gebo-ai-notifications [messages]="messages"></gebo-ai-notifications>
        <div class="grid" [formGroup]="formGroup">
            <div class="col-6">
                <gebo-ai-field id="username" label="User name" help="Enter your password to validate this action">
                    <input pInputText gebo-ai-field-element formControlName="username" [readOnly]="true">
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="currentUserPassword" label="Your password"
                    help="Enter your password to validate this action">
                    <p-password gebo-ai-field-element formControlName="currentUserPassword"
                        [feedback]="false"></p-password>
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="password" label="User's new password" help="New password for the edited user">
                    <p-password gebo-ai-field-element formControlName="password" [feedback]="false"></p-password>
                </gebo-ai-field>
            </div>
            <div class="col-6">
                <gebo-ai-field id="confirmpassword" label="user's password confirm"
                    help="password confirm for the edited user">
                    <p-password gebo-ai-field-element formControlName="confirmpassword" [feedback]="false"></p-password>
                </gebo-ai-field>
            </div>
        </div>
    </p-panel>
</p-dialog>
