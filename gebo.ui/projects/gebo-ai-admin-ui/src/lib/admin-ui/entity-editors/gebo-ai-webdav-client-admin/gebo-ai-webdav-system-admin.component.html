<p-blockUI id="LockIconBlockUI" [target]="webdavSystemCtrl" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #webdavSystemCtrl header="Editing WebDAV system" [formGroup]="formGroup">
  @if (!isWizardMode) {
    <div class="geboButtonsBar" style="vertical-align: baseline;">
      <div class="grid">
        <div class="col-3">
          <p-button id="SaveBtn" gebo-ai-label [outlined]="true" label="Save" (onClick)="doSave()" icon="pi pi-save" severity="success"
            [disabled]="this.formGroup.invalid || canSave===false" styleClass="w-full"></p-button>
        </div>
        <div class="col-3">
          <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)"
            styleClass="w-full" />
        </div>
        <div class="col-3">
          <p-button id="DeleteBtn" gebo-ai-label [outlined]="true" label="Delete" severity="danger" icon="pi pi-trash" (onClick)="doDelete()"
            styleClass="w-full" [disabled]="canDelete===false" />
        </div>
      </div>
    </div>
  }

  <div class="geboDialogContent">
    <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>
    <p-tabs [value]="0">
      <p-tablist>
        <p-tab [value]="0" gebo-ai-text>General settings</p-tab>
        <p-tab [value]="1" [disabled]="mode!=='EDIT'">Security settings</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <div class="grid">
            <div class="col-6">
              <gebo-ai-field id="description" label="Description" help="Enter the description of the WebDAV system." [required]="true">
                <input id="description" formControlName="description" maxlength="120" [required]="true" pInputText gebo-ai-field-element />
              </gebo-ai-field>
            </div>
            <div class="col-6">
              <gebo-ai-field id="code" label="Unique Code" help="Automatically generated unique code of the WebDAV system.">
                <input id="code" formControlName="code" readonly="true" pInputText gebo-ai-field-element />
              </gebo-ai-field>
            </div>
            <div class="col-6">
              <gebo-ai-field id="baseUri" label="Base internet address" help="Base URL for the WebDAV server" [required]="true">
                <input type="text" id="baseUri" formControlName="baseUri" class="col-12" [required]="true" pInputText gebo-ai-field-element />
              </gebo-ai-field>
            </div>
            <div class="col-6">
              <gebo-ai-field id="webdavAuthType" label="Authentication method" help="Authentication method for the WebDAV server" [required]="true">
                <geboai-editable-listbox-component id="webdavAuthType" formControlName="webdavAuthType" [required]="true" [readonly]="mode!=='NEW'" placeholder="Select authentication method" class="col-12" [data]="authTypes" gebo-ai-field-element>
                </geboai-editable-listbox-component>
              </gebo-ai-field>
            </div>
            @if (showCredentials) {
              <div class="col-6">
                <gebo-ai-field id="secretCode" label="Identity used" help="Select or create the identity to access the WebDAV system" [required]="true">
                  <geboai-editable-listbox-component id="secretCode" formControlName="secretCode" placeholder="Select an identity" [optionsObservable]="identitiesObservable" [required]="true" [createNewRecordRequest]="newSecretAction" gebo-ai-field-element>
                  </geboai-editable-listbox-component>
                </gebo-ai-field>
              </div>
            }
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="1">
          <div class="grid">
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</p-panel>
