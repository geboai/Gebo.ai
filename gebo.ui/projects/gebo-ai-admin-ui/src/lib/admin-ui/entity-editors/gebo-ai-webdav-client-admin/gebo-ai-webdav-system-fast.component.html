<p-blockUI id="BlockUI" [target]="webdavSystemCtrl" [blocked]="loading">
  <i class="pi pi-lock" style="font-size: 3rem"></i>
</p-blockUI>
<p-panel id="MainPanel" gebo-ai-label #webdavSystemCtrl header="Create WebDAV system configuration" [formGroup]="formGroup">
  <div class="geboButtonsBar" style="vertical-align: baseline;">
    <div class="grid">
      <div class="col-4">
        <p-button id="CreateBtn" gebo-ai-label [outlined]="true" label="Create" (onClick)="doInsert()" icon="pi pi-save" severity="success"
          styleClass="w-full" [disabled]="this.formGroup.invalid"></p-button>
      </div>
      <div class="col-4">
        <p-button id="CancelBtn" gebo-ai-label [outlined]="true" label="Cancel" severity="contrast" (onClick)="cancelAction.emit(true)"
          styleClass="w-full" />
      </div>
    </div>
  </div>

  <div class="geboDialogContent">
    <gebo-ai-notifications [messages]="userMessages"></gebo-ai-notifications>

    <div class="grid">
      <div class="col-6">
        <gebo-ai-field id="description" label="Description" help="Enter the description of the WebDAV system.">
          <input pInputText id="description" formControlName="description" maxlength="120" gebo-ai-field-element />
        </gebo-ai-field>
      </div>
      <div class="col-6">
        <gebo-ai-field id="authType" label="Authentication method" [required]="true" help="Select the authentication method used by the WebDAV server">
          <geboai-editable-listbox-component id="authType" formControlName="authType" [required]="true" placeholder="Select authentication method" class="col-12 required" [data]="authTypes" gebo-ai-field-element>
          </geboai-editable-listbox-component>
        </gebo-ai-field>
      </div>

      <div class="col-12">
        <gebo-ai-field id="baseUri" label="Base internet address" help="Base URL for the WebDAV server (e.g. https://webdav.example.com/remote.php/dav/)" [required]="true">
          <input type="text" id="baseUri" pInputText formControlName="baseUri" class="col-12 required" [required]="true" gebo-ai-field-element />
        </gebo-ai-field>
      </div>

      @if (showCredentials) {
        <div class="col-6">
          <gebo-ai-field id="secretCode" label="Identity used" help="Select or create the identity to access the WebDAV system" [required]="true">
            <geboai-editable-listbox-component id="secretCode" formControlName="secretCode" placeholder="Select an identity" [optionsObservable]="identitiesObservable" [required]="true" [createNewRecordRequest]="newSecretAction" gebo-ai-field-element>
            </geboai-editable-listbox-component>
          </gebo-ai-field>
        </div>
      }
    </div>
  </div>
</p-panel>
