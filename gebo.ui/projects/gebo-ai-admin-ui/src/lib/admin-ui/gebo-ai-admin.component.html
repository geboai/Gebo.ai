<p-tabs [value]="0" (valueChange)="activatedIndex($event)" class="geboFullHeight">
  <p-tablist>
    <p-tab [value]="0" gebo-ai-text>Dashboard</p-tab>
    <p-tab [value]="1" gebo-ai-text>LLMs for chat &amp; embedding</p-tab>
    <p-tab [value]="2" gebo-ai-text>Users and groups</p-tab>
    <p-tab [value]="3" gebo-ai-text>Gebo.ai modules config</p-tab>
    @if (false) {
      <p-tab [value]="4" gebo-ai-text>Build/packaging systems</p-tab>
    }
    <p-tab [value]="5" gebo-ai-text>Knowledge bases &amp; projects</p-tab>
    <p-tab [value]="6" gebo-ai-text>Rag chat profiles/Model prompts</p-tab>
    <p-tab [value]="7" gebo-ai-text>Agents/Networks of agents</p-tab>
    <p-tab [value]="8" gebo-ai-text>Logs</p-tab>
  </p-tablist>
  <p-tabpanels>

  <p-tabpanel [value]="0">
    <gebo-ai-main-dashboard-component></gebo-ai-main-dashboard-component>
  </p-tabpanel>
  <p-tabpanel [value]="1">
    <llms-systems-component id="childs" #child1></llms-systems-component>
  </p-tabpanel>
  <p-tabpanel [value]="2">
    <users-management-component id="childs" #child2></users-management-component>
  </p-tabpanel>
  <p-tabpanel [value]="3">
    <systems-component id="childs" #child3></systems-component>
  </p-tabpanel>
  @if (false) {
    <p-tabpanel [value]="4">
      <build-packaging-systems-component id="childs" #child4></build-packaging-systems-component>
    </p-tabpanel>
  }
  <p-tabpanel [value]="5">
    <knowledge-bases-component id="childs" #child5></knowledge-bases-component>
  </p-tabpanel>

  <p-tabpanel [value]="6">
    <chat-profiles-component id="childs" #child6></chat-profiles-component>
  </p-tabpanel>
  <p-tabpanel [value]="7">
    <agent-networks-component id="childs" #child7></agent-networks-component>
  </p-tabpanel>
  <p-tabpanel [value]="8">
    <gebo-ai-logs-view-component id="childs" #child8></gebo-ai-logs-view-component>
  </p-tabpanel>
  </p-tabpanels>
</p-tabs>
