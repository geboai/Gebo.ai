@if (messages.length) {
  <div class="gebo-system-messages" role="status" aria-live="polite">
    @for (message of messages; track trackById($index, message)) {
      <p-message [severity]="message.severity" styleClass="gebo-system-message">
        <div class="gebo-system-message-body">
          <div class="gebo-system-message-text">
            <strong>{{ message.summary }}</strong>
            @if (message.detail) {
              <span class="gebo-system-message-detail">{{ message.detail }}</span>
            }
          </div>
          @if (message.dismissible) {
            <p-button icon="pi pi-times" [text]="true" [rounded]="true" severity="secondary"
              ariaLabel="Dismiss" (onClick)="dismiss(message)"></p-button>
          }
        </div>
      </p-message>
    }
  </div>
}
