@if (streaming) {
<div class="gebo-ai-reusable-chat_chat-status">
    @if(routingChoiceSelector) {
    <div class="gebo-ai-reusable-chat__interaction-item-pipeline-route_label">
        
        @if (inputProcessingEvent) {
        <div class="pure-search">
            <div class="pure-search_label">
                <span>
                    <span id="PureSearchProcessingDocument" gebo-ai-text>Processing
                        document:</span>&nbsp;<span>{{inputProcessingEvent?.document?.name}}</span>
                </span>
            </div>
        </div>
        } 
        @else if (currentNotification) {
        <span id="NOTIFICATION">
            <span [id]="currentNotification.code" [className]="currentNotification.notificationType"
                gebo-ai-text>{{currentNotification.message}}</span>
        </span>
        }  
        @else if(notifiedPipelineRouting) {
        <span id="RUNNING" gebo-ai-text>Running </span>&nbsp;<i
            [className]="notifiedPipelineRouting?.icon"></i>&nbsp;<span>{{notifiedPipelineRouting?.description}}</span>
        }
    </div>
    }
    <div class="deep_search_skeleton_wait">
        <p-skeleton styleClass="mb-2" />
    </div>
</div>
}
