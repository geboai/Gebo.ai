<div class="gebo-ai-chat-docref">
  @if(ref) {

  @if(!choosed) {
  <p-button id="AddDocsBtn"
            gebo-ai-label
            (onClick)="addToChoosed.emit(ref)"
            text
            rounded
            icon="pi pi-plus"
            class="custom-blue-btn"
            title="Add document to 'chat with' list "></p-button>
  }

  <p-button [icon]="contentCssClass"
            [label]="ref.name"
            [text]="true"
            class="custom-blue-btn"
            (onClick)="showDocument(ref)"
            [title]="ref.name + ' ' + (ref.ntokensRelevant?ref.ntokensRelevant:0)+'/'+ref.ntotalContentTokens+' relevant/total tokens'"></p-button>

  <gebo-ai-content-viewer [code]="openDocumentCode"
                          [activate]="openDocumentWindow"
                          (close)="closeDocument()"></gebo-ai-content-viewer>
  }
</div>
