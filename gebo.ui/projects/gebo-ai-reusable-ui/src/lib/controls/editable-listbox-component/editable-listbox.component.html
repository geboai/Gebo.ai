@if (readonly?false:true) {
  <!-- appendTo="body" because the overlay renders inline by default and every
       surface this control sits on (p-panel is overflow:clip, dialog bodies
       scroll) clips it. On the LLMs admin tab the provider list was cut at the
       bottom edge of the panel. -->
  <p-select styleClass="w-full" appendTo="body" [options]="options" optionLabel="description" optionValue="code"
    [placeholder]="placeholder" [(ngModel)]="value"  [loading]="loading" [disabled]="disabled"
    (onChange)="changedValue($event)" >
    <ng-template let-item pTemplate="item">
      @if (item.code!==createNewValueCodeConstant) {
        <div class="flex align-items-left gap-2" style="width: 100%;" >
          {{item.description}}
        </div>
      }
      @if (item.code===createNewValueCodeConstant) {
        <div class="flex align-items-left gap-2" style="width: 100%;">
          <p-button [label]="item.description" icon="pi pi-plus" [outlined]="true" styleClass="w-full" ></p-button>
        </div>
      }
    </ng-template>
  </p-select>
}

@if (readonly?true:false) {
  <span class="col-12">
    {{selectedOption?.description}}
  </span>
}
