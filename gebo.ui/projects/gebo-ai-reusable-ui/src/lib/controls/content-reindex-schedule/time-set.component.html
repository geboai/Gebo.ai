<table>
  <tr>
    @for (p of metaInfo; track p) {
      <th>{{p.label}}</th>
    }
    <td></td>
  </tr>
  <tr>
    @for (p of metaInfo; track p; let i = $index) {
      <td>
        @if (!choices[i].choices && !dateComponent) {
          <p-inputNumber  [formControl]="formControl[i]" [max]="choices[i].maxValue" [min]="choices[i].minValue" [required]="true" size="large"></p-inputNumber>
        }
        @if (choices[i].choices  && !dateComponent) {
          <p-select styleClass="w-full"  [formControl]="formControl[i]" [options]="choices[i].choices" optionLabel="label" [required]="true" optionValue="id"></p-select>
        }
        @if (dateComponent===true) {
          <p-datepicker [formControl]="formControl[i]" [showTime]="true" [required]="true"   ></p-datepicker>
        }
      </td>
    }
    <td>
      <p-button icon="pi pi-times-circle" [rounded]="true" [text]="true" severity="danger" (onClick)="removeThis()" ></p-button>
    </td>
  </tr>
</table>
