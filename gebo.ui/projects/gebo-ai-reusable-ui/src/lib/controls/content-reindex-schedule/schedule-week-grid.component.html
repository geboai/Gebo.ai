<!-- A picture of the rule list, which is where the schedule is actually read and edited -->
<div class="geboWeek" aria-hidden="true">
  @for (row of rows; track $index) {
    <div class="geboWeek__row">
      <span class="geboWeek__day">{{row.name}}</span>
      <span class="geboWeek__cells">
        @for (cell of row.cells; track $index) {
          <span class="geboWeek__cell" [class.geboWeek__cell--on]="cell.on"
          [class.geboWeek__cell--hot]="cell.hot"></span>
        }
      </span>
    </div>
  }
  <div class="geboWeek__row geboWeek__row--axis">
    <span class="geboWeek__day"></span>
    <span class="geboWeek__cells">
      @for (hour of hours; track hour) {
        <span class="geboWeek__tick">
          @if (ticks.includes(hour)) {
            <span class="geboWeek__tickLabel">{{tickLabel(hour)}}</span>
          }
        </span>
      }
    </span>
  </div>
</div>
