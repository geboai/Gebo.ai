@if (showAsPage!==true) {
  <span>
    <span #item>
      @if (showAsButtons!==true) {
        <a class="anchorButton" (click)="refreshUI();thisMenu.toggle($event)" #item>+Add data
        source</a>
      }
      @if (showAsButtons===true) {
        <p-button icon="pi pi-plus" [outlined]="true" (onClick)="thisMenu.toggle($event)"
        label="Data source" id="item"></p-button>
      }</span>
      <p-contextMenu #thisMenu [model]='items' [target]="item" appendTo="body" />
    </span>
  }
  @if (showAsPage===true) {
    <div class="grid">
      @for (item of items; track item) {
        <div class="col-12">
          <p-button [icon]="item.icon" [label]="item.label" (onClick)="execute(item)"></p-button>
        </div>
      }
    </div>
  }
