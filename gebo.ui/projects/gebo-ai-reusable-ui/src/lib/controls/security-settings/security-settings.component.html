<ng-container *ngIf="formGroup && modeLoaded">
    <ng-container *ngIf="useAclControl; else classicAccessControl" [formGroup]="formGroup">
        <gebo-ai-acl-settings-component formControlName="aclAliases" [allowableGrants]="allowableGrants"></gebo-ai-acl-settings-component>
    </ng-container>
    <ng-template #classicAccessControl>
        <gebo-ai-access-control [formGroup]="formGroup"></gebo-ai-access-control>
    </ng-template>
</ng-container>
