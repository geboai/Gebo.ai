<!-- in this area the start and stop record control -->
<p-button id="RecordBtn"
          gebo-ai-label
          [disabled]="disabled || playMode"
          (onClick)="startRecording()"
          icon="pi pi-microphone"
          title="Start recording an audio track and send it"
          [text]="viewLabels"
          rounded="true"
          *ngIf="recording!==true && playMode!==true"
          class="custom-blue-btn"
          [severity]="(errorState===true?'danger':'primary')"> </p-button>
<p-button id="StopBtn"
          gebo-ai-label
          [disabled]="disabled  || playMode"
          (onClick)="stopRecording()"
          icon="pi pi-stop-circle"
          title="Recording"
          class="custom-blue-btn"
          [text]="viewLabels"
          *ngIf="recording"
          rounded="true"
          [severity]="(errorState===true?'danger':'primary')"></p-button>
<!-- Here the abandon record button or the play control-->
<p-button id="AbortBtn"
          gebo-ai-label
          [disabled]="disabled"
          (onClick)="abortRecording()"
          [severity]="(errorState===true?'danger':'primary')"
          icon="pi pi-times"
          title="Abort recording"
          class="custom-blue-btn"
          rounded="true"
          [text]="viewLabels"
          *ngIf="recording"></p-button>
<p-button id="AbortRecordingBtn"
          gebo-ai-label
          [disabled]="disabled"
          *ngIf="playMode"
          (onClick)="pausePlay()"
          [severity]="(errorState===true?'danger':'primary')"
          icon="pi pi-pause"
          title="Abort recording"
          class="custom-blue-btn"
          rounded="true"
          [text]="viewLabels"></p-button>
<p-button [disabled]="disabled"
          *ngIf="playPaused"
          (onClick)="continuePlay()"
          icon="pi pi-play"
          class="custom-blue-btn"
          rounded="true"
          [text]="viewLabels"
          [severity]="(errorState===true?'danger':'primary')"></p-button>
