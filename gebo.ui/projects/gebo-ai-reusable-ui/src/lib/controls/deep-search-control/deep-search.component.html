<p-panel id="deepSearchUI"
         #deepSearchUI
         gebo-ai-label
         header="Deep Search"
         [showHeader]="mode==='full-ui'">

  @if(loading) {
  <div class="deep-search">
    <div class="deep-search__progressbar">
      <p-progressbar [value]="completionPercent"
                     [style]="{ height: '10px' }"></p-progressbar>
    </div>
    <div class="deep-search__label">
      <span *ngIf="!analisysStep && !deepSearchResponse"
            class="deep-search__label-item"
            id="DeepSearchProcessingSearch"
            gebo-ai-text>Searching relevant informations</span>
      <span class="deep-search__label-item"
            *ngIf="analisysStep && completionPercent<100"><span id="DeepSearchProcessingFile"
              gebo-ai-text>Analized
          file</span>
        <span>{{analisysStep?.documentRef?.name}}</span></span>
      <span class="deep-search__label-item"
            *ngIf="completionPercent===100"
            id="DeepSearchingConsolidating"
            gebo-ai-text>
        Consolidating the final report
      </span>
    </div>
  </div>
  }

  <!-- 
        <p-blockUI [target]="deepSearchUI" [blocked]="loading" ></p-blockUI>
        -->

</p-panel>
