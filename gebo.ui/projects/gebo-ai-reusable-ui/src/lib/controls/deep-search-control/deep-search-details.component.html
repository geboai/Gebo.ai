@if(thereAreDetails) {
<p-button id="DeepSearchDetailsButton" icon="pi pi-deep-search" label="Sources"
    title="Open the list of analyzed documents" gebo-ai-label (onClick)="toggleShowedList()" [text]="true"></p-button>
@if (listIsShowed) {

<p-dialog *ngIf="listIsShowed" [visible]="true" [modal]="true" [style]="{width:'98%',height:'100%'}"
    [maximizable]="true" (visibleChange)="toggleShowedList()">
    <p-panel id="DeepSearchDetailsTitle" gebo-ai-label header="Deep search answer and sources details">
        <p-blockUI id="BlockUI"  [blocked]="loading">
            <i class="pi pi-lock" style="font-size: 3rem"></i>
        </p-blockUI>
        <p-accordion>
            <p-accordiontab id="DeepSearchResultAccordionItem" gebo-ai-label header="Deep Search analisys result">
                <p>
                    <markdown [data]="result?.response"></markdown>
                </p>
            </p-accordiontab>
            @for (item of data; track item) {
            <p-accordiontab [header]="item.analyzedDocument.name">
                <p>
                    <markdown [data]="item.analisysResult"></markdown>
                    @if (item.analyzedDocument?.url) {
                    <br />
                    <a [href]="item.analyzedDocument?.url" target="_blank">{{item.analyzedDocument?.url}}</a>
                    }
                </p>
            </p-accordiontab>
            }
        </p-accordion></p-panel>

</p-dialog>

}
}
