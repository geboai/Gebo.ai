<p-dialog [maximizable]="true" id="DeepSearchDataSourcesChoice" [visible]="visible" [modal]="true"
  [style]="{width:'50%',height:'50%'}" [closable]="true" [showHeader]="true"
  (visibleChange)="skipDeepSearchOnDataSourceChoice()" header="Choose Deep search sources">
  <div class="geboButtonsBar" style="vertical-align: baseline;">
    <div class="grid">
      <div class="col-6">
        <p-button id="SelectSourcesBtn" gebo-ai-label [outlined]="true" label="Select sources"
          (onClick)="doChoosedSources()" icon="pi pi-search-plus" severity="success"
        [disabled]="chooseDeepSearchDataSourcesFormGroup.invalid"></p-button>
      </div>

      <div class="col-6">
        <p-button id="SkipDeepSearch" gebo-ai-label [outlined]="true" label="Skip deep search"
          severity="contrast" (onClick)="skipDeepSearchOnDataSourceChoice()" />
        </div>


      </div>
    </div>
    <div class="grid" [formGroup]="chooseDeepSearchDataSourcesFormGroup">
      <div class="col-12"><b id="ChooseAtLeastMessage" gebo-ai-text>Choose at least one of the following options</b>
    </div>
    @if (choosableDataSources && choosableDataSources.length) {
      <p-fieldset id="DataSourceChoicesArea" gebo-ai-label
        legend="Choosed systems" class="col-12">
        <p-selectbutton [options]="choosableDataSources" formControlName="deepSearchDataSources" [multiple]="true"
          optionLabel="description" optionValue="code" />
        </p-fieldset>
      }
      @if (choosableKnowledgeBases && choosableKnowledgeBases.length) {
        <p-fieldset id="KnowledgeBaseChoicesArea"
          gebo-ai-label legend="Choosed knowledge bases" class="col-12">
          <p-selectbutton [options]="choosableKnowledgeBases" formControlName="knowledgeBases" [multiple]="true"
            optionLabel="description" optionValue="code" />
          </p-fieldset>
        }

      </div>

    </p-dialog>
