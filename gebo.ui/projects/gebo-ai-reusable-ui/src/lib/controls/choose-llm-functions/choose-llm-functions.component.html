<span [formGroup]="formGroup">
  <p-treeSelect
    id="TreeSelect" gebo-ai-label
    class=" col-12"
    containerStyleClass="w-full"
    formControlName="selected"
    [options]="root"
    display="chip"  [loading]="loading"
    [metaKeySelection]="false"
    selectionMode="checkbox"
    [propagateSelectionUp]="true"
    [propagateSelectionDown]="true"
    placeholder="Select functions"
    [virtualScroll]="true"
    [virtualScrollItemSize]="46"
    [virtualScrollOptions]="{scrollHeight: '200px'}"
    >
    <ng-template pTemplate="value" let-value>
      @if (hasLeaf(value)) {
        @for (node of value; track node) {
          @if (node.leaf) {
            <div class="p-treeselect-token">
              <span class="p-treeselect-token-label">{{ node.label }}</span>
            </div>
          }
        }
      } @else {
        <span class="p-placeholder">Select functions</span>
      }
    </ng-template>
  </p-treeSelect>
</span>
