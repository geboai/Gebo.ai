<p-fieldset [legend]="title">
  @for (fg of criterias.controls; track fg; let i = $index) {
    <div class="grid">
      <div class="col-11" >
        <gebo-ai-selection-filter-criteria-component  [fg]="criteriaAt(i)" [fileTypes]="fileTypes"></gebo-ai-selection-filter-criteria-component>
      </div>
      <div class="col-1">
        @if (i>0) {
          <p-button icon="pi pi-trash" (onClick)="removeRow(i)" [text]="true" [rounded]="true" [raised]="true"  severity="danger" [outlined]="true" title="Remove"></p-button>
        }
      </div>
    </div>
  }
  <div class="grid">
    <div class="col-1">
      <p-button icon="pi pi-plus" title="add a selection criteria" [text]="true" (onClick)="addRow()" [raised]="true" [rounded]="true" severity="info" [outlined]="true"></p-button>
    </div>
    <div class="col-11"></div>
  </div>
</p-fieldset>
