<p-blockUI [blocked]="loading">
    <div class="flex justify-content-center align-items-center h-full">
        <i class="pi pi-spin pi-spinner" style="font-size: 3rem; color: var(--primary-color)"></i>
    </div>
</p-blockUI>

<p-panel id="llmUsageDashboardPanel">
    <div *ngIf="hasNoStats" class="flex flex-column align-items-center justify-content-center p-6 text-500 text-center">
        <i class="pi pi-info-circle text-5xl mb-3" style="color: var(--text-color-secondary)"></i>
        <span id="noLLMStatsLabel" gebo-ai-text class="text-xl font-medium block">no llms traffic generated yet</span>
    </div>

    <p-tabs value="0" *ngIf="!hasNoStats">
        <p-tablist>
            
            <p-tab value="0">
                <i class="pi pi-chart-bar mr-2"></i><span id="dlabel" gebo-ai-text>Monthly llms usage</span>
            </p-tab>
            <p-tab value="1">
                <i class="pi pi-calendar mr-2"></i><span id="mlabel" gebo-ai-text>This month llms usage</span>
            </p-tab>
        </p-tablist>

        <p-tabpanels>
            

            <!-- Tab 2: Monthly usage -->
            <p-tabpanel value="0">
                <!-- Filters panel -->
                <div class="filter-panel card p-4 mb-4 surface-card border-round">
                    <div class="text-lg font-medium text-800 mb-3 flex align-items-center">
                        <i class="pi pi-filter mr-2 text-primary"></i> Filter Drill Down
                    </div>
                    <div class="grid p-fluid align-items-end">
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.providerId?.length">
                            <label class="block text-700 font-semibold mb-2">Provider ID</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.providerId)"
                                [(ngModel)]="filterTab2.providerId" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.username?.length">
                            <label class="block text-700 font-semibold mb-2">Username</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.username)"
                                [(ngModel)]="filterTab2.username" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.model?.length">
                            <label class="block text-700 font-semibold mb-2">Model</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.model)"
                                [(ngModel)]="filterTab2.model" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.callerStack?.length">
                            <label class="block text-700 font-semibold mb-2">Caller Stack</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.callerStack)"
                                [(ngModel)]="filterTab2.callerStack" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.modelType?.length">
                            <label class="block text-700 font-semibold mb-2">Model Type</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.modelType)"
                                [(ngModel)]="filterTab2.modelType" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.year?.length">
                            <label class="block text-700 font-semibold mb-2">Year</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.year)"
                                [(ngModel)]="filterTab2.year" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.monthlySubdimensions?.month?.length">
                            <label class="block text-700 font-semibold mb-2">Month</label>
                            <p-select [options]="getOptions(result?.monthlySubdimensions?.month)"
                                [(ngModel)]="filterTab2.month" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-4 lg:col-3 flex gap-2">
                            <p-button label="Filter" icon="pi pi-filter" severity="primary" (onClick)="applyFilter(2)"
                                class="flex-grow-1"></p-button>
                            <p-button label="Reset" icon="pi pi-refresh" severity="secondary" (onClick)="resetFilter(2)"
                                class="flex-grow-1"></p-button>
                        </div>
                    </div>
                </div>

                <!-- Histograms grid -->
                <div class="grid">
                    <div class="col-12 mb-4">
                        <div class="card p-4 surface-card border-round h-full">
                            <div
                                class="text-xl font-medium mb-3 text-800 flex justify-content-between align-items-center">
                                <span>Tokens Consumed</span>
                                <span class="text-xs text-500 font-normal">in k tokens</span>
                            </div>
                            <div *ngIf="tokenChartDataTab2?.labels?.length; else noDataMonthly">
                                <p-chart type="bar" [data]="tokenChartDataTab2" [options]="chartOptions"
                                    height="350px"></p-chart>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 mb-4">
                        <div class="card p-4 surface-card border-round h-full">
                            <div
                                class="text-xl font-medium mb-3 text-800 flex justify-content-between align-items-center">
                                <span>Latency</span>
                                <span class="text-xs text-500 font-normal">in seconds</span>
                            </div>
                            <div *ngIf="latencyChartDataTab2?.labels?.length; else noDataMonthly">
                                <p-chart type="bar" [data]="latencyChartDataTab2" [options]="chartOptions"
                                    height="350px"></p-chart>
                            </div>
                        </div>
                    </div>
                </div>

                <ng-template #noDataMonthly>
                    <div class="flex flex-column align-items-center justify-content-center p-5 text-500">
                        <i class="pi pi-chart-bar text-4xl mb-2"></i>
                        <span>No monthly usage data recorded</span>
                    </div>
                </ng-template>
            </p-tabpanel>
            <!-- Tab 1: This month usage -->
            <p-tabpanel value="1">
                <!-- Filters panel -->
                <div class="filter-panel card p-4 mb-4 surface-card border-round">
                    <div class="text-lg font-medium text-800 mb-3 flex align-items-center">
                        <i class="pi pi-filter mr-2 text-primary"></i> Filter Drill Down
                    </div>
                    <div class="grid p-fluid align-items-end">
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.providerId?.length">
                            <label class="block text-700 font-semibold mb-2">Provider ID</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.providerId)"
                                [(ngModel)]="filterTab1.providerId" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.username?.length">
                            <label class="block text-700 font-semibold mb-2">Username</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.username)"
                                [(ngModel)]="filterTab1.username" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.model?.length">
                            <label class="block text-700 font-semibold mb-2">Model</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.model)"
                                [(ngModel)]="filterTab1.model" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.callerStack?.length">
                            <label class="block text-700 font-semibold mb-2">Caller Stack</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.callerStack)"
                                [(ngModel)]="filterTab1.callerStack" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.modelType?.length">
                            <label class="block text-700 font-semibold mb-2">Model Type</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.modelType)"
                                [(ngModel)]="filterTab1.modelType" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.year?.length">
                            <label class="block text-700 font-semibold mb-2">Year</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.year)"
                                [(ngModel)]="filterTab1.year" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-3 lg:col-2"
                            *ngIf="result?.currentMonthDailySubdimensions?.month?.length">
                            <label class="block text-700 font-semibold mb-2">Month</label>
                            <p-select [options]="getOptions(result?.currentMonthDailySubdimensions?.month)"
                                [(ngModel)]="filterTab1.month" placeholder="All" styleClass="w-full"></p-select>
                        </div>
                        <div class="col-12 sm:col-6 md:col-4 lg:col-3 flex gap-2">
                            <p-button label="Filter" icon="pi pi-filter" severity="primary" (onClick)="applyFilter(1)"
                                class="flex-grow-1"></p-button>
                            <p-button label="Reset" icon="pi pi-refresh" severity="secondary" (onClick)="resetFilter(1)"
                                class="flex-grow-1"></p-button>
                        </div>
                    </div>
                </div>

                <!-- Histograms grid -->
                <div class="grid">
                    <div class="col-12 mb-4">
                        <div class="card p-4 surface-card border-round h-full">
                            <div
                                class="text-xl font-medium mb-3 text-800 flex justify-content-between align-items-center">
                                <span>Tokens Consumed</span>
                                <span class="text-xs text-500 font-normal">in k tokens</span>
                            </div>
                            <div *ngIf="tokenChartDataTab1?.labels?.length; else noDataDaily">
                                <p-chart type="bar" [data]="tokenChartDataTab1" [options]="chartOptions"
                                    height="350px"></p-chart>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 mb-4">
                        <div class="card p-4 surface-card border-round h-full">
                            <div
                                class="text-xl font-medium mb-3 text-800 flex justify-content-between align-items-center">
                                <span>Latency</span>
                                <span class="text-xs text-500 font-normal">in seconds</span>
                            </div>
                            <div *ngIf="latencyChartDataTab1?.labels?.length; else noDataDaily">
                                <p-chart type="bar" [data]="latencyChartDataTab1" [options]="chartOptions"
                                    height="350px"></p-chart>
                            </div>
                        </div>
                    </div>
                </div>

                <ng-template #noDataDaily>
                    <div class="flex flex-column align-items-center justify-content-center p-5 text-500">
                        <i class="pi pi-chart-bar text-4xl mb-2"></i>
                        <span>No usage data recorded for this month</span>
                    </div>
                </ng-template>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>
</p-panel>
