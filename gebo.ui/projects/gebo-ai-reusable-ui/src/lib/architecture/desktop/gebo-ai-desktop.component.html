<gebo-ai-display-messages></gebo-ai-display-messages>

 @if (userLogged) {
    <!-- LAUNCHING COMPONENT FOR DYNAMIC EDITING/VIEWING FORMS-->
    <gebo-ui-entities-forms-launcher-component></gebo-ui-entities-forms-launcher-component>
 }
<p-confirm-dialog></p-confirm-dialog>
<div class="gebo-app-shell">
    <header class="gebo-app-header">
        <a class="gebo-app-brand" href="https://gebo.ai" target="_blank" rel="noopener noreferrer"
            aria-label="Gebo.ai website">
            <img src="assets/Gebo.png" alt="Gebo.ai">
        </a>

        <nav class="gebo-app-nav" #MenuArea aria-label="Primary navigation">
            @if (userLogged) {
                <p-megaMenu [model]="menuItems" orientation="horizontal" class="megaMenuWhite" />
            }
        </nav>

        <div class="gebo-app-tools" #serviceMenuArea aria-label="Language tools">
            <gebo-ai-language-resource-download></gebo-ai-language-resource-download>
            <gebo-ai-main-language-choice></gebo-ai-main-language-choice>
        </div>
    </header>

    <main class="gebo-app-content">
        <router-outlet />
    </main>
</div>

<div class="version-display">
    Gebo.ai &#x16B7; &#x16C9; &#x16D2; · {{version}}
</div>
