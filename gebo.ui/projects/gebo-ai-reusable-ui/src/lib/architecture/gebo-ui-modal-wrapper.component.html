<span #ngContainerItem>
  @if (componentType && modal) {
    <span>
      <div class="grid">
        @if (isWizardMode ) {
          <div class="col-12">
            <p-steps [model]="items" [readonly]="true" [activeIndex]="activeIndex" />
          </div>
        }
        @if (isWizardMode) {
          <div class="col-12 grid">
            <div class="col-3"></div>
            <div class="col-6 grid">
              <div class="col-4">
                @if (wizardButtonsBarData?.hasPreviusStep) {
                  <p-button [icon]="previusStepIcon" iconPos="left"
                    [outlined]="true" [label]="previusStepLabel" (onClick)="goNext()"
                  styleClass="w-full"></p-button>
                }
              </div>
              <div class="col-4">
                <p-button [outlined]="true" label="Cancel" severity="contrast"
                  (onClick)="cancelAction.emit(true)" styleClass="w-full" />
                </div>
                <div class="col-4">
                  @if (wizardButtonsBarData?.hasNextStep) {
                    <p-button [icon]="nextStepIcon" iconPos="right"
                      [outlined]="true" [label]="nextStepLabel" (onClick)="goPrev()"
                      [disabled]="outForwardingService?.actualFormInvalid?true:false"
                    styleClass="w-full"></p-button>
                  }
                </div>
              </div>
              <div class="col-3"></div>
            </div>
          }
          <div class="col-12">
            <ng-container #ngOutletItem *ngComponentOutlet="componentType;inputs: composedInputs" />
          </div>
        </div>
      </span>
    }
  </span>
