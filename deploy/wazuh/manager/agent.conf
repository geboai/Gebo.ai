<!--
  CENTRALIZED configuration for the Wazuh agent group "gebo-ai": every agent
  enrolled in that group picks these <localfile> blocks up from the manager, so
  you never edit ossec.conf on the Gebo.ai hosts themselves.

  Install on the MANAGER:

      /var/ossec/bin/agent_groups -a -g gebo-ai -q
      cp agent.conf /var/ossec/etc/shared/gebo-ai/agent.conf
      chown wazuh:wazuh /var/ossec/etc/shared/gebo-ai/agent.conf
      chmod 660 /var/ossec/etc/shared/gebo-ai/agent.conf
      /var/ossec/bin/verify-agent-conf          # MUST print no error
      /var/ossec/bin/wazuh-control restart

  Then enroll the Gebo.ai hosts into the group (at registration time with
  `-G gebo-ai`, via <groups>gebo-ai</groups> in their <enrollment>, with
  WAZUH_AGENT_GROUP=gebo-ai for the containerized agent, or afterwards from the
  dashboard / `agent_groups -a -i <id> -g gebo-ai`).

  A malformed agent.conf is silently ignored by agents, which is why
  verify-agent-conf above is not optional.

  IMPORTANT: this file is shared by EVERY agent in the group, so it lists all
  the supported install layouts at once. A <localfile> whose path does not exist
  on a given agent is harmless (logcollector just reports it cannot open it),
  but keep only the blocks you actually deploy if you would rather not have that
  in the agent logs. os="Linux"/os="Windows" already keeps the two platforms
  apart.

  Paths, and why they are what they are: see
  deploy/wazuh/agent/localfile-blocks.xml and docs/wazuh-integration.md.
-->
<agent_config os="Linux">

  <!-- Monolith installed from .deb/.rpm: gebo.ai.app/pom.xml passes
       -DGEBO_LOG_BASE=/var/log/gebo-ai to the launcher and the package's
       postinst creates that directory. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/gebo-ai/security-log.jsonl</location>
  </localfile>

  <!-- Monolith in Docker, agent on the host: host side of the
       "- /home/gebo.ai/logs:/opt/gebo.ai/logs" mount in
       dockers/gebo.ai/docker-compose.yml. The all-in-one appliance
       (geboai/easyinstall.gebo.ai) and the Windows-host compose file publish
       nothing by default - mount /opt/gebo.ai/logs somewhere and the same path
       applies. -->
  <localfile>
    <log_format>json</log_format>
    <location>/home/gebo.ai/logs/security-log.jsonl</location>
  </localfile>

  <!-- Microservices in Docker, agent on the host, after applying
       deploy/wazuh/docker/docker-compose.security-logs.override.yml with
       GEBO_SECURITY_LOG_BASE=/var/log/gebo-ai-microservices (its fallback is
       ./security-logs inside dockers/gebo.microservices/). One block covers all
       21 services: the wildcard is expanded by the agent and each event names
       its own service in "application". -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/gebo-ai-microservices/*/security-log.jsonl</location>
  </localfile>

  <!-- Microservices installed per host: only the gateway ships as .deb/.rpm,
       and its launcher does NOT set GEBO_LOG_BASE, so the trail lands under the
       unit's WorkingDirectory=/home/gebo-ai-gateway. The wildcard also covers a
       host running several services this way. -->
  <localfile>
    <log_format>json</log_format>
    <location>/home/gebo-ai-*/logs/security-log.jsonl</location>
  </localfile>

</agent_config>

<agent_config os="Windows">

  <!-- Monolith installed from the .msi: gebo.ai.app/pom.xml passes
       -DGEBO_LOG_BASE=$APPDIR\instance\logs, and jpackage's $APPDIR is the
       "app" folder of the install directory. The installer offers a directory
       chooser over the default Program Files\GeboAI, so if your install was
       relocated, resolve the real path on the host with:
         $exe = (Get-CimInstance Win32_Service |
                 Where-Object { $_.PathName -like '*gebo-ai.exe*' } |
                 Select-Object -First 1).PathName.Trim('"')
         Join-Path (Split-Path $exe) 'app\instance\logs\security-log.jsonl'
       and put that path here. -->
  <localfile>
    <log_format>json</log_format>
    <location>C:\Program Files\GeboAI\app\instance\logs\security-log.jsonl</location>
  </localfile>

</agent_config>
