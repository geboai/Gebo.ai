<!--
  Minimal Wazuh AGENT configuration for a container whose only job is shipping
  Gebo.ai's security audit trail (security-log.jsonl) to a Wazuh manager.

  Used by deploy/wazuh/docker/docker-compose.wazuh-agent.yml, which mounts this
  file at /wazuh-config-mount/etc/ossec.conf inside the wazuh/wazuh-agent
  container. The container's init script copies it over /var/ossec/etc/ossec.conf
  and THEN replaces the CHANGE_* placeholders below from the environment
  (WAZUH_MANAGER_SERVER, WAZUH_MANAGER_PORT, WAZUH_REGISTRATION_SERVER,
  WAZUH_REGISTRATION_PORT, WAZUH_AGENT_NAME, WAZUH_AGENT_GROUP) - so leave the
  placeholders as they are and set the environment variables instead.

  Using it on a normal (non-container) agent: keep your distribution's own
  ossec.conf and only copy the <localfile> blocks from
  deploy/wazuh/agent/localfile-blocks.xml into it.

  Everything an audit-log shipper does not need (syscheck/FIM, rootcheck, SCA,
  vulnerability collection, active response, syslog collection) is off on
  purpose: less noise, less CPU, nothing to review. Turn any of it back on if
  you want this agent to do host monitoring too.
-->
<ossec_config>

  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>20</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <!--
      Gebo.ai can burst audit events during an ingestion run (every document
      read from a connected system is an integrationDataAccess event). 500/s is
      the Wazuh default; raise it if the agent log starts reporting a full
      buffer ("Agent buffer at 100 %").
    -->
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!--
    THE POINT OF THIS FILE.

    log_format json makes the agent send each line as-is, so the manager's
    built-in "json" decoder parses it into fields (eventType, action, outcome,
    userId, sourceIp, correlationId, ...). No custom decoder needed.

    The path below is where deploy/wazuh/docker/docker-compose.wazuh-agent.yml
    mounts the monolith's log directory. Add one block per extra directory (per
    microservice, for instance) - see localfile-blocks.xml.

    Only the LIVE file is tailed: rotated archives (logs/archived/*.jsonl.gz)
    must not be read, they were already shipped line by line when they were the
    live file.
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/gebo-logs/monolith/security-log.jsonl</location>
  </localfile>

  <!--
    Microservices cluster: uncomment together with the /gebo-logs/microservices
    mount in docker-compose.wazuh-agent.yml (and after bringing the stack up
    with docker-compose.security-logs.override.yml, which is what creates the
    per-service subdirectories). The directory wildcard is resolved by the
    agent's logcollector, so services added later are picked up on their own.
  -->
  <!--
  <localfile>
    <log_format>json</log_format>
    <location>/gebo-logs/microservices/*/security-log.jsonl</location>
  </localfile>
  -->

  <!-- Keep the agent's own log readable from the manager side. -->
  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>
