# The anthropic piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# AnthropicModelsLibrary under ai.gebo.models.providers.anthropic.
# No entry yet: its models, their context and the thinking they take come from the Anthropic Models API when the models are looked up.
# An entry goes under the key below, for example:
#
# ai.gebo.models.providers.anthropic:
#   parameterRules:
#     - providerId: anthropic
#       models: ["some-model-*"]
#       sampling: REJECTED
#       reasoningEfforts: [none, low, high]
#       source: the provider page the rule was read on, and when
