# The anthropic piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# AnthropicModelsLibrary under ai.gebo.models.providers.anthropic.
# The models, their context and the thinking they take come from the Anthropic Models API
# when the models are looked up; the parameter rules matter when it cannot be read.
# modelsInfo holds each model's limits for when the Models API leaves them out (a null
# max_input_tokens): contextLength is the most a request may carry as input, the model's
# context window - the docs state no other maximum of input tokens, and on the 4.5 models
# and newer input plus max_tokens may exceed the window (platform.claude.com/docs/en/
# build-with-claude/context-windows). The library matches a model id exactly: the 4.5
# models have their dated id and their alias. Read on the model pages 2026-11-26; Claude
# Mythos Preview has no id on them and no entry.
# Rules: the first one covering a model applies; "*" stands for any characters.
ai.gebo.models.providers.anthropic:
  modelsInfo:
    - providerId: anthropic
      modelId: claude-fable-5-2
      chatModel: true
      embeddingModel: false
      contextLength: 1000000
      maxOutputToken: 128000
      description: Claude Fable 5.2
      informativeUrl: https://platform.claude.com/docs/en/models/fable-5-2/overview
