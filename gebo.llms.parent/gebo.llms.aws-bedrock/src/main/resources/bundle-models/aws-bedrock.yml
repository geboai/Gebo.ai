# The aws-bedrock piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# BedrockModelsLibrary under ai.gebo.models.providers.aws-bedrock.
# No entry yet: the models and their lifecycle (legacy, end of life) come from the Bedrock foundation models lookup.
# An entry goes under the key below, for example:
#
# ai.gebo.models.providers.aws-bedrock:
#   parameterRules:
#     - providerId: aws-bedrock
#       models: ["some-model-*"]
#       sampling: REJECTED
#       reasoningEfforts: [none, low, high]
#       source: the provider page the rule was read on, and when
