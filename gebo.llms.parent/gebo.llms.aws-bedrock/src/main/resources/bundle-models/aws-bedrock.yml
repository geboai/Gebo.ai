  # The active and legacy models of the Bedrock model cards (docs.aws.amazon.com/bedrock/
  # latest/userguide/model-card-<model>.html, 2026-11-26), by their base model id, with the
  # "Context window" and "Max output tokens" each card states: as thousands where the card
  # writes "128K" ("1M" a million); no card states a maximum of input tokens below the
  # window. The models past their end of life are left out; a legacy model has its date.
  # The cross region profiles (global., us., eu., apac., au., jp., ca., in., us-gov.) prefix
  # these base ids.
