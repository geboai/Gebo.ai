    - providerId: openai
      modelId: gpt-6-luna
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 1050000
      maxOutputToken: 128000
      supportsFunctionCalls: true
      supportsReasoning: true
      description: GPT-6 Luna
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-6-luna
    - providerId: openai
      modelId: gpt-5.5
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 1050000
      maxOutputToken: 128000
      supportsFunctionCalls: true
      supportsReasoning: true
      description: GPT-5.5
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-5.5
    # The OpenAI fast setup presets (fetched 2026-11-15): both on Chat Completions, below
    # version 6; the gpt-5.4-mini page states 272,000 tokens of input in the window.
    - providerId: openai
      modelId: gpt-5.2
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 400000
      maxOutputToken: 128000
      supportsFunctionCalls: true
      supportsReasoning: true
      description: GPT-5.2
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-5.2
    - providerId: openai
      modelId: gpt-5.4-mini
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 400000
      maxOutputToken: 128000
      supportsFunctionCalls: true
      supportsReasoning: true
      description: GPT-5.4 mini
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-5.4-mini
    - providerId: openai
      modelId: gpt-5
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 400000
      maxOutputToken: 128000
      supportsFunctionCalls: true
      supportsReasoning: true
      description: GPT-5
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-5
  parameterRules:
    # OpenAI - every model below answered "400: Unsupported value: 'temperature' does not
    # support 0.0 with this model. Only the default (1) value is supported." at its
    # default effort, tested 2026-10-11. The latest-model guide: "When reasoning effort
    # is not none, remove temperature, top_p, and top_logprobs".
    - providerId: openai
      models: ["gpt-6.1-sol*", "gpt-6-astra*"]
      sampling: REJECTED
      reasoningEfforts: [low, medium, high, xhigh, max]
      source: developers.openai.com/api/docs/models/gpt-6.1-sol and gpt-6-astra (no effort none), 2026-10-11
    - providerId: openai
      models: ["gpt-6-sol*", "gpt-6-luna*"]
      sampling: WITHOUT_REASONING
      reasoningEfforts: [none, low, medium, high, xhigh, max]
      source: developers.openai.com/api/docs/models/gpt-6-sol and gpt-6-luna, 2026-10-11
    - providerId: openai
      models: ["gpt-5.5*"]
      sampling: REJECTED
      reasoningEfforts: [none, low, medium, high, xhigh]
      source: developers.openai.com/api/docs/models/gpt-5.5 (sampling at effort none not documented), 2026-10-11
    # The GPT-5.4 guide: temperature, top_p and logprobs "only supported when using
    # GPT-5.4 with reasoning effort set to none", and "Requests that include these fields
    # will raise an error for GPT-5.4 or GPT-5.2 with any other reasoning effort setting".
    - providerId: openai
      models: ["gpt-5.2", "gpt-5.2-2025-12-11"]
      sampling: WITHOUT_REASONING
      reasoningEfforts: [none, low, medium, high, xhigh]
      source: developers.openai.com/api/docs/models/gpt-5.2 and guides/gpt-5.4, 2026-11-15
    # The same efforts; the guide's sampling rule does not name the mini, so it is kept
    # refused until a request shows it takes them at effort none.
    - providerId: openai
      models: ["gpt-5.4-mini", "gpt-5.4-mini-2026-03-17"]
      sampling: REJECTED
      reasoningEfforts: [none, low, medium, high, xhigh]
      source: developers.openai.com/api/docs/models/gpt-5.4-mini and guides/gpt-5.4, 2026-11-15
    - providerId: openai
      models: ["gpt-5"]
      sampling: REJECTED
      reasoningEfforts: [minimal, low, medium, high]
      source: developers.openai.com/api/docs/models/gpt-5, 2026-10-11
    - providerId: openai
      models: ["gpt-5*"]
      sampling: REJECTED
      source: temperature refused by gpt-5 and gpt-5.5, tested 2026-10-11
    - providerId: openai
      models: ["o1*", "o3*", "o4*"]
      sampling: REJECTED
      source: temperature refused by o3 and o4-mini, tested 2026-10-11
    # Input modalities of the dated variants of the models above (a snapshot shares its
    # model's page). These rules state nothing of the parameters and are read apart.
    - providerId: openai
      models: ["gpt-4o-20*", "gpt-4o-mini-20*", "gpt-4.1-20*", "gpt-4.1-mini-20*", "gpt-5-20*", "gpt-5.2-20*",
        "gpt-5.4-mini-20*", "gpt-5.5-20*", "gpt-6-sol-20*", "gpt-6-luna-20*", "gpt-6-astra-20*", "gpt-6.1-sol-20*"]
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      source: the model pages and the file inputs guide named at the top of this file
