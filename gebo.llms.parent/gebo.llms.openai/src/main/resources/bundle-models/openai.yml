# The openai segment of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules). The abstraction layer
# collects every provider library bean; this one binds ai.gebo.models.providers.openai.
# A rule applies to its providerId only.
# Rules: the first one covering a model applies, so specific models come before family
# patterns ("*" stands for any characters); unset fields are unknown.
ai.gebo.models.providers.openai:
  modelsInfo:
    - providerId: openai
      modelId: gpt-4o
      chatModel: true
      embeddingModel: false
      contextLength: 128000
      maxOutputToken: 16384
      tokenizingThreashold:
      description: GPT-4o openai flagship model
      informativeUrl: https://platform.openai.com/docs/models/gpt-4o
    - providerId: openai
      modelId: gpt-4o-2024-05-13
