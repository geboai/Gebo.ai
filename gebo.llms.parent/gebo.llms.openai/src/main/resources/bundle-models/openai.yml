      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 128000
      maxOutputToken: 16384
      tokenizingThreashold:
      description: GPT-4o mini 2024-07-18 openai flagship model
      informativeUrl: https://platform.openai.com/docs/models/gpt-4o-mini
    - providerId: openai
      modelId: text-embedding-3-large
      chatModel: false
      embeddingModel: true
      contextLength: 8191
      maxOutputToken:
      tokenizingThreashold: 8191
      description: text-embedding-3-large openai embedding model
      informativeUrl:
    - providerId: openai
      modelId: text-embedding-3-small
      chatModel: false
      embeddingModel: true
      contextLength: 8191
      maxOutputToken:
      tokenizingThreashold: 8191
      description: text-embedding-3-small openai embedding model
      informativeUrl:
    - providerId: openai
      modelId: text-embedding-ada-002
      chatModel: false
      embeddingModel: true
      contextLength: 8191
      maxOutputToken:
      tokenizingThreashold: 8191
      description: text-embedding-ada-002 openai embedding model
      informativeUrl:
    # The current models, from their pages on developers.openai.com/api/docs/models
    # (fetched 2026-10-11): OpenAI's /v1/models gives id, created, owned_by and
    # shutdown_date only, so this is where their limits come from. supportsFunctionCalls
    # is about the api Gebo calls each model through: the models of version 6 and later go
    # through the Responses api (Spring AI's OpenAiResponsesChatModel), where their pages list function
    # calling - on Chat Completions gpt-6.1-sol and gpt-6-astra call no tools (reasoning
    # guide) and gpt-6-sol / gpt-6-luna only at reasoning effort none (their pages).
    - providerId: openai
      modelId: gpt-4.1-mini
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 1047576
      maxOutputToken: 32768
      supportsFunctionCalls: true
      supportsReasoning: false
      description: GPT-4.1 mini
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-4.1-mini
    - providerId: openai
      modelId: gpt-6.1-sol
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 1050000
      maxOutputToken: 128000
      supportsFunctionCalls: true
      supportsReasoning: true
      description: GPT-6.1 Sol
      informativeUrl: https://developers.openai.com/api/docs/models/gpt-6.1-sol
    - providerId: openai
      modelId: gpt-6-astra
