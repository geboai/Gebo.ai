# The openai segment of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules). The abstraction layer
# collects every provider library bean; this one binds ai.gebo.models.providers.openai.
# A rule applies to its providerId only.
# Rules: the first one covering a model applies, so specific models come before family
# patterns ("*" stands for any characters); unset fields are unknown.
# inputModalities, what a model accepts as input, comes from its model page
# (developers.openai.com/api/docs/models, 2026-11-18): OpenAI's models api does not tell it.
# gpt-6-astra, gpt-6-sol and gpt-5.5 read on their pages 2026-11-19 ("Input modalities:
# text, image"). DOCUMENT is not a field of the model pages: the file inputs guide
# (developers.openai.com/api/docs/guides/file-inputs, 2026-11-19) says "PDF parsing with
# text and page images requires a model that accepts image inputs", so the models that
# take images take PDF files too.
# A model whose page was not checked has none, which means text only.
# contextLength is the most a request may carry as input: the "Maximum input tokens" of
# the model page where it states one (the window less the 128,000 tokens of output kept
# for the answer), else its context window. The budgets take the generated tokens off it,
# so they never build a request larger than OpenAI accepts; a model the library does not
# know is given 8,192 tokens. Checked on the model pages 2026-11-26.
# The library matches a model id exactly: each snapshot a model page lists has an entry
# of its own, a copy of its model's; the parameter rules at the end of the file that
# state inputModalities cover the other dated variants by pattern.
ai.gebo.models.providers.openai:
  modelsInfo:
    - providerId: openai
      modelId: gpt-4o
      inputModalities: [TEXT, IMAGE, DOCUMENT]
      chatModel: true
      embeddingModel: false
      contextLength: 128000
      maxOutputToken: 16384
      tokenizingThreashold:
      description: GPT-4o openai flagship model
      informativeUrl: https://platform.openai.com/docs/models/gpt-4o
