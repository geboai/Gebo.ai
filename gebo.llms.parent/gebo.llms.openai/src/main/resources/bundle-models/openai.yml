      chatModel: false
      embeddingModel: true
      contextLength: 8191
      maxOutputToken:
      tokenizingThreashold: 8191
      description: text-embedding-ada-002 openai embedding model
      informativeUrl:
  parameterRules:
    # OpenAI - every model below answered "400: Unsupported value: 'temperature' does not
    # support 0.0 with this model. Only the default (1) value is supported." at its
    # default effort, tested 2026-10-11. The latest-model guide: "When reasoning effort
    # is not none, remove temperature, top_p, and top_logprobs".
    - providerId: openai
      models: ["gpt-6.1-sol*", "gpt-6-astra*"]
      sampling: REJECTED
      reasoningEfforts: [low, medium, high, xhigh, max]
      source: developers.openai.com/api/docs/models/gpt-6.1-sol and gpt-6-astra (no effort none), 2026-10-11
    - providerId: openai
      models: ["gpt-6-sol*", "gpt-6-luna*"]
      sampling: WITHOUT_REASONING
      reasoningEfforts: [none, low, medium, high, xhigh, max]
      source: developers.openai.com/api/docs/models/gpt-6-sol and gpt-6-luna, 2026-10-11
    - providerId: openai
      models: ["gpt-5.5*"]
      sampling: REJECTED
      reasoningEfforts: [none, low, medium, high, xhigh]
      source: developers.openai.com/api/docs/models/gpt-5.5 (sampling at effort none not documented), 2026-10-11
    - providerId: openai
      models: ["gpt-5"]
      sampling: REJECTED
      reasoningEfforts: [minimal, low, medium, high]
      source: developers.openai.com/api/docs/models/gpt-5, 2026-10-11
    - providerId: openai
      models: ["gpt-5*"]
      sampling: REJECTED
      source: temperature refused by gpt-5 and gpt-5.5, tested 2026-10-11
    - providerId: openai
      models: ["o1*", "o3*", "o4*"]
      sampling: REJECTED
      source: temperature refused by o3 and o4-mini, tested 2026-10-11
