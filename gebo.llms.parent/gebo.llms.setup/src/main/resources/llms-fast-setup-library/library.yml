    - vendorInfo:
        vendorId: deepseek
        name: Deepseek
        description: Deepseek
        acquireKeyUrl: https://platform.deepseek.com/api_keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://www.deepseek.com/
        apiKeySecretContext: deepseek
        minContextWindow: 128000
      presets:
        - type: CHAT
          serviceHandler: chat-deepseek
          doModelsLookup: true
          choices:
            - code: deepseek-chat
              description: DeepSeek Latest Non thinking
              uses: CHAT , INTERNAL_SERVICES
            - code: deepseek-reasoner
              description: DeepSeek Latest Thinking
              uses: CHAT
              defaultChoice: true
    - vendorInfo:
        vendorId: xai
        name: XaI
        description: XaI (grok)
        acquireKeyUrl: https://console.x.ai/
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://xai.com/
        apiKeySecretContext: xai
        minContextWindow: 138000
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-xai
          apiKeySecretContext: chatmodel-xai
          doModelsLookup: true
          choices:
            - code: grok-4-1-fast-reasoning
              description: Grok 4.1 fast reasoning
              contextWindow: 2000000
              uses: CHAT
            - code: grok-4-1-fast-non-reasoning
              description: Grok 4.1 fast non reasoning
              contextWindow: 2000000
              uses: CHAT
              defaultChoice: true
            - code: grok-4-fast-reasoning
              description: Grok 4 fast reasoning
              contextWindow: 2000000
              uses: CHAT
            - code: grok-4-fast-non-reasoning
              description: Grok 4 fast non reasoning
              contextWindow: 2000000
              uses: CHAT
            - code: grok-3-mini
              description: Grok 3 mini
              contextWindow: 138000
              uses: INTERNAL_SERVICES
        - type: EMBEDDING
          serviceHandler: embedding-xai
          apiKeySecretContext: embedding-xai
          doModelsLookup: true
          choices:
            - code: embedding
              description: embedding model
              defaultChoice: true
    - vendorInfo:
        vendorId: nvidia
        name: NVidia
        description: NVidia cloud AI services
        acquireKeyUrl: https://build.nvidia.com/
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://build.nvidia.com/models
        apiKeySecretContext: nvidia
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-nvidia
          doModelsLookup: true
          choices:
            - code: meta/llama-3.1-405b-instruct
              description: Meta Llama 3.1 405b instruct
              uses: CHAT
            - code: deepseek-ai/deepseek-r1-0528
              description: DeepSeek R1 0528
              defaultChoice: true
              uses: CHAT
            - code: meta/llama-3.3-70b-instruct
              description: Meta Llama 3.3 70b instruct
              uses: CHAT
            - code: meta/llama-3.1-8b-instruct
              description: Meta Llama 3.1 8b instruct
              uses: INTERNAL_SERVICES

        - type: EMBEDDING
          serviceHandler: embedding-nvidia
          doModelsLookup: true
          choices:
            - code: nvidia/nv-embed-v1
              description: nvidia embed v1
              defaultChoice: true
    - vendorInfo:
        vendorId: mistral.ai
        name: Mistral.ai
        description: Mistral AI provider (France)
        acquireKeyUrl: https://console.mistral.ai/home
        requiresApiKey: true
        requiresCustomUrl: false
        apiKeySecretContext: mistralai
        webSite: https://mistral.ai
        minContextWindow: 256000
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-mistral
          doModelsLookup: true
          choices:
            - code: magistral-medium-latest
              description: Magistral medium Latest
              uses: CHAT
            - code: devstral-medium-latest
              description: Devstral medium
              uses: CHAT
            - code: mistral-medium-latest
              description: Mistral Medium Latest
              uses: CHAT
            - code: mistral-large-latest
              description: Mistral Large Latest
              uses: CHAT
              defaultChoice: true
            - code: magistral-small-latest
              description: Mistral Small Latest
              uses: CHAT
            - code: ministral-8b-latest
              description: Ministral 8b
              uses: INTERNAL_SERVICES

        - type: EMBEDDING
          serviceHandler: embedding-mistral
          doModelsLookup: true
          choices:
            - code: mistral-embed
              description: mistral-embed
              defaultChoice: true
            - code: codestral-embed
              description: codestral-embed code extraction embedding model

    - vendorInfo:
        vendorId: groq
        name: Groq
        description: Groq AI provider
        acquireKeyUrl: https://console.groq.com/keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://groq.com/
        apiKeySecretContext: groq
        minContextWindow: 131072
      presets:
        # No EMBEDDING preset: groq does not document an embeddings endpoint and its
        # models list carries no embedding model, so the type can only ever offer an
        # empty choice list. The embedding-groq handler was removed with it.
        - type: CHAT
          serviceHandler: chatmodel-groq
          doModelsLookup: true
          choices:
            - code: llama-3.3-70b-versatile
              description: Meta Llama 3.3 70b versatile
              contextWindow: 131072
              uses: CHAT
              defaultChoice: true
            - code: openai/gpt-oss-120b
              description: OpenAI Gpt OSS 120b
              contextWindow: 131072
              uses: CHAT
            - code: groq/compound
              description: Groq Compound (agentic system with built in tools)
              contextWindow: 131072
              uses: CHAT
            - code: llama-3.1-8b-instant
              description: Meta Llama 3.1 8b instant
              contextWindow: 131072
              uses: INTERNAL_SERVICES
        # doModelsLookup=false: the transcript handler has no models list for groq, so
        # its lookup would answer with the OpenAI whisper-1 suggestion and every code
        # below would be rejected as unavailable. The preset codes are trusted instead.
        - type: TRANSCRIPT
          serviceHandler: transcript-groq
          doModelsLookup: false
          choices:
            - code: whisper-large-v3-turbo
              description: Whisper Large v3 Turbo (fast speech to text)
              defaultChoice: true
            - code: whisper-large-v3
              description: Whisper Large v3 (speech to text)
    - vendorInfo:
        vendorId: openrouter.ai
        name: OpenRouter.ai
        description: OpenRouter.ai AI provider
        acquireKeyUrl: https://openrouter.ai/workspaces/default/keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://openrouter.ai
        apiKeySecretContext: openrouter.ai
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-openrouter.ai
          doModelsLookup: true
          choices:
            # The default is the cheapest model here that stays reliable once tools are
            # in play, which is what a chat pipeline spends most of its calls on: glm
            # 5.3 flash costs 0.09/0.30 per million in and out, carries a 1.3M context
            # and scores above the other flash-class models on the agentic benchmarks.
            - code: z-ai/glm-5.3-flash
              description: Z.ai GLM 5.3 Flash
              contextWindow: 1310720
              uses: CHAT
              defaultChoice: true
            # Kept as an option but no longer the default: gpt-oss-120b is unreliable at
            # function calling, which a chat that dispatches tools depends on.
            - code: openai/gpt-oss-120b
              description: OpenAI Gpt OSS 120b
              contextWindow: 131072
              uses: CHAT
            - code: deepseek/deepseek-v4-flash
              description: DeepSeek V4 Flash
              contextWindow: 1048576
              uses: CHAT
            - code: openai/gpt-oss-20b
              description: OpenAI Gpt OSS 20b
              uses: INTERNAL_SERVICES
        - type: EMBEDDING
          serviceHandler: embedding-openrouter.ai
          choices:
            - code: qwen/qwen3-embedding-8b
              description: Qwen3 Embedding 8b
              defaultChoice: true
          doModelsLookup: true
        - type: RANKING
          serviceHandler: ranker-openrouter.ai
          doModelsLookup: true
          choices:
            - code: cohere/rerank-4-pro
              description: Chohere Rerank 4 pro
              defaultChoice: true
        # Image generation was the one model type openrouter.ai had a handler for -
        # images-openrouter.ai, which resolves its choices by the image output modality -
        # without anything offering it in the setup.
        #
        # The default is picked on the same grounds as the chat one: the cheapest model
        # that is still a full text-to-image generator, not the most capable one. Image
        # output is billed per output token, and the openai gpt-image-2.5 tier that used
        # to be the default sits at 0.00003 - the top band - while qwen-image-3 is at
        # 0.0000072, so a default nobody changed cost four times what it had to.
        #
        # Every code here outputs image ONLY (text+image->image). The gemini and gpt-5
        # families answer text+image, so the reply carries prose alongside the picture
        # and the image response handler has to fish it out; they are deliberately not
        # offered, and google/gemini-3-pro-image was dropped from this list for that
        # reason as much as for its price.
        - type: IMAGESGEN
          serviceHandler: images-openrouter.ai
          doModelsLookup: true
          choices:
            - code: qwen/qwen-image-3
              description: Qwen Image 3 (text to image generation)
              defaultChoice: true
            - code: black-forest-labs/flux.2-pro
              description: Black Forest Labs FLUX.2 Pro
            - code: openai/gpt-image-1-mini
              description: OpenAI GPT Image 1 mini (low cost)
            - code: openai/gpt-image-2.5-flare
              description: OpenAI GPT Image 2.5 Flare (fast image generation)
            - code: openai/gpt-image-2.5-sunburst
              description: OpenAI GPT Image 2.5 Sunburst (highest quality, highest cost)
        - type: TRANSCRIPT
          serviceHandler: transcript-openrouter.ai
          doModelsLookup: true
          choices:
            - code: openai/whisper-1
              description: OpenAI Whisper 1 (speech to text)
              defaultChoice: true
        - type: TTS
          serviceHandler: tts-openrouter.ai
          doModelsLookup: true
          choices:
            # The widest voice coverage here belongs to gemini 3.1 flash tts, which is also
            # the most used model of this type on openrouter.ai - 70+ languages against the
            # 15 of the microsoft voice and the 8 of kokoro - but it cannot be the default
            # while the generic text to speech handler asks every provider for mp3:
            # tested against a live key it answers
            #   400 Gemini TTS only supports response_format="pcm". Got "mp3".
            # and the call fails. It stays listed for the day the handler negotiates the
            # format per model, and the default is the widest-reaching voice that does
            # answer in mp3, verified end to end on this installation.
            - code: minimax/speech-2.8-hd
              description: MiniMax Speech 2.8 HD (multilanguage)
              defaultChoice: true
            - code: minimax/speech-2.8-turbo
              description: MiniMax Speech 2.8 Turbo (multilanguage)
            - code: microsoft/mai-voice-2
              description: Microsoft MAI Voice 2 (15 languages)
            - code: google/gemini-3.1-flash-tts-preview
              description: Google Gemini 3.1 Flash TTS (70+ languages, needs pcm support)
            - code: deepgram/aura-2
              description: Deepgram Aura 2
            - code: hexgrad/kokoro-82m
              description: Kokoro 82M (8 languages)

    - vendorInfo:
        vendorId: ollama
        name: Ollama
        description: Ollama, large language model server that runs on your infrastructure
        requiresApiKey: false
        requiresCustomUrl: true
        defaultCustomUrl: http://localhost:11434
        webSite: https://ollama.com/
        apiKeySecretContext: ollama
      presets:
        - type: CHAT
          serviceHandler: chat-ollama
          doModelsLookup: true

        - type: EMBEDDING
          serviceHandler: embedding-ollama
          doModelsLookup: true

    - vendorInfo:
        vendorId: vllm
        name: vLLM on premise infrastructure
        description: vLLM on premise infrastructure
        requiresApiKey: false
        requiresCustomUrl: true
        webSite: https://docs.vllm.ai/en/latest/
        defaultCustomUrl: http://localhost:8000/
        apiKeySecretContext: vllm
      presets:
        - type: CHAT
          serviceHandler: chatmodel-vllm
          doModelsLookup: true

        - type: EMBEDDING
          serviceHandler: embedding-vllm
          doModelsLookup: true
        - type: RANKING
          serviceHandler: ranker-vllm
          doModelsLookup: true

    - vendorInfo:
        vendorId: generic-openai
        name: OpenAI compliant API provider
        description: Generic OpenAI compliant API provider
        requiresApiKey: false
        requiresCustomUrl: true
        defaultCustomUrl:
        webSite:
        apiKeySecretContext: generic-openai
      presets:
        - type: CHAT
          serviceHandler: chatmodel-generic-openai
          doModelsLookup: true
        - type: EMBEDDING
          serviceHandler: embedding-generic-openai
          doModelsLookup: true
        - type: RANKING
          serviceHandler: ranker-generic-openai
          doModelsLookup: true
