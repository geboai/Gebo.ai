ai.gebo.llms.vendors.setup.config:
  vendors:
    - vendorInfo:
        vendorId: regolo.ai
        name: Regolo.ai
        description: Regolo.ai AI provider (Italian)
        acquireKeyUrl: https://dashboard.regolo.ai/api-keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://regolo.ai
        apiKeySecretContext: regolo.ai
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-regolo.ai
          doModelsLookup: true
          choices:
            - code: qwen3.5-122b
              uses: CHAT
              defaultChoice: true
              thinking: HIGH_THINKING
              maxGeneratedTokens: 6000
            - code: gpt-oss-120b
              description: OpenAI Gpt OSS 120b
              uses: CHAT
            # Replaces Llama-3.3-70B-Instruct, which regolo.ai no longer serves.
            - code: glm5.2
              description: Z.ai GLM 5.2
              uses: CHAT
            # NO_THINKING states the intent - an internal services model should not spend
            # tokens reasoning - but an openai compatible provider has no portable way to
            # ask for it, so this one is not sent: see the thinking handling in
            # GenericOpenAIAPIChatModelConfigurationSupportService.
            - code: gpt-oss-20b
              description: OpenAI Gpt OSS 20b
              uses: INTERNAL_SERVICES
              thinking: NO_THINKING
              maxGeneratedTokens: 4000
        - type: EMBEDDING
          serviceHandler: embedding-regolo.ai
          doModelsLookup: true
          choices:
            - code: Qwen3-Embedding-8B
              description: Qwen3 Embedding 8b
              defaultChoice: true
        - type: RANKING
          serviceHandler: ranker-regolo.ai
          doModelsLookup: true
          choices:
            - code: Qwen3-Reranker-4B
              description: Qwen3 Reranker 4B
              defaultChoice: true
        - type: IMAGESGEN
          serviceHandler: images-regolo.ai
          doModelsLookup: true
          choices:
            - code: Qwen-Image
              description: Qwen Image 2512 (text to image generation)
              defaultChoice: true
        - type: TRANSCRIPT
          serviceHandler: transcript-regolo.ai
          doModelsLookup: true
          choices:
            - code: faster-whisper-large-v3
              description: Faster Whisper Large v3 (speech to text)
              defaultChoice: true
        # Regolo documents /audio/speech (OpenAI createSpeech parameters), but its model
        # catalog publishes no model with mode=audio_speech yet, so there is no code to
        # preset here: the choices are left to the lookup, which RegoloAIModelsListProviderService
        # already resolves by that mode. Add a defaultChoice once Regolo lists a voice
        # model - a code guessed now would only be reported back as unresolved.
        - type: TTS
          serviceHandler: tts-regolo.ai
          doModelsLookup: true

    - vendorInfo:
        vendorId: openai
        name: OpenAI
        description: OpenAI chatgpt
        acquireKeyUrl: https://platform.openai.com/api-keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://openai.com/
        apiKeySecretContext: openai
        minContextWindow: 128000
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatgpt-OpenAI
          doModelsLookup: true
          choices:
            - code: gpt-4o
              description: Gpt 4o
              contextWindow: 128000
              uses: CHAT
            - code: gpt-4.1
              description: Gpt 4.1
              contextWindow: 1000000
              uses: CHAT
              defaultChoice: true
            - code: gpt-5
              description: Gpt 5
              contextWindow: 400000
              uses: CHAT
            - code: gpt-4o-mini
              description: Gpt 4o mini
              contextWindow: 128000
              uses: INTERNAL_SERVICES
        - type: EMBEDDING
          serviceHandler: embedding-OpenAI
          doModelsLookup: true
          choices:
            - code: text-embedding-3-large
              description: text embedding 3 large
              defaultChoice: true
        - type: IMAGESGEN
          serviceHandler: image-generation-OpenAI
          doModelsLookup: true
          choices:
            - code: gpt-image-1
              description: GPT Image 1 (high quality image generation)
              defaultChoice: true
            - code: dall-e-3
              description: DALL-E 3
            - code: dall-e-2
              description: DALL-E 2
        - type: TTS
          serviceHandler: openai-tts
          doModelsLookup: true
          choices:
            - code: gpt-4o-mini-tts
              description: GPT-4o mini text to speech
              defaultChoice: true
            - code: tts-1
              description: TTS 1 (low latency)
            - code: tts-1-hd
              description: TTS 1 HD (higher quality)
        - type: TRANSCRIPT
          serviceHandler: openai-transcript
          doModelsLookup: true
          choices:
            - code: gpt-4o-transcribe
              description: GPT-4o Transcribe (speech to text)
              defaultChoice: true
            - code: gpt-4o-mini-transcribe
              description: GPT-4o mini Transcribe
            - code: whisper-1
              description: Whisper 1
    - vendorInfo:
        vendorId: anthropic
        name: Anthropic
        description: Anthropic
        acquireKeyUrl: https://console.anthropic.com/settings/keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://anthropic.com/
        apiKeySecretContext: anthropic
        minContextWindow: 200000
      presets:
        - type: CHAT
          serviceHandler: chat-anthropic
          doModelsLookup: true
          choices:
            - code: claude-sonnet-5
              uses: CHAT
              description: Claude Sonnet 5
              defaultChoice: true
            - code: claude-haiku-4-5
              uses: INTERNAL_SERVICES
              description: Claude Haiku 4.5
            - code: claude-opus-4-8
              description: Claude Opus 4.8
              uses: CHAT

