ai.gebo.llms.vendors.setup.config:
  # The presets set up a platform tuned for its uses, the user choosing none of these
  # settings (2026-11-27):
  # - a chat model (uses CHAT) thinks at MEDIUM_THINKING where the model takes a thinking
  #   level (sent as the nearest one the model lists, see the models library rules);
  # - a service model (uses INTERNAL_SERVICES: ranking filter, routing, query rewriting)
  #   thinks at NO_THINKING where the model can stop thinking, else LOW_THINKING, and
  #   takes temperature 0 wherever it takes a temperature (the chat model sets it when
  #   none is configured);
  # - a model left without a thinking level here gets it by the same rule when its
  #   integration tells what the model takes (GeboLLMSSetupService), else keeps the
  #   provider's default;
  # - a preset model is not one its provider announces retiring within six months;
  # - a context window is preset only where the provider's models list gives none
  #   (openai, aws-bedrock, xai, nvidia, llmax, profundoai): where it gives one
  #   (regolo.ai, groq, openrouter.ai, and the providers with their own lookup) the
  #   chosen model carries it, and a preset value would override it.
  vendors:
    - vendorInfo:
        vendorId: regolo.ai
        name: Regolo.ai
        description: Regolo.ai AI provider (Italian)
        acquireKeyUrl: https://dashboard.regolo.ai/api-keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://regolo.ai
        apiKeySecretContext: regolo.ai
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-regolo.ai
          doModelsLookup: true
          choices:
            # A reasoning model: its reasoning counts in maxGeneratedTokens, a high reasoning
            # effort could use them all before the answer; maxGeneratedTokens stays moderate,
            # it also bounds a looping answer. 8000 leaves room to an exhaustive report (one
            # cut at 6000, after about 28700 characters of a comparative analysis): a looping
            # answer is stopped at most 2000 tokens later, about 20 seconds.
            - code: qwen3.5-122b
              uses: CHAT
              defaultChoice: true
              thinking: MEDIUM_THINKING
              maxGeneratedTokens: 8000
            - code: gpt-oss-120b
              description: OpenAI Gpt OSS 120b
              uses: CHAT
              thinking: MEDIUM_THINKING
            # Replaces Llama-3.3-70B-Instruct, which regolo.ai no longer serves.
            - code: glm5.2
              description: Z.ai GLM 5.2
              uses: CHAT
            # An internal services model should spend few tokens reasoning. gpt-oss cannot
            # stop reasoning and NO_THINKING is not sent to an openai compatible provider
            # (see the thinking handling in GenericOpenAIAPIChatModelConfigurationSupportService):
            # left at regolo.ai's default effort, about one partial analysis in six generated all
            # its maxGeneratedTokens without any text and came back empty. LOW_THINKING is sent as
            # reasoning_effort "low", which regolo.ai lists among the parameters of the model.
            - code: gpt-oss-20b
              description: OpenAI Gpt OSS 20b
              uses: INTERNAL_SERVICES
              thinking: LOW_THINKING
              maxGeneratedTokens: 4000
        - type: EMBEDDING
          serviceHandler: embedding-regolo.ai
          doModelsLookup: true
          choices:
            - code: Qwen3-Embedding-8B
              description: Qwen3 Embedding 8b
              defaultChoice: true
        - type: RANKING
          serviceHandler: ranker-regolo.ai
          doModelsLookup: true
          choices:
            - code: Qwen3-Reranker-4B
              description: Qwen3 Reranker 4B
              defaultChoice: true
        - type: IMAGESGEN
          serviceHandler: images-regolo.ai
          doModelsLookup: true
          choices:
            - code: Qwen-Image
              description: Qwen Image 2512 (text to image generation)
              defaultChoice: true
        - type: TRANSCRIPT
          serviceHandler: transcript-regolo.ai
          doModelsLookup: true
          choices:
            - code: faster-whisper-large-v3
              description: Faster Whisper Large v3 (speech to text)
              defaultChoice: true
        # Regolo documents /audio/speech (OpenAI createSpeech parameters), but its model
        # catalog publishes no model with mode=audio_speech yet, so there is no code to
        # preset here: the choices are left to the lookup, which RegoloAIModelsListProviderService
        # already resolves by that mode. Add a defaultChoice once Regolo lists a voice
        # model - a code guessed now would only be reported back as unresolved.
        - type: TTS
          serviceHandler: tts-regolo.ai
          doModelsLookup: true

    - vendorInfo:
        vendorId: openai
        name: OpenAI
        description: OpenAI chatgpt
        acquireKeyUrl: https://platform.openai.com/api-keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://openai.com/
        apiKeySecretContext: openai
        minContextWindow: 128000
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatgpt-OpenAI
          doModelsLookup: true
          choices:
            # gpt-4.1 and gpt-4.1-mini, preset until now, shut down on 2027-01-14
            # (developers.openai.com/api/docs/deprecations, 2026-11-15). Their successors here
            # are reasoning models whose default effort, none, turns the reasoning off; the
            # temperature follows the models library's parameter rules
            # (bundle-models/openai.yml), sent only where the model is known to take it.
            # Both models have a 400,000 token window with up to 128,000 tokens of output, so
            # 272,000 of input (the gpt-5.4-mini page states it): contextWindow is that input,
            # so that the budgets never build a request larger than OpenAI accepts.
            # gpt-5.2 runs the agentic chat: it reasons at effort medium, the chat default
            # (efforts none, low, medium, high, xhigh). On Chat Completions the reasoning is not carried from one tool
            # round to the next (the GPT-5.4 guide: passing it "exists only in the Responses
            # API"), each round reasons again. Its temperature is taken only at effort none
            # (the same guide), so none is sent while it reasons. The reasoning counts in the
            # generated tokens.
            - code: gpt-5.2
              description: GPT-5.2
              contextWindow: 272000
              uses: CHAT
              thinking: MEDIUM_THINKING
              defaultChoice: true
            # gpt-5.4-mini serves the internal services, short judgement calls: the reasoning
            # is off (NO_THINKING sends effort none). The guide's temperature rule names
            # gpt-5.4 and gpt-5.2 only, so no temperature is sent to it.
            - code: gpt-5.4-mini
              description: GPT-5.4 mini
              contextWindow: 272000
              uses: INTERNAL_SERVICES
              thinking: NO_THINKING
        - type: EMBEDDING
          serviceHandler: embedding-OpenAI
          doModelsLookup: true
          choices:
            - code: text-embedding-3-large
              description: text embedding 3 large
              defaultChoice: true
        - type: IMAGESGEN
          serviceHandler: image-generation-OpenAI
          doModelsLookup: true
          choices:
            # gpt-image-1 was shut down on 2026-10-01, DALL-E 2 and 3 on 2026-05-12;
            # gpt-image-2 shuts down on 2027-02-10, naming gpt-image-2.6-sunburst and
            # gpt-image-2.6-flare as replacements (developers.openai.com/api/docs/deprecations,
            # 2026-11-27). Both 2.6 models support v1/images/generations and v1/images/edits.
            - code: gpt-image-2.6-flare
              description: GPT Image 2.6 Flare (fast image generation)
              defaultChoice: true
            - code: gpt-image-2.6-sunburst
              description: GPT Image 2.6 Sunburst (highest quality)
            - code: gpt-image-2.5-flare
              description: GPT Image 2.5 Flare (fast image generation)
            - code: gpt-image-2.5-sunburst
              description: GPT Image 2.5 Sunburst (highest quality)
        # No TTS preset: "The tts-1, tts-1-hd, and gpt-4o-mini-tts models are deprecated
        # and will shut down on January 6, 2027. Migrate to gpt-realtime-2.1-mini using the
        # Realtime API", and "gpt-realtime-2.1-mini isn't a supported model for
        # /v1/audio/speech" (developers.openai.com/api/docs/guides/text-to-speech,
        # 2026-11-27): no current OpenAI model takes the speech endpoint the openai-tts
        # handler calls. A text to speech model of another vendor serves instead.
        - type: TRANSCRIPT
          serviceHandler: openai-transcript
          doModelsLookup: true
          choices:
            # gpt-4o-transcribe, gpt-4o-mini-transcribe and whisper-1 shut down on 2027-02-26
            # and are no longer preset; their other replacement, gpt-live-transcribe, takes
            # the realtime transcription sessions only (its page, 2026-11-27). The OpenAI
            # transcript handler asks for json, which gpt-transcribe answers.
            - code: gpt-transcribe
              description: GPT Transcribe (speech to text)
              defaultChoice: true
        # Optional: a decision model judging the retrieved fragments, on the Decisions
        # API; the models endpoint does not list the decision models reliably
        - type: DECISION
          serviceHandler: decision-OpenAI
          doModelsLookup: false
          choices:
            - code: gpt-6-luna
              description: GPT-6 Luna (decision model)
              defaultChoice: true

    - vendorInfo:
        vendorId: anthropic
        name: Anthropic
        description: Anthropic
        acquireKeyUrl: https://console.anthropic.com/settings/keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://anthropic.com/
        apiKeySecretContext: anthropic
        minContextWindow: 200000
      presets:
        - type: CHAT
          serviceHandler: chat-anthropic
          doModelsLookup: true
          choices:
            # The current lineup (Claude Models API, 2026-10). The models before it remain
            # callable as legacy models, but the setup validates every code against the
            # live models list, so only current models are preset.
            # The chat models think adaptively at effort medium.
            - code: claude-sonnet-5-5
              uses: CHAT
              description: Claude Sonnet 5.5
              defaultChoice: true
              thinking: MEDIUM_THINKING
            # The internal services model does not think: "You can also send thinking:
            # {"type": "disabled"} at high effort or below" (Claude Haiku 5.5,
            # platform.claude.com/docs/en/build-with-claude/effort, 2026-11-27).
            - code: claude-haiku-5-5
              uses: INTERNAL_SERVICES
              description: Claude Haiku 5.5
              thinking: NO_THINKING
            - code: claude-opus-5-5
              description: Claude Opus 5.5
              uses: CHAT
              thinking: MEDIUM_THINKING
            # Fable 5.2 is the Fable of the latest models (5.1 stays active, no sooner than
            # 2027-09-01, models overview and deprecations, 2026-11-27). It thinks on every
            # request: "no thinking" is not accepted by this model.
            - code: claude-fable-5-2
              description: Claude Fable 5.2
              uses: CHAT
              thinking: MEDIUM_THINKING

# AWS Bedrock: credentials and region travel in one AWS_CONNECTION secret, picked or
# created in the setup. Codes from the Bedrock model cards
# (docs.aws.amazon.com/bedrock/latest/userguide/model-cards.html, 2026-10-11). The Claude
# 5.5 models are invoked through inference profiles only (no in-region invocation): the
# global profile works from any region; the geo ones (eu./us./au./jp.) keep the requests
# in a geography and are offered by the models lookup. Nova Canvas left the library: its
# card gives end of life 2026-09-30.
    - vendorInfo:
        vendorId: aws-bedrock
        name: AWS Bedrock
        description: Amazon Bedrock (Claude, Amazon Nova, Meta Llama, Mistral, Cohere ...) plus Amazon Polly / Transcribe
        acquireKeyUrl: https://console.aws.amazon.com/iam/home#/security_credentials
        requiresApiKey: true
        secretTypes: [AWS_CONNECTION]
        requiresCustomUrl: false
        webSite: https://aws.amazon.com/bedrock/
        apiKeySecretContext: aws-bedrock
        minContextWindow: 200000
      presets:
        - type: CHAT
          serviceHandler: chat-aws-bedrock
          doModelsLookup: true
          choices:
            # The Bedrock models lookup gives no context: each model takes its window from
            # here, its card's "Context window: 1M tokens" (docs.aws.amazon.com/bedrock/latest/
            # userguide/model-card-anthropic-claude-<model>.html, 2026-11-26), which states no
            # maximum of input tokens below it.
            # As on Anthropic: the chat models at effort medium, Haiku serving the internal
            # services without thinking (effort none, which the models library lists for
            # it, is sent as thinking disabled, BedrockClaudeThinking).
            - code: global.anthropic.claude-sonnet-5-5
              description: Anthropic Claude Sonnet 5.5 (global inference profile)
              contextWindow: 1000000
              uses: CHAT
              defaultChoice: true
              thinking: MEDIUM_THINKING
            - code: global.anthropic.claude-opus-5-5
              description: Anthropic Claude Opus 5.5 (global inference profile)
              contextWindow: 1000000
              uses: CHAT
              thinking: MEDIUM_THINKING
            - code: global.anthropic.claude-haiku-5-5
              description: Anthropic Claude Haiku 5.5 (global inference profile)
              contextWindow: 1000000
              uses: INTERNAL_SERVICES
              thinking: NO_THINKING
        - type: EMBEDDING
          serviceHandler: embedding-aws-bedrock
          doModelsLookup: true
          choices:
            # 8K tokens, in-region (its card)
            - code: amazon.titan-embed-text-v2:0
              description: Amazon Titan Text Embeddings V2
              defaultChoice: true
            # 512 tokens, 100+ languages, in-region (its card)
            - code: cohere.embed-multilingual-v3
              description: Cohere Embed Multilingual v3
        - type: RANKING
          serviceHandler: ranker-aws-bedrock
          doModelsLookup: true
          choices:
            - code: cohere.rerank-v3-5:0
              description: Cohere Rerank 3.5
              defaultChoice: true
        - type: TTS
          serviceHandler: aws-polly-tts
          doModelsLookup: false
          choices:
            - code: Joanna
              description: Amazon Polly - Joanna (en-US, neural)
              defaultChoice: true
            - code: Matthew
              description: Amazon Polly - Matthew (en-US, neural)
        - type: TRANSCRIPT
          serviceHandler: aws-transcribe
          doModelsLookup: false
          choices:
            - code: amazon-transcribe-streaming
              description: Amazon Transcribe streaming (speech to text)
              defaultChoice: true
# Google Vertex AI: a service account key (GOOGLE_CLOUD_JSON_CREDENTIALS secret, its project
# the key's, the location GOOGLE_CLOUD_LOCATION or the global endpoint) or a Google OAuth2
# grant, picked or created in the setup. Codes and lifecycle from the Vertex model versions page
# (docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions, 2026-10-11):
# Retirement dates of docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
# (2026-11-27; "they won't be moved to an earlier date than what is listed"):
# gemini-3.8-flash September 2, 2027 or later, gemini-3.5-flash-lite July 21, 2027 or later,
# gemini-4-hydrogen none announced. gemini-3.5-flash (May 19, 2027 or later) and
# gemini-3.1-flash-lite (May 7, 2027 or later) may retire within six months and are no
# longer preset; the 2.5 family retired 2026-10-20. No thinking level is preset: the Vertex
# integration sends none (GoogleVertexChatModelConfigurationSupportService).
    - vendorInfo:
        vendorId: google-vertex
        name: Google Vertex AI
        description: Google Vertex AI (Gemini models, text embeddings)
        acquireKeyUrl: https://console.cloud.google.com/iam-admin/serviceaccounts
        requiresApiKey: true
        # a service account key, or a Google OAuth2 grant naming project and location
        # (VertexAIConfigurator takes both)
        secretTypes: [GOOGLE_CLOUD_JSON_CREDENTIALS, OAUTH2_GOOGLE]
        requiresCustomUrl: false
        webSite: https://cloud.google.com/vertex-ai
        apiKeySecretContext: google-vertex
        minContextWindow: 1000000
      presets:
        - type: CHAT
          serviceHandler: chatmodel-google-vertex
          doModelsLookup: true
          choices:
            - code: gemini-3.8-flash
              description: Gemini 3.8 Flash
              uses: CHAT
              defaultChoice: true
            # "cutting-edge intelligence with speed and efficiency" (its model page)
            - code: gemini-4-hydrogen
              description: Gemini 4 Hydrogen
              uses: CHAT
            # "the latest in our cost-effective Flash-Lite line of models" (its model page)
            - code: gemini-3.5-flash-lite
              description: Gemini 3.5 Flash-Lite
              uses: INTERNAL_SERVICES
        - type: EMBEDDING
          serviceHandler: embedding-google-vertex
          doModelsLookup: true
          choices:
            # Both retire on April 1, 2027 (model-versions, 2026-11-27), within six months,
            # but they are still the only ones the embedding-google-vertex handler offers: the
            # gemini-embedding models (gemini-embedding-001, no sooner than May 20, 2028;
            # gemini-embedding-2) take one text per request, which its batched requests do
            # not respect (GoogleVertexEmbeddingModelConfigurationSupportService).
            - code: text-multilingual-embedding-002
              description: Text multilingual embedding 002
              defaultChoice: true
            - code: text-embedding-005
              description: Text embedding 005 (English and code)

    - vendorInfo:
        vendorId: deepseek
        name: Deepseek
        description: Deepseek
        acquireKeyUrl: https://platform.deepseek.com/api_keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://www.deepseek.com/
        apiKeySecretContext: deepseek
        minContextWindow: 128000
      presets:
        - type: CHAT
          serviceHandler: chat-deepseek
          doModelsLookup: true
          choices:
            # deepseek-chat and deepseek-reasoner were discontinued on 2026-07-24: thinking
            # is now a setting of the model (the thinking option), not a model of its own.
            # Thinking for chat (its default), not for the internal services: their calls
            # (ranking filter, routing, query rewriting) are short judgements, and DeepSeek
            # takes thinking disabled on this model.
            - code: deepseek-flash
              description: DeepSeek V4.1 Flash
              uses: CHAT , INTERNAL_SERVICES
              defaultChoice: true
              internalServicesThinking: NO_THINKING
            - code: deepseek-v4-pro
              description: DeepSeek V4 Pro
              uses: CHAT
    - vendorInfo:
        vendorId: xai
        name: XaI
        description: XaI (grok)
        acquireKeyUrl: https://console.x.ai/
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://xai.com/
        apiKeySecretContext: xai
        minContextWindow: 138000
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-xai
          apiKeySecretContext: chatmodel-xai
          doModelsLookup: true
          choices:
            # The grok 4 fast, 4.1 fast and 3 models were retired on 2026-05-15 (xAI
            # redirects their names to grok-4.3, but they are no longer listed, so the setup
            # could not validate them).
            # The default is xAI's own pick: "For everything else, including code, use Grok
            # 4.7. It is the most capable model we've built." (docs.x.ai/developers/models,
            # 2026-10-11). Its reasoning cannot be turned off; grok-4.3 (1M context, effort
            # none to xhigh) stays an option.
            - code: grok-4.7
              description: Grok 4.7
              contextWindow: 500000
              uses: CHAT
              defaultChoice: true
              thinking: MEDIUM_THINKING
            - code: grok-4.3
              description: Grok 4.3
              contextWindow: 1000000
              uses: CHAT
              thinking: MEDIUM_THINKING
            - code: grok-4.20-0309-reasoning
              description: Grok 4.20 reasoning
              contextWindow: 1000000
              uses: CHAT
            - code: grok-4.20-0309-non-reasoning
              description: Grok 4.20 non reasoning
              contextWindow: 1000000
              uses: INTERNAL_SERVICES
        # No embedding preset: the xAI api offers no embedding model.
    - vendorInfo:
        vendorId: nvidia
        name: NVidia
        description: NVidia cloud AI services
        acquireKeyUrl: https://build.nvidia.com/
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://build.nvidia.com/models
        apiKeySecretContext: nvidia
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-nvidia
          doModelsLookup: true
          choices:
            # From NVIDIA's live /v1/models (2026-11-26): nemotron-3-super-120b-a12b,
            # deepseek-v4.1-flash, glm-5.3 and gpt-oss-20b, preset until now, were retired
            # between 2026-08 and 2026-11 and are no longer listed. Each window from the
            # model's page on docs.api.nvidia.com/nim/reference ("Up to 1M tokens"; GLM 5.3
            # Flash "up to 1,048,576 tokens"). Nemotron 3 Ultra takes effort medium
            # (none, medium, high); GLM 5.3 Flash lists no effort and Lightning turns its
            # thinking on with chat_template_kwargs enable_thinking (its model card,
            # 2026-11-27), which the compatible handler does not send: both keep their
            # default.
            - code: nvidia/nemotron-3-ultra-550b-a55b
              description: NVIDIA Nemotron 3 Ultra 550B
              contextWindow: 1000000
              defaultChoice: true
              uses: CHAT
              thinking: MEDIUM_THINKING
            - code: z-ai/glm-5.3-flash
              description: Z.ai GLM 5.3 Flash
              contextWindow: 1048576
              uses: CHAT
            - code: nvidia/nemotron-3.5-lightning-30b-a3b
              description: NVIDIA Nemotron 3.5 Lightning 30B
              contextWindow: 1000000
              uses: INTERNAL_SERVICES
        - type: EMBEDDING
          serviceHandler: embedding-nvidia
          doModelsLookup: true
          choices:
            # Both take an input_type with every request (query or passage), which the
            # embedding handler sends from the models library's parameter rules.
            # nemotron-3-embed-1b, preset until now, is "no longer supported from 11/23/2026"
            # for nemotron-3.5-embed-1b.
            - code: nvidia/nemotron-3.5-embed-1b
              description: NVIDIA Nemotron 3.5 Embed 1B
              defaultChoice: true
            - code: nvidia/llama-3.2-nv-embedqa-1b-v1
              description: NVIDIA Llama 3.2 NV EmbedQA 1B
    - vendorInfo:
        vendorId: mistral.ai
        name: Mistral.ai
        description: Mistral AI provider (France)
        acquireKeyUrl: https://console.mistral.ai/home
        requiresApiKey: true
        requiresCustomUrl: false
        apiKeySecretContext: mistralai
        webSite: https://mistral.ai
        minContextWindow: 256000
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-mistral
          doModelsLookup: true
          choices:
            # The Magistral and Devstral models retired on 2026-07-31; reasoning is now a
            # capability of the generalist models, a switch (high or none): MEDIUM_THINKING
            # is sent as high. Mistral Medium 3.5 (mistral-medium-latest) and Large 3 retire
            # on 2027-04-30 for Large 4 (docs.mistral.ai/getting-started/models, 2026-11-27),
            # preset by the id its page gives (mistral-large-4-0).
            - code: mistral-large-4-0
              description: Mistral Large 4
              uses: CHAT
              defaultChoice: true
              thinking: MEDIUM_THINKING
            - code: mistral-small-latest
              description: Mistral Small Latest
              uses: CHAT
              thinking: MEDIUM_THINKING
            - code: ministral-8b-latest
              description: Ministral 8b
              uses: INTERNAL_SERVICES

        - type: EMBEDDING
          serviceHandler: embedding-mistral
          doModelsLookup: true
          choices:
            - code: mistral-embed
              description: mistral-embed
              defaultChoice: true
            - code: codestral-embed
              description: codestral-embed code extraction embedding model

    - vendorInfo:
        vendorId: groq
        name: Groq
        description: Groq AI provider
        acquireKeyUrl: https://console.groq.com/keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://groq.com/
        apiKeySecretContext: groq
        minContextWindow: 131072
      presets:
        # No EMBEDDING preset: groq does not document an embeddings endpoint and its
        # models list carries no embedding model, so the type can only ever offer an
        # empty choice list. The embedding-groq handler was removed with it.
        - type: CHAT
          serviceHandler: chatmodel-groq
          doModelsLookup: true
          # No context window is preset on groq: its models list gives each model's
          # context_window (console.groq.com/docs/api-reference), which the lookup puts on
          # the chosen model.
          choices:
            # Groq shut down llama-3.3-70b-versatile and llama-3.1-8b-instant on 2026-08-16,
            # naming gpt-oss-120b and gpt-oss-20b as their replacements, and groq/compound on
            # 2026-09-21 (console.groq.com/docs/deprecations); its models page still lists
            # the two llama models, for the enterprise tier only.
            # The default is not gpt-oss-120b, which has reported tool call failures:
            # qwen3.8-27b calls tools, in parallel too (console.groq.com/docs/tool-use,
            # 2026-10). Groq lists it as a preview model; the setup checks it against the
            # live models list.
            - code: qwen/qwen3.8-27b
              description: Qwen 3.8 27b
              uses: CHAT
              defaultChoice: true
              thinking: MEDIUM_THINKING
            # Kept as an option but not the default: unreliable at tool calls.
            - code: openai/gpt-oss-120b
              description: OpenAI Gpt OSS 120b
              uses: CHAT
              thinking: MEDIUM_THINKING
            # gpt-oss cannot stop reasoning: LOW_THINKING is sent as reasoning_effort "low",
            # one of the low, medium and high Groq accepts for it, so an internal call does
            # not spend its output on reasoning (as regolo.ai's gpt-oss-20b did).
            - code: openai/gpt-oss-20b
              description: OpenAI Gpt OSS 20b
              uses: INTERNAL_SERVICES
              thinking: LOW_THINKING
        # doModelsLookup=false: the transcript handler has no models list for groq, so
        # its lookup would answer with the OpenAI whisper-1 suggestion and every code
        # below would be rejected as unavailable. The preset codes are trusted instead.
        - type: TRANSCRIPT
          serviceHandler: transcript-groq
          doModelsLookup: false
          choices:
            - code: whisper-large-v3-turbo
              description: Whisper Large v3 Turbo (fast speech to text)
              defaultChoice: true
            - code: whisper-large-v3
              description: Whisper Large v3 (speech to text)
    - vendorInfo:
        vendorId: openrouter.ai
        name: OpenRouter.ai
        description: OpenRouter.ai AI provider
        acquireKeyUrl: https://openrouter.ai/workspaces/default/keys
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://openrouter.ai
        apiKeySecretContext: openrouter.ai
        supportsAutoconfig: true
      presets:
        - type: CHAT
          serviceHandler: chatmodel-openrouter.ai
          doModelsLookup: true
          choices:
            # The default is the cheapest model here that stays reliable once tools are
            # in play, which is what a chat pipeline spends most of its calls on: glm
            # 5.3 flash is among the cheapest (its price comes from openrouter.ai's models
            # api) and scores above the other flash-class models on the agentic benchmarks.
            # Its reasoning is mandatory there, efforts max, high and low. No context window is
            # preset on openrouter.ai: its models list gives each model's context_length,
            # which the lookup puts on the chosen model.
            - code: z-ai/glm-5.3-flash
              description: Z.ai GLM 5.3 Flash
              uses: CHAT
              defaultChoice: true
              thinking: MEDIUM_THINKING
            # Kept as an option but no longer the default: gpt-oss-120b is unreliable at
            # function calling, which a chat that dispatches tools depends on.
            - code: openai/gpt-oss-120b
              description: OpenAI Gpt OSS 120b
              uses: CHAT
              thinking: MEDIUM_THINKING
            # DeepSeek retired V4 Flash ("The previous-generation models V4 Flash and V4
            # Flash Vision Exp have been retired", api-docs.deepseek.com/updates, 2026-09-10);
            # V4.1 Flash.
            - code: deepseek/deepseek-v4.1-flash
              description: DeepSeek V4.1 Flash
              uses: CHAT
              thinking: MEDIUM_THINKING
            # LOW_THINKING is sent as reasoning_effort "low", which openrouter.ai documents
            # among its request parameters: the same choice as regolo.ai's gpt-oss-20b.
            - code: openai/gpt-oss-20b
              description: OpenAI Gpt OSS 20b
              uses: INTERNAL_SERVICES
              thinking: LOW_THINKING
        - type: EMBEDDING
          serviceHandler: embedding-openrouter.ai
          choices:
            - code: qwen/qwen3-embedding-8b
              description: Qwen3 Embedding 8b
              defaultChoice: true
          doModelsLookup: true
        - type: RANKING
          serviceHandler: ranker-openrouter.ai
          doModelsLookup: true
          choices:
            - code: cohere/rerank-4-pro
              description: Chohere Rerank 4 pro
              defaultChoice: true
        # Image generation was the one model type openrouter.ai had a handler for -
        # images-openrouter.ai, which resolves its choices by the image output modality -
        # without anything offering it in the setup.
        #
        # The default is picked on the same grounds as the chat one: the cheapest model
        # that is still a full text-to-image generator, not the most capable one. Image
        # output is billed per output token, and the openai gpt-image-2.5 tier that used
        # to be the default sits at 0.00003 - the top band - while qwen-image-3 is at
        # 0.0000072, so a default nobody changed cost four times what it had to.
        #
        # Every code here outputs image ONLY (text+image->image). The gemini and gpt-5
        # families answer text+image, so the reply carries prose alongside the picture
        # and the image response handler has to fish it out; they are deliberately not
        # offered, and google/gemini-3-pro-image was dropped from this list for that
        # reason as much as for its price.
        - type: IMAGESGEN
          serviceHandler: images-openrouter.ai
          doModelsLookup: true
          choices:
            - code: qwen/qwen-image-3
              description: Qwen Image 3 (text to image generation)
              defaultChoice: true
            - code: black-forest-labs/flux.2-pro
              description: Black Forest Labs FLUX.2 Pro
            # openai/gpt-image-1-mini left: OpenAI shuts it down on 2026-12-01.
            - code: openai/gpt-image-2.6-flare
              description: OpenAI GPT Image 2.6 Flare (fast image generation)
            - code: openai/gpt-image-2.5-flare
              description: OpenAI GPT Image 2.5 Flare (fast image generation)
            - code: openai/gpt-image-2.5-sunburst
              description: OpenAI GPT Image 2.5 Sunburst (highest quality, highest cost)
        - type: TRANSCRIPT
          serviceHandler: transcript-openrouter.ai
          doModelsLookup: true
          choices:
            # whisper-1 shuts down on 2027-02-26 (OpenAI deprecations, 2026-11-27);
            # gpt-transcribe is served at openrouter.ai/api/v1/audio/transcriptions.
            - code: openai/gpt-transcribe
              description: OpenAI GPT Transcribe (speech to text)
              defaultChoice: true
        - type: TTS
          serviceHandler: tts-openrouter.ai
          doModelsLookup: true
          choices:
            # The widest voice coverage here belongs to gemini 3.1 flash tts, which is also
            # the most used model of this type on openrouter.ai - 70+ languages against the
            # 15 of the microsoft voice and the 8 of kokoro - but it cannot be the default
            # while the generic text to speech handler asks every provider for mp3:
            # tested against a live key it answers
            #   400 Gemini TTS only supports response_format="pcm". Got "mp3".
            # and the call fails. The handler now asks it for pcm (the models library's
            # parameter rules) and wraps the samples in a WAV header; the default stays the
            # widest-reaching voice verified end to end in mp3 on this installation.
            - code: minimax/speech-2.8-hd
              description: MiniMax Speech 2.8 HD (multilanguage)
              defaultChoice: true
            - code: minimax/speech-2.8-turbo
              description: MiniMax Speech 2.8 Turbo (multilanguage)
            - code: microsoft/mai-voice-2
              description: Microsoft MAI Voice 2 (15 languages)
            - code: google/gemini-3.1-flash-tts-preview
              description: Google Gemini 3.1 Flash TTS (70+ languages)
            - code: deepgram/aura-2
              description: Deepgram Aura 2
            - code: hexgrad/kokoro-82m
              description: Kokoro 82M (8 languages)

    # llmax.ai - llmax.ai/models (2026-10-11): llmax-all-round (Essential plan, 262144
    # context), llmax-smart (Smart plan) and llmax-best (Pro plan, 1M), each "tool calling,
    # vision, reasoning" supported; a key reaches the models of its plan only, so the
    # preset is the Essential one and the lookup offers what the key reaches. No
    # embeddings.
    - vendorInfo:
        vendorId: llmax
        name: llmax.ai
        description: llmax.ai AI provider (EU, subscription)
        acquireKeyUrl: https://llmax.ai/docs/quickstart
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://llmax.ai
        apiKeySecretContext: llmax
      presets:
        - type: CHAT
          serviceHandler: chatmodel-llmax
          doModelsLookup: true
          choices:
            - code: llmax-all-round
              description: llmax all round (Essential plan)
              contextWindow: 262144
              uses: CHAT , INTERNAL_SERVICES
              defaultChoice: true
            - code: llmax-smart
              description: llmax smart (Smart plan)
              uses: CHAT
            - code: llmax-best
              description: llmax best (Pro plan)
              contextWindow: 1000000
              uses: CHAT

    # Profundo AI - profundoai.com/models (2026-10-11): "Every plan includes all models";
    # tool use is stated for glm-5.3 and glm-5.2 (128K), glm-5.3-flash is the fast tier.
    # profundoai.com/docs: tools, parallel tool calls, response_format and reasoning_effort
    # are accepted "where the model allows"; no embeddings.
    - vendorInfo:
        vendorId: profundoai
        name: Profundo AI
        description: Profundo AI provider (subscription)
        acquireKeyUrl: https://profundoai.com/docs
        requiresApiKey: true
        requiresCustomUrl: false
        webSite: https://profundoai.com
        apiKeySecretContext: profundoai
      presets:
        - type: CHAT
          serviceHandler: chatmodel-profundoai
          doModelsLookup: true
          choices:
            - code: glm-5.3
              description: Z.ai GLM 5.3
              contextWindow: 128000
              uses: CHAT
              defaultChoice: true
            - code: glm-5.2
              description: Z.ai GLM 5.2
              contextWindow: 128000
              uses: CHAT
            - code: glm-5.3-flash
              description: Z.ai GLM 5.3 Flash
              contextWindow: 128000
              uses: INTERNAL_SERVICES

    # ONNX transformers - the embedding model that runs inside Gebo itself (Spring AI's
    # default ONNX model, docs.spring.io/spring-ai/reference/api/embeddings/onnx.html):
    # no key, no server, so a setup without any provider for embeddings still has one.
    - vendorInfo:
        vendorId: onnx-transformers
        name: ONNX local embeddings
        description: Local embedding model running inside Gebo (no provider needed)
        requiresApiKey: false
        requiresCustomUrl: false
        webSite: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
        apiKeySecretContext: onnx-transformers
      presets:
        - type: EMBEDDING
          serviceHandler: embedding-onnx-transformers
          doModelsLookup: true
          choices:
            - code: sentence-transformers/all-MiniLM-L6-v2
              description: all-MiniLM-L6-v2 (local, 384 dimensions)
              defaultChoice: true

    - vendorInfo:
        vendorId: ollama
        name: Ollama
        description: Ollama, large language model server that runs on your infrastructure
        requiresApiKey: false
        requiresCustomUrl: true
        defaultCustomUrl: http://localhost:11434
        webSite: https://ollama.com/
        apiKeySecretContext: ollama
      presets:
        - type: CHAT
          serviceHandler: chat-ollama
          doModelsLookup: true

        - type: EMBEDDING
          serviceHandler: embedding-ollama
          doModelsLookup: true

        # Optional: a decision model judging the retrieved fragments (System One
        # endpoint, Ollama 0.40.4 or later); the lookup lists the pulled models whose
        # capabilities include "decision"
        - type: DECISION
          serviceHandler: decision-ollama
          doModelsLookup: true
          choices:
            - code: d1-omni:600m
              description: d1-omni 600m (decision model, Liquid AI)
              defaultChoice: true
            - code: d1-omni:2b
              description: d1-omni 2b (decision model, Liquid AI)

    - vendorInfo:
        vendorId: vllm
        name: vLLM on premise infrastructure
        description: vLLM on premise infrastructure
        requiresApiKey: false
        requiresCustomUrl: true
        webSite: https://docs.vllm.ai/en/latest/
        defaultCustomUrl: http://localhost:8000/
        apiKeySecretContext: vllm
      presets:
        - type: CHAT
          serviceHandler: chatmodel-vllm
          doModelsLookup: true

        - type: EMBEDDING
          serviceHandler: embedding-vllm
          doModelsLookup: true
        - type: RANKING
          serviceHandler: ranker-vllm
          doModelsLookup: true

    - vendorInfo:
        vendorId: generic-openai
        name: OpenAI compliant API provider
        description: Generic OpenAI compliant API provider
        requiresApiKey: false
        requiresCustomUrl: true
        defaultCustomUrl:
        webSite:
        apiKeySecretContext: generic-openai
      presets:
        - type: CHAT
          serviceHandler: chatmodel-generic-openai
          doModelsLookup: true
        - type: EMBEDDING
          serviceHandler: embedding-generic-openai
          doModelsLookup: true
        - type: RANKING
          serviceHandler: ranker-generic-openai
          doModelsLookup: true
