# The mistralai segment of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules). The abstraction layer
# collects every provider library bean; this one binds ai.gebo.models.providers.mistralai.
# A rule applies to its providerId only.
# Rules: the first one covering a model applies, so specific models come before family
# patterns ("*" stands for any characters); unset fields are unknown.
ai.gebo.models.providers.mistralai:
  # The current models of docs.mistral.ai/getting-started/models (2026-11-26), every api
  # id of each: their context from the model cards ("Context | 256K", the data behind it
  # 256000); the output limit is stated for the third party models only. The lookup reads
  # max_context_length live, these stand in when it leaves it out. Medium 3.5 and Large 3
  # were deprecated on 2026-10-31 for Large 4; the models past their retirement are left
  # out ("requests to its identifiers fail with a 404 error").
  modelsInfo:
    - providerId: mistralai
      modelId: mistral-large-4
      chatModel: true
      embeddingModel: false
      contextLength: 1000000
      description: Mistral Large 4
      informativeUrl: https://docs.mistral.ai/models/mistral-large-4-0
    - providerId: mistralai
      modelId: mistral-large-4-0
      chatModel: true
