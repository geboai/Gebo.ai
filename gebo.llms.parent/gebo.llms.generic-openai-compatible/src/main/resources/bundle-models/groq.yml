# The groq segment of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules). The abstraction layer
# collects every provider library bean; this one binds ai.gebo.models.providers.groq.
# A rule applies to its providerId only.
# Rules: the first one covering a model applies, so specific models come before family
# patterns ("*" stands for any characters); unset fields are unknown.
ai.gebo.models.providers.groq:
  # The models of console.groq.com/docs/models with their limits ("CONTEXT WINDOW (TOKENS)"
  # and "MAX COMPLETION TOKENS", read 2026-11-26): the models api gives the context window
  # too, these stand in when it leaves it out. No page states a maximum of input tokens
  # below the window, so contextLength is the window. llama-3.1-8b-instant and
  # llama-3.3-70b-versatile were shut down on 2026-08-16 for the free and developer tiers;
  # enterprise contracts keep them. Their input modalities come from the rules below.
  # inputModalities: "INPUT Text OUTPUT Text" on each model page (console.groq.com/docs/model/<id>, 2026-11-27).
  modelsInfo:
    - providerId: groq
      modelId: llama-3.1-8b-instant
      inputModalities: [TEXT]
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 131072
      description: Llama 3.1 8B Instant
      informativeUrl: https://console.groq.com/docs/model/llama-3.1-8b-instant
    - providerId: groq
      modelId: llama-3.3-70b-versatile
      inputModalities: [TEXT]
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 32768
      description: Llama 3.3 70B Versatile
      informativeUrl: https://console.groq.com/docs/model/llama-3.3-70b-versatile
    - providerId: groq
      modelId: openai/gpt-oss-120b
      inputModalities: [TEXT]
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 65536
      description: GPT-OSS 120B
      informativeUrl: https://console.groq.com/docs/model/openai/gpt-oss-120b
    - providerId: groq
      modelId: openai/gpt-oss-20b
      inputModalities: [TEXT]
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 65536
      description: GPT-OSS 20B
      informativeUrl: https://console.groq.com/docs/model/openai/gpt-oss-20b
    - providerId: groq
      modelId: openai/gpt-oss-safeguard-20b
      inputModalities: [TEXT]
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 65536
      description: GPT-OSS Safeguard 20B
      informativeUrl: https://console.groq.com/docs/model/openai/gpt-oss-safeguard-20b
    - providerId: groq
      modelId: meta-models/muse-spark-open
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 131072
      description: Muse Spark Open
      informativeUrl: https://console.groq.com/docs/model/meta-models/muse-spark-open
    - providerId: groq
      modelId: minimaxai/minimax-m2.7
      inputModalities: [TEXT]
      chatModel: true
      embeddingModel: false
      contextLength: 196608
      maxOutputToken: 131072
      description: MiniMax M2.7
      informativeUrl: https://console.groq.com/docs/model/minimaxai/minimax-m2.7
    - providerId: groq
      modelId: qwen/qwen3.8-27b
      chatModel: true
      embeddingModel: false
      contextLength: 131072
      maxOutputToken: 16384
      description: Qwen3.8 27B
      informativeUrl: https://console.groq.com/docs/model/qwen/qwen3.8-27b
  parameterRules:
    # Groq - console.groq.com/docs/reasoning, 2026-10-11: temperature 0.0 to 2.0 on its
    # reasoning models.
    - providerId: groq
      models: ["openai/gpt-oss-*"]
      sampling: ACCEPTED
      reasoningEfforts: [low, medium, high]
      source: console.groq.com/docs/reasoning, 2026-10-11
    - providerId: groq
      models: ["qwen/qwen3.8-27b"]
      sampling: ACCEPTED
      reasoningEfforts: [none, default, low, medium, high]
      # console.groq.com/docs/vision, 2026-11-19: "processes both text and image inputs".
      inputModalities: [TEXT, IMAGE]
      source: console.groq.com/docs/reasoning, 2026-10-11; console.groq.com/docs/vision, 2026-11-19
    # Groq's models api tells nothing of the inputs: the models of its vision page
    # (console.groq.com/docs/vision, 2026-11-19) are declared here. This rule states the
    # input modalities only.
    - providerId: groq
      models: ["meta-models/muse-spark-open"]
      inputModalities: [TEXT, IMAGE]
      source: console.groq.com/docs/model/meta-models/muse-spark-open (input "Text, images"), 2026-11-19
