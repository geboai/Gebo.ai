# The cheapestinference piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# CheapestInferenceModelsLibrary under ai.gebo.models.providers.cheapestinference.
# No entry yet: nothing is known of its models yet beyond what the models lookup returns.
# An entry goes under the key below, for example:
#
# ai.gebo.models.providers.cheapestinference:
#   parameterRules:
#     - providerId: cheapestinference
#       models: ["some-model-*"]
#       sampling: REJECTED
#       reasoningEfforts: [none, low, high]
#       source: the provider page the rule was read on, and when
