# The regolo.ai piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# RegoloModelsLibrary under ai.gebo.models.providers.regolo.
# model_info gives each model's context, prices and capability flags; its
# supported_openai_params is the same 33 parameters for every model (checked 2026-10).
# The lookup takes max_input_tokens as the context: the entries below, from the models
# list of regolo.ai/models (2026-11-26: max_input_tokens, max_output_tokens), stand in when
# it leaves it out. They are the serving limits, below some models' native window
# (gpt-oss-120b: 30,000 of "~131k").
ai.gebo.models.providers.regolo:
  modelsInfo:
