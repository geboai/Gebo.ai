# The nvidia segment of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules). The abstraction layer
# collects every provider library bean; this one binds ai.gebo.models.providers.nvidia.
# A rule applies to its providerId only.
# Rules: the first one covering a model applies, so specific models come before family
# patterns ("*" stands for any characters); unset fields are unknown.
ai.gebo.models.providers.nvidia:
  # Only models integrate.api.nvidia.com/v1/models still lists (checked 2026-11-26, 30
  # models; its entries carry id, object, created and owned_by only, so these are where the
  # context comes from). Their limits from docs.api.nvidia.com/nim/reference/<model> (the
  # context, "Up to 1M tokens" taken as a million) and its -infer page (the most max_tokens
  # the hosted api takes). nemotron-3-super-120b-a12b, deepseek-v4.1-flash, glm-5.3,
  # gpt-oss-20b, gpt-oss-120b and nemotron-3-embed-1b were retired between 2026-08 and
  # 2026-11 and left the list, as yi-large, fuyu-8b and jamba-1.5-large-instruct had;
  # starcoder2-15b, retired on 2025-07-24, is still listed and its limits are not stated.
  modelsInfo:
    - providerId: nvidia
      modelId: nvidia/nemotron-3-ultra-550b-a55b
      chatModel: true
      embeddingModel: false
      contextLength: 1000000
      maxOutputToken: 32768
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-ultra-550b-a55b
    - providerId: nvidia
      modelId: nvidia/nemotron-3.5-lightning-30b-a3b
      chatModel: true
      embeddingModel: false
      contextLength: 1000000
      maxOutputToken: 32768
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-5-lightning-30b-a3b
    - providerId: nvidia
      modelId: nvidia/nemotron-3.5-super-vl-120b-a12b
      chatModel: true
      embeddingModel: false
      contextLength: 1000000
      maxOutputToken: 131072
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3_5-super-vl-120b-a12b
    - providerId: nvidia
      modelId: nvidia/nemotron-3.5-bolt-e4b
      chatModel: true
      embeddingModel: false
      contextLength: 64000
      maxOutputToken: 65536
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3_5-bolt-e4b
    - providerId: nvidia
      modelId: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      chatModel: true
      embeddingModel: false
      contextLength: 256000
      maxOutputToken: 65536
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-nano-omni-30b-a3b-reasoning
    - providerId: nvidia
      modelId: z-ai/glm-5.3-flash
      chatModel: true
      embeddingModel: false
      contextLength: 1048576
      informativeUrl: https://docs.api.nvidia.com/nim/reference/z-ai-glm-5-3-flash
    - providerId: nvidia
      modelId: bigcode/starcoder2-15b
      deprecated: true
      retirementDate: "2025-07-24"
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.api.nvidia.com/nim/reference/bigcode-starcoder2-15b
    # Embeddings: the most input tokens of a text the hosted api takes ("Max length is
    # 10240 tokens"; the embedqa model, retired on its page, is still listed).
    - providerId: nvidia
      modelId: nvidia/nemotron-3.5-embed-1b
      chatModel: false
      embeddingModel: true
      contextLength: 10240
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3_5-embed-1b
    - providerId: nvidia
      modelId: nvidia/llama-3.2-nv-embedqa-1b-v1
      chatModel: false
      embeddingModel: true
      contextLength: 512
      informativeUrl: https://docs.api.nvidia.com/nim/reference/nvidia-llama-3_2-nv-embedqa-1b-v1
  parameterRules:
    # NVIDIA - reasoning_effort "none" disables the reasoning, "high" is the default.
    - providerId: nvidia
      models: ["nvidia/nemotron-3-super-120b-a12b"]
      sampling: ACCEPTED
      reasoningEfforts: [none, low, high]
      source: docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-super-120b-a12b-infer, 2026-10-11
    # Nemotron 3 Ultra - "`none` disables reasoning tokens, `medium` enables efficient
    # reasoning, and `high` enables full reasoning", high by default.
    - providerId: nvidia
      models: ["nvidia/nemotron-3-ultra-550b-a55b"]
      reasoningEfforts: [none, medium, high]
      source: docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-ultra-550b-a55b-infer, 2026-11-26
    # NVIDIA embedding - the asymmetric retrieval models need an input_type with every
    # request: "passage" when indexing, "query" when querying (they "operate in passage or
    # query mode").
    - providerId: nvidia
      models: ["nvidia/nemotron-3.5-embed-1b", "nvidia/nemotron-3-embed-1b", "nvidia/llama-3.2-nv-embedqa-1b-v1"]
      queryInputType: query
      documentInputType: passage
      source: docs.api.nvidia.com/nim/reference nemotron-3-embed-1b and llama-3_2-nv-embedqa-1b-v1, 2026-10-11; nemotron-3_5-embed-1b-infer ("requires the `input_type` parameter"), 2026-11-26
