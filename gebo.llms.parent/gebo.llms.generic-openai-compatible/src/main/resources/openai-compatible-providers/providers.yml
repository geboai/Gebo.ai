ai.gebo.llms.generic.config:
  chatModelProviders:
    - code: chatmodel-nvidia
      providerId: nvidia
      description: NVidia Cloud chat model
      baseUrl: https://integrate.api.nvidia.com

    - code: chatmodel-groq
      providerId: groq
      description: Groq chat model
      baseUrl: https://api.groq.com/openai

    - code: chatmodel-regolo.ai
      providerId: regolo.ai
      description: Regolo.ai chat models
      baseUrl: https://api.regolo.ai/
      modelsListProvider: regolo-ai-models-list

    - code: chatmodel-openrouter.ai
      providerId: openrouter.ai
      description: OpenRouter.ai chat models
      # The chat client appends the sole endpoint name to this url, so it has to carry
      # the api version: openrouter.ai answers the unversioned path with a 404. The
      # ranker url instead stays unversioned, that client appending /v1/rerank itself.
      baseUrl: https://openrouter.ai/api/v1/
      modelsListProvider: openrouter-ai-models-list

    - code: chatmodel-xai
      providerId: xai
      description: X.ai (Grok) chat model
      baseUrl: https://api.x.ai/
      modelsListProvider: XaiModelsList

    - code: chatmodel-generic-openai
      providerId: generic-openai
      description: Generic OpenAI compatible chat model
      baseUrl:
    - code: chatmodel-vllm
      providerId: vllm
      description: VLLM hosted chat model
      applyThinkingMarkupHandling: true
      baseUrl:

    # The providers below are chat/reasoning-only OpenAI-compatible gateways added as
    # bare model types (no fast-setup preset in gebo.llms.setup). Each exposes a plain
    # GET /v1/models, so the generic lookup (no modelsListProvider) already populates the
    # model dropdown - none needs a custom IGModelsListProvider. That endpoint returns
    # only model ids though (no context_length), so the context window stays a per-model
    # value the admin sets on the config through the CRUD controller.
    # Some of these chat models also accept image input (vision); that is a chat
    # capability, not a separate image-generation modality, so no imageModelProviders
    # row is added. None documents embeddings, TTS, STT or image generation.
    # The baseUrl is the UNVERSIONED host on purpose: the chat client appends
    # /v1/chat/completions and the models reader appends v1/models, so a /v1 suffix here
    # would produce /v1/v1/... (same convention as nvidia, x.ai and regolo above).
    - code: chatmodel-subconscious
      providerId: subconscious
      description: Subconscious.dev chat model (US, flat subscription)
      baseUrl: https://api.subconscious.dev

    - code: chatmodel-awanllm
      providerId: awanllm
      description: Awan LLM chat model (flat subscription)
      baseUrl: https://api.awanllm.com

    - code: chatmodel-llmax
      providerId: llmax
      description: llmax.ai chat model (EU, flat subscription)
      # /v1/models lists the stable aliases - llmax-all-round / llmax-smart / llmax-best.
      baseUrl: https://run.llmax.ai

    - code: chatmodel-cheapestinference
      providerId: cheapestinference
      description: CheapestInference chat model (US, flat subscription)
      baseUrl: https://api.cheapestinference.com

    - code: chatmodel-profundoai
      providerId: profundoai
      description: Profundo AI chat model (flat subscription)
      baseUrl: https://api.profundoai.com
  embeddingModelProviders:
    #  Nvidia seems do not give embedding services
    - code: embedding-nvidia
      providerId: nvidia
      description: NVidia Cloud embedding model
      baseUrl: https://integrate.api.nvidia.com

    - code: embedding-regolo.ai
      providerId: regolo.ai
      description: Regolo.ai embedding model
      baseUrl: https://api.regolo.ai/
      modelsListProvider: regolo-ai-models-list

    - code: embedding-openrouter.ai
      providerId: openrouter.ai
      description: OpenRouter.ai embedding models
      # The embedding client appends the sole endpoint name to this url, so it has to
      # carry the api version: openrouter.ai answers the unversioned path with an html
      # error page, which the client cannot read as json.
      baseUrl: https://openrouter.ai/api/v1/
      modelsListProvider: openrouter-ai-models-list

    # Groq has no embedding provider on purpose: embeddings are not part of its
    # documented api surface and its models list carries no embedding model, so the
    # handler could only ever offer an empty list.

    - code: embedding-xai
      providerId: xai
      description: X.ai (Grok) embedding model
      baseUrl: https://api.x.ai/
      modelsListProvider: XaiModelsList

    - code: embedding-generic-openai
      providerId: generic-openai
      description: Generic OpenAI compatible embedding model
      baseUrl:
    - code: embedding-vllm
      providerId: vllm
      description: VLLM hosted embedding model
      baseUrl:

  imageModelProviders:
    - code: images-regolo.ai
      providerId: regolo.ai
      description: Regolo.ai image generation model
      baseUrl: https://api.regolo.ai/
      modelsListProvider: regolo-ai-models-list

    - code: images-openrouter.ai
      providerId: openrouter.ai
      description: OpenRouter.ai image generation models
      # Versioned for the same reason as the chat url: the client appends
      # images/generations.
      baseUrl: https://openrouter.ai/api/v1/
      modelsListProvider: openrouter-ai-models-list


  textToSpeechModelProviders:
    - code: tts-regolo.ai
      providerId: regolo.ai
      description: Regolo.ai text to speech model
      baseUrl: https://api.regolo.ai/
      modelsListProvider: regolo-ai-models-list

    - code: tts-openrouter.ai
      providerId: openrouter.ai
      description: OpenRouter.ai text to speech models
      # Versioned for the same reason as the chat url: the client appends audio/speech.
      baseUrl: https://openrouter.ai/api/v1/
      modelsListProvider: openrouter-ai-models-list


  transcriptModelProviders:
    - code: transcript-regolo.ai
      providerId: regolo.ai
      description: Regolo.ai transcript model
      baseUrl: https://api.regolo.ai/
      modelsListProvider: regolo-ai-models-list

    - code: transcript-openrouter.ai
      providerId: openrouter.ai
      description: OpenRouter.ai transcript models
      # Versioned for the same reason as the chat url: the client appends
      # audio/transcriptions.
      baseUrl: https://openrouter.ai/api/v1/
      modelsListProvider: openrouter-ai-models-list

    - code: transcript-groq
      providerId: groq
      description: Groq transcript model
      # Versioned, unlike the groq chat url above: the chat client appends
      # v1/chat/completions itself, while the transcription one appends only
      # audio/transcriptions - and groq answers the unversioned path with a 404.
      # No modelsListProvider: only the chat client reads groq's models endpoint, so the
      # transcript choices come from the setup library preset, which declares
      # doModelsLookup=false for that reason.
      baseUrl: https://api.groq.com/openai/v1/

  rankerModelProviders:
    - code: ranker-regolo.ai
      providerId: regolo.ai
      description: Regolo.ai ranker model
      baseUrl: https://api.regolo.ai/
      modelsListProvider: regolo-ai-models-list

    - code: ranker-openrouter.ai
      providerId: openrouter.ai
      description: OpenRouter.ai ranker models
      baseUrl: https://openrouter.ai/api/
      modelsListProvider: openrouter-ai-models-list


    - code: ranker-vllm
      providerId: vllm
      description: VLLM hosted ranker model
      baseUrl:
    - code: ranker-generic-openai
      providerId: generic-openai
      description: Standard ranking API ranking model
      baseUrl:
