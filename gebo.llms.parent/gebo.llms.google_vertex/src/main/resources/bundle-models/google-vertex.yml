# The google-vertex piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# GoogleVertexModelsLibrary under ai.gebo.models.providers.google-vertex.
# The Vertex models api gives the limits and the thinking support; it tells nothing of
# the lifecycle, so the retirement dates come from
# docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions (2026-10-11).
# Only the chat models with an announced date are listed; "or later" dates are not.
# The chat models are listed with what they accept as input (inputModalities) too, from
# their Gemini API model pages (ai.google.dev/gemini-api/docs/models, 2026-11-18): the
# Vertex models api does not tell it. gemini-3.6-flash and gemini-3.7-flash from their
# Vertex model pages (docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-6-flash
# and 3-7-flash, 2026-11-19), which name image, audio and video input; documents were
# not read there and are not declared.
# contextLength and maxOutputToken from the Vertex model pages (docs.cloud.google.com/
# gemini-enterprise-agent-platform/models/gemini/<model>, 2026-11-26: "Context window
# 1,048,576", "Maximum output tokens 65,536"); no Gemini chat page states a maximum of
# input tokens below the window. The Vertex models api gives the input limit too: these
# stand in when it leaves it out. 3.6 Flash and 3.7 Flash retire on 2027-01-28 for Gemini
# 4 Hydrogen; the gemini-2.5 models went past their 2026-10-20 retirement.
ai.gebo.models.providers.google-vertex:
  parameterRules:
    # docs.cloud.google.com/vertex-ai/generative-ai/docs/start/get-started-with-gemini-3
    # (2026-10-11): "For Gemini 3, it is strongly recommended to keep the temperature
    # parameter at its default value of 1.0"; lower values "may lead to unexpected
    # behavior" (looping, degraded reasoning). A model with no temperature set is left at
    # it instead of Gebo's 0; a temperature set on the model is still sent.
    # The Vertex inference reference (2026-11-27): "For Gemini 3.6 Flash and later, custom
    # values for sampling parameters (temperature, topP, and topK) aren't supported and
    # are ignored if set": not sent, before the Gemini 3 rule below.
    - providerId: google-vertex
      models: ["gemini-3.6*", "gemini-3.7*", "gemini-3.8*", "gemini-3.9*", "gemini-4*"]
      sampling: IGNORED
      source: docs.cloud.google.com/vertex-ai/generative-ai/docs/model-reference/inference, 2026-11-27
    - providerId: google-vertex
      models: ["gemini-3*"]
      sampling: PROVIDER_DEFAULT
      source: docs.cloud.google.com/vertex-ai/generative-ai/docs/start/get-started-with-gemini-3, 2026-10-11
    # The ranges of the same reference: "Range for Gemini 3 models (3.5 Flash and
    # earlier): 0.0 - 2.0 (default: 1.0)" for the temperature, "Range: 0.0 - 1.0" for
    # topP. The page gives none for Gemini 2.5.
    - providerId: google-vertex
      models: ["gemini-3-*", "gemini-3.1*", "gemini-3.5*"]
      temperatureRange: {min: 0, max: 2}
      topPRange: {min: 0, max: 1}
      source: docs.cloud.google.com/vertex-ai/generative-ai/docs/model-reference/inference, 2026-11-27
  # inputModalities: the model pages' Modalities row "Text Input and output Image Input only Audio Input only Video
  # Input only", PDF among the text MIME types (gemini-enterprise-agent-platform/models/gemini/<id>,
  # 2026-11-27); the preview models and Gemini 4 Neon have no page there and stay unknown.
  modelsInfo:
    - providerId: google-vertex
      modelId: gemini-2.5-pro
      contextLength: 1048576
      maxOutputToken: 65536
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2026-10-20"
      replacementModel: gemini-3.8-flash
      informativeUrl: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    - providerId: google-vertex
      modelId: gemini-2.5-flash
      contextLength: 1048576
      maxOutputToken: 65536
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2026-10-20"
      replacementModel: gemini-3.8-flash
      informativeUrl: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    - providerId: google-vertex
      modelId: gemini-2.5-flash-lite
      contextLength: 1048576
      maxOutputToken: 65536
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2026-10-20"
      replacementModel: gemini-3.1-flash-lite
      informativeUrl: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    - providerId: google-vertex
      modelId: gemini-3.6-flash
      contextLength: 1048576
      maxOutputToken: 65536
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO]
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2027-01-28"
      replacementModel: gemini-4-hydrogen
      informativeUrl: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    - providerId: google-vertex
      modelId: gemini-3.7-flash
      contextLength: 1048576
      maxOutputToken: 65536
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO]
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2027-01-28"
      replacementModel: gemini-4-hydrogen
      informativeUrl: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    - providerId: google-vertex
      modelId: gemini-3.8-flash
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      informativeUrl: https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash
    - providerId: google-vertex
      modelId: gemini-3.5-flash
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      informativeUrl: https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash
    - providerId: google-vertex
      modelId: gemini-3.1-flash-lite
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      informativeUrl: https://ai.google.dev/gemini-api/docs/models/gemini-3.1-flash-lite
    # The chat models the library did not know, from their Vertex model pages
    # (2026-11-26); their input modalities were not read and are not declared.
    - providerId: google-vertex
      modelId: gemini-3.5-flash-lite
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-5-flash-lite
    - providerId: google-vertex
      modelId: gemini-3.8-flash-cyber
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-8-flash-cyber
    - providerId: google-vertex
      modelId: gemini-3.1-pro-preview
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-1-pro
    - providerId: google-vertex
      modelId: gemini-3.1-pro-preview-customtools
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-1-pro
    - providerId: google-vertex
      modelId: gemini-3-flash-preview
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-flash
    # Gemini 4: "a unified 1,048,576-token limit that includes both input and output
    # tokens"; a segment generates up to 65,536 output tokens streaming (32,768 not
    # streaming), long decodes up to 1,048,576 less the input. 4 Carbon and 4 Neon are
    # for "Verified enterprise customers in select regions".
    - providerId: google-vertex
      modelId: gemini-4-argon
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-argon
    - providerId: google-vertex
      modelId: gemini-4-carbon
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      contextLength: 1048576
      maxOutputToken: 65536
      chatModel: true
      embeddingModel: false
      informativeUrl: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-carbon
    - providerId: google-vertex
      modelId: gemini-4-hydrogen
      inputModalities: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT]
      contextLength: 1048576
