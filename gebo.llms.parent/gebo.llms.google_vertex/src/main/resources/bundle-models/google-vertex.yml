# The google-vertex piece of the models library: what Gebo knows of this provider's models
# (modelsInfo) and what they accept in a request (parameterRules), bound by
# GoogleVertexModelsLibrary under ai.gebo.models.providers.google-vertex.
# The Vertex models api gives the limits and the thinking support; it tells nothing of
# the lifecycle, so the retirement dates come from
# docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions (2026-10-11).
# Only the chat models with an announced date are listed; "or later" dates are not.
ai.gebo.models.providers.google-vertex:
  modelsInfo:
    - providerId: google-vertex
      modelId: gemini-2.5-pro
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2026-10-20"
      replacementModel: gemini-3.8-flash
      informativeUrl: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/model-versions
    - providerId: google-vertex
      modelId: gemini-2.5-flash
      chatModel: true
      embeddingModel: false
      deprecated: true
      retirementDate: "2026-10-20"
      replacementModel: gemini-3.8-flash
