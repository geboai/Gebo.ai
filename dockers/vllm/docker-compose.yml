services:
  jina-vllm:
    image: vllm/vllm-openai:latest
    container_name: jina-vllm
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command:
      - --model
      - jinaai/jina-embeddings-v4-vllm-retrieval
      - --task
      - embed
      - --trust-remote-code
      - --dtype
      - float16
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports:
      - "8000:8000"
    runtime: nvidia
    # The Hugging Face cache. Without it vLLM re-downloads the full model on
    # every `up` - many GB per start, and a hard dependency on huggingface.co
    # being reachable. This is a CACHE, not data: deleting it costs a download,
    # never information.
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
