# ===========================================================================
# EURO-OFFICE *Workspace-style* sandbox: Nextcloud (the workspace) + the
# Euro-Office Document Server fork (hosting the Gebo AI Assistant plugin) + a
# real Gebo.ai backend, behind one Keycloak realm with UNIFIED SSO.
#
# Twin of ../onlyoffice-workspace, differing only in:
#   - the Document Server image (ghcr.io/euro-office/documentserver) and its
#     web root (/var/www/euro-office/documentserver, not .../onlyoffice/...);
#   - its own JWT secret (matches the euro-office image);
#   - realm euro-office-workspace-dev and a distinct port block.
#
# See ../onlyoffice-workspace/README.md for the architecture and the
# same-site-over-localtest.me SSO trick; this file mirrors it.
#
#   Browser URLs (all -> 127.0.0.1):
#     Nextcloud   http://nextcloud.localtest.me:8091/
#     Editor/SSO  http://office.localtest.me:4380/
#     Keycloak    http://keycloak.localtest.me:8083/   (admin/admin)
#     Gebo API    http://gebo.localtest.me:14999/
#
# Prerequisite: build the plugin first:
#     cd ../../../Gebo.ai-offices-plugin && npm ci && npm run build
# ===========================================================================
services:
  # --------------------------- platform infrastructure ---------------------------
  mongo:
    image: mongo
    restart: always
    ports:
      - '127.0.0.1:27019:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoroot
      MONGO_INITDB_ROOT_PASSWORD: mongopwd
    command: ['mongod', '--wiredTigerCacheSizeGB=1']
    volumes:
      - mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant
    restart: always
    ports:
      - '127.0.0.1:6337:6333'
      - '127.0.0.1:6338:6334'
    environment:
      QDRANT__SERVICE__API_KEY: ce7c85bc-f037-4c64-91d8-70335638329d
      QDRANT__STORAGE__OPTIMIZE_INDEXING: 'true'
      QDRANT__STORAGE__RAM_DISK_SIZE: '256MB'
      QDRANT__STORAGE__MAX_SEGMENT_SIZE: '1000000'
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5
    restart: always
    ports:
      - '127.0.0.1:7476:7474'
      - '127.0.0.1:7689:7687'
    environment:
      NEO4J_AUTH: 'neo4j/neo4jmaster'
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  opensearch:
    image: opensearchproject/opensearch:latest
    restart: always
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=dothesearch1973-Advanced
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.transport.enabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # --------------------------- Gebo.ai backend ---------------------------
  gebo.ai:
    image: geboai/gebo.ai
    restart: always
    ports:
      - '14999:12999'
    depends_on:
      - mongo
      - qdrant
      - neo4j
      - opensearch
      - keycloak
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - gebo-work:/opt/gebo.ai/work
      - gebo-home:/opt/gebo.ai/home
      - gebo-logs:/opt/gebo.ai/logs
      - gebo-shares:/opt/gebo.ai/shares
      - ../gebo.ai/config:/opt/gebo.ai/config:ro
    environment:
      JAVA_TOOL_OPTIONS: >-
        --enable-native-access=ALL-UNNAMED
        -Dsun.jnu.encoding=UTF-8
        -Dfile.encoding=UTF-8
        -Dai.gebo.neo4j.enabled=true
        -Xms2g
        -Xmx4g
        -XX:MaxMetaspaceSize=512m
        --add-opens=java.base/java.nio.charset=ALL-UNNAMED
      SPRING_APPLICATION_JSON: >-
        {"ai.gebo.agents.standard.enabled":"true",
        "ai.gebo.officeplugin.enabled":"true",
        "ai.gebo.security.cors.allowedOrigins":"http://gebo.localtest.me:14999,http://office.localtest.me:4380,http://nextcloud.localtest.me:8091,http://localhost:4200",
        "ai.gebo.security.loginPolicy":"TRUST_EVERY_OAUTH_IDENTITY",
        "ai.gebo.security.oauth2configs[0].registrationId":"keycloakWorkspaceBearer",
        "ai.gebo.security.oauth2configs[0].description":"Euro-office workspace sandbox Keycloak resource server",
        "ai.gebo.security.oauth2configs[0].provider":"keycloak",
        "ai.gebo.security.oauth2configs[0].configurationType":"AUTHENTICATION",
        "ai.gebo.security.oauth2configs[0].client.clientId":"euro-office-plugin-dev",
        "ai.gebo.security.oauth2configs[0].client.secret":"7c9a2e40-4d1b-4f2a-9c8e-1a2b3c4d5e6f",
        "ai.gebo.security.oauth2configs[0].client.tenantId":"default",
        "ai.gebo.security.oauth2configs[0].providerConfig.provider":"keycloak",
        "ai.gebo.security.oauth2configs[0].providerConfig.authorizationUri":"http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev/protocol/openid-connect/auth",
        "ai.gebo.security.oauth2configs[0].providerConfig.tokenUri":"http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev/protocol/openid-connect/token",
        "ai.gebo.security.oauth2configs[0].providerConfig.userInfoUri":"http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev/protocol/openid-connect/userinfo",
        "ai.gebo.security.oauth2configs[0].providerConfig.issuerUri":"http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev",
        "ai.gebo.security.oauth2configs[0].providerConfig.jwkSetUri":"http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev/protocol/openid-connect/certs",
        "ai.gebo.security.oauth2configs[0].providerConfig.userNameAttribute":"email",
        "ai.gebo.sysinit.admin.config.adminUsername":"admin@gebo.ai",
        "ai.gebo.sysinit.admin.config.adminPassword":"Adm1n-sandbox-2026",
        "management.endpoints.web.exposure.include":"health,metrics,configprops",
        "logging.level.ai.gebo.security":"DEBUG"}

  # --------------------------- SSO gate (IdP + editor proxy) ---------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    hostname: keycloak
    command: ['start-dev', '--http-port=8083', '--import-realm']
    environment:
      KC_HTTP_PORT: 8083
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - '127.0.0.1:8083:8083'
    networks:
      default:
        aliases:
          - keycloak.localtest.me

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    command: --config /oauth2-proxy.cfg
    hostname: oauth2-proxy
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg:/oauth2-proxy.cfg:ro
    restart: unless-stopped
    ports:
      - '127.0.0.1:4380:4380'
    depends_on:
      - keycloak
      - documentserver
    networks:
      default:
        aliases:
          - office.localtest.me

  # --------------------------- Euro-Office DS + plugin ---------------------------
  documentserver:
    image: ghcr.io/euro-office/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: 232dfab767ecb811e9009b4256cf80c2b10526c65e7e7d82
      JWT_HEADER: Authorization
    volumes:
      - documentserver-data:/var/www/euro-office/Data
      - documentserver-log:/var/log/euro-office
      # NOTE: the Euro-Office fork serves its web root from
      # /var/www/euro-office/documentserver (not .../onlyoffice/...).
      - ../../../Gebo.ai-offices-plugin/dist/office-plugin/browser:/var/www/euro-office/documentserver/sdkjs-plugins/gebo-ai-assistant:ro
      - ./plugin-overrides/runtime-config.js:/var/www/euro-office/documentserver/sdkjs-plugins/gebo-ai-assistant/runtime-config.js:ro
      - ./plugin-overrides/backends.json:/var/www/euro-office/documentserver/sdkjs-plugins/gebo-ai-assistant/assets/backends.json:ro

  # --------------------------- Nextcloud (the workspace) ---------------------------
  nextcloud-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloudpwd
    volumes:
      - nextcloud-db:/var/lib/postgresql/data

  nextcloud-redis:
    image: redis:7
    restart: always

  nextcloud:
    image: nextcloud:30-apache
    restart: always
    depends_on:
      - nextcloud-db
      - nextcloud-redis
      - keycloak
      - documentserver
    ports:
      - '127.0.0.1:8091:80'
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloudpwd
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ncadmin
      NEXTCLOUD_ADMIN_PASSWORD: ncadmin-sandbox-2026
      NEXTCLOUD_TRUSTED_DOMAINS: 'nextcloud.localtest.me nextcloud localhost'
      OVERWRITEHOST: 'nextcloud.localtest.me:8091'
      OVERWRITEPROTOCOL: 'http'
      OVERWRITECLIURL: 'http://nextcloud.localtest.me:8091'
      ONLYOFFICE_DS_BROWSER_URL: 'http://office.localtest.me:4380/'
      ONLYOFFICE_DS_INTERNAL_URL: 'http://documentserver/'
      ONLYOFFICE_STORAGE_URL: 'http://nextcloud/'
      ONLYOFFICE_JWT_SECRET: '232dfab767ecb811e9009b4256cf80c2b10526c65e7e7d82'
      OIDC_DISCOVERY_URL: 'http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev/.well-known/openid-configuration'
      OIDC_CLIENT_ID: 'nextcloud'
      OIDC_CLIENT_SECRET: 'nextcloud-sandbox-secret-2026'
      WEBDAV_USER: 'webdav'
      WEBDAV_PASSWORD: 'webdav-sandbox-2026'
    volumes:
      - nextcloud-data:/var/www/html
      - ./nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./nextcloud/hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
      - ./nextcloud/sample-docs:/gebo-sample-docs:ro
    networks:
      default:
        aliases:
          - nextcloud.localtest.me

volumes:
  mongo-data:
  qdrant-data:
  neo4j-data:
  neo4j-logs:
  opensearch-data:
  gebo-work:
  gebo-home:
  gebo-logs:
  gebo-shares:
  documentserver-data:
  documentserver-log:
  nextcloud-db:
  nextcloud-data:

networks:
  default:
    name: gebo-euro-office-workspace-dev
