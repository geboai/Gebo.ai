http_address="0.0.0.0:4380"
cookie_secret="4T39aQ2EMNWlYsCLyINmKOvVaqzqAZQF"
cookie_secure="false"
email_domains="*"

upstreams="http://documentserver"

pass_access_token=true
set_xauthrequest=true

# The euro-office editor is embedded by Nextcloud; office.localtest.me and
# nextcloud.localtest.me share the localtest.me site so a host-only Lax cookie on
# office.localtest.me is sent in the embedded context. Do NOT set
# cookie_domains=".localtest.me": oauth2-proxy matches it against the host
# *including the port*, never matches, and 403s every request.
cookie_samesite="lax"
whitelist_domains=".localtest.me:8091,.localtest.me:4380"

cookie_refresh="4m"

provider="oidc"
provider_display_name="Keycloak"
client_id="euro-office-plugin-dev"
client_secret="7c9a2e40-4d1b-4f2a-9c8e-1a2b3c4d5e6f"
redirect_url="http://office.localtest.me:4380/oauth2/callback"

oidc_issuer_url="http://keycloak.localtest.me:8083/realms/euro-office-workspace-dev"

# Embedded in an iframe: skip the interactive "Sign in with Keycloak" button
# and 302 straight to Keycloak, which returns silently given the active SSO
# session from the Nextcloud login.
skip_provider_button=true
