worker_processes  1;

events { worker_connections  1024; }

http {
   resolver 127.0.0.11 ipv6=off; 
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time '
                  'ua="$http_user_agent" '
                  'up="$upstream_addr" us="$upstream_status"';

  access_log /dev/stdout main;
  error_log  /dev/stderr info;

  init_by_lua_block {
    MAX_BODY = 200000  -- 200 KB
    LOG_FILE = "/var/log/nginx/llm_proxy_bodies.log"
  }

  server {
    listen 8080;

    location = /health {
      return 200 "ok\n";
    }

    location / {
      access_by_lua_block {
        ngx.req.read_body()
        local rb = ngx.req.get_body_data() or ""
        if #rb > MAX_BODY then
          rb = rb:sub(1, MAX_BODY) .. "\n---TRUNCATED---"
        end
        ngx.ctx.req_body = rb
        ngx.ctx.resp_chunks = {}
      }

      body_filter_by_lua_block {
        local chunk = ngx.arg[1]
        local eof   = ngx.arg[2]

        if chunk and chunk ~= "" then
          local current_size = 0
          for _, c in ipairs(ngx.ctx.resp_chunks) do
            current_size = current_size + #c
          end

          if current_size < MAX_BODY then
            local remaining = MAX_BODY - current_size
            if #chunk > remaining then
              table.insert(ngx.ctx.resp_chunks, chunk:sub(1, remaining))
              table.insert(ngx.ctx.resp_chunks, "\n---TRUNCATED---")
            else
              table.insert(ngx.ctx.resp_chunks, chunk)
            end
          end
        end

        if eof then
          -- log in log_by_lua_block
        end
      }

      log_by_lua_block {
        local req_body = ngx.ctx.req_body or ""
        local resp_body = table.concat(ngx.ctx.resp_chunks or {})

        local line = "\n===== LLM PROXY =====\n"
          .. "TIME: " .. ngx.localtime() .. "\n"
          .. "REQ: " .. (ngx.var.request or "") .. "\n"
          .. "STATUS: " .. (ngx.var.status or "") .. "\n"
          .. "UPSTREAM: " .. (ngx.var.upstream_addr or "") .. "\n"
          .. "REQ_BODY:\n" .. req_body .. "\n"
          .. "RESP_BODY:\n" .. resp_body .. "\n"
          .. "=====================\n"

        -- Console
        ngx.log(ngx.ERR, line)

        -- File append
        local f = io.open(LOG_FILE, "a")
        if f then
          f:write(line)
          f:close()
        end
      }

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      proxy_buffering off;          # utile con streaming
      proxy_request_buffering on;   # necessario per leggere request body

      # vLLM sul tuo host
      proxy_pass http://host.docker.internal:8000;
    }
  }
}
