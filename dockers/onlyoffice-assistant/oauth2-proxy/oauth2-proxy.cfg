http_address="0.0.0.0:4180"
cookie_secret="4T39aQ2EMNWlYsCLyINmKOvVaqzqAZQF"
cookie_secure="false"
email_domains="*"

upstreams="http://documentserver"

# Lets the gebo-ai-assistant plugin (dockers/onlyoffice/plugin/gebo-ai-assistant)
# read the logged-in user's Keycloak access token same-origin via a plain
# `GET /oauth2/auth` (credentials: include) - oauth2-proxy echoes it back in the
# X-Auth-Request-Access-Token response header. See that plugin's auth.js.
pass_access_token=true
set_xauthrequest=true

# Refresh the upstream Keycloak access token from the stored refresh token once the
# session cookie is older than this, so a hands-off editor/plugin session keeps a
# non-expired token (the plugin rejects an expired one with "No access token arrived
# before deadline"). Must be shorter than the realm's accessTokenLifespan
# (raised to 1800s in keycloak/realm-export.json).
cookie_refresh="4m"

provider="oidc"
provider_display_name="Keycloak"
client_id="onlyoffice-plugin-dev"
client_secret="42f277af-7919-4edb-a686-a2f40ec4dc87"
redirect_url="http://localhost:4180/oauth2/callback"

# oauth2-proxy resolves this from inside the compose network via the
# "keycloak.localtest.me" alias on the keycloak service (see docker-compose.yml);
# your browser resolves the same hostname via public wildcard DNS to 127.0.0.1.
# Both sides hit the SAME port (8081, no NAT offset) so Keycloak's issuer/token
# validation is consistent regardless of which side made the request.
oidc_issuer_url="http://keycloak.localtest.me:8081/realms/onlyoffice-dev"
