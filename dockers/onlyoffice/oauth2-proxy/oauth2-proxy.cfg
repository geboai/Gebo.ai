# "keycloak.localtest.me" alias on the keycloak service (see docker-compose.yml);
# your browser resolves the same hostname via public wildcard DNS to 127.0.0.1.
# Both sides hit the SAME port (8081, no NAT offset) so Keycloak's issuer/token
# validation is consistent regardless of which side made the request.
