http_address="0.0.0.0:4280"
cookie_secret="4T39aQ2EMNWlYsCLyINmKOvVaqzqAZQF"
cookie_secure="false"
email_domains="*"

upstreams="http://documentserver"

# The plugin reads the logged-in user's Keycloak access token same-origin via
# GET /oauth2/auth (credentials: include); oauth2-proxy echoes it back in the
# X-Auth-Request-Access-Token response header. See plugin-overrides/runtime-config.js.
pass_access_token=true
set_xauthrequest=true

# The editor (and hence this proxy's page) is embedded in an <iframe> by
# Nextcloud. Nextcloud is at nextcloud.localtest.me and this proxy at
# office.localtest.me - SAME registrable domain (localtest.me) => same-site, so a
# host-only Lax cookie on office.localtest.me IS sent in the embedded context
# over plain HTTP (same-site is a property of the registrable domain, not of the
# cookie Domain attribute). Do NOT set cookie_domains=".localtest.me": oauth2-proxy
# matches it against the host *including the port* ("office.localtest.me:4280"),
# never matches, cannot set its cookie, and 403s every request.
cookie_samesite="lax"
whitelist_domains=".localtest.me:8090,.localtest.me:4280"

# Keep the browser's Keycloak access token fresh on a hands-off editor session.
# Must be shorter than the realm accessTokenLifespan (1800s).
cookie_refresh="4m"

provider="oidc"
provider_display_name="Keycloak"
client_id="onlyoffice-plugin-dev"
client_secret="42f277af-7919-4edb-a686-a2f40ec4dc87"
redirect_url="http://office.localtest.me:4280/oauth2/callback"

# Same hostname (keycloak.localtest.me) and port (8082) on both the browser side
# and the in-network side, so Keycloak's issuer/token validation lines up.
oidc_issuer_url="http://keycloak.localtest.me:8082/realms/onlyoffice-workspace-dev"

# Embedded in an iframe: skip the interactive "Sign in with Keycloak" button
# and 302 straight to Keycloak, which returns silently given the active SSO
# session from the Nextcloud login.
skip_provider_button=true
