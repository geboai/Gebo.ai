# ---------------------------------------------------------------------------
# Shared runtime configuration for the Gebo.ai MICROSERVICES deployment.
#
# Mounted read-only at /opt/gebo.ai/config in every backend service and loaded
# via SPRING_CONFIG_ADDITIONAL_LOCATION on top of each service's own baked
# application.yml (which sets spring.application.name, the service's port and the
# eureka client).
#
# Hostnames (mongo, rabbit, qdrant, opensearch, neo4j) are docker-compose service
# names on the gebo-net network. Values here are DEV defaults reused from the
# monolith image config - change every secret/password/api-key for production.
#
# NOTHING SERVICE-SPECIFIC BELONGS IN THIS FILE. It is shared by every service and
# an additional-location OUTRANKS the application.yml baked into the jar, so any
# key set here silently overrides all 19 services at once. That is exactly what a
# 'server.port: 8080' here used to do: it pinned every container back to 8080
# while compose published 13001, 13004, ... - each host port mapping to a
# container port nobody was listening on. Each service now sets its own port (the
# 13000-13018 block); do not reintroduce one here.
#
# The same rule is why heimdall's ai.gebo.secrets.cluster.* settings live in ITS
# application.yml and not here: setting them here would apply the secrets-cluster
# configuration to all 19 services.
# ---------------------------------------------------------------------------
logging:
  level:
    root: INFO
    org.springframework: INFO

server:
  compression:
    enabled: true

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  # RabbitMQ broker used by the microservices messaging bridge (gebo.microservices.starter).
  rabbitmq:
    host: rabbit
    port: 5672
    username: guest
    password: guest
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: neo4jmaster
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      INDENT_OUTPUT: true

security.provider.1: org.bouncycastle.jce.provider.BouncyCastleProvider

ai.gebo.security:
  auth:
    tokenSecret: 04ca023b39512e46d0c2cf4b48d5aac61d34302994c87ed4eff225dcf3b0a218739f3897051a057f9b846a69ea2927a587044164b7bae5e1306219d50b588cb1
    tokenExpirationMsec: 120000
  cors:
    # The gateway is the browser-facing origin and now listens on 13000 (it used to
    # be 8080); 4200 is the Angular dev server for `ng serve`.
    allowedOrigins: http://localhost:13000,http://localhost:4200
  oauth2:
    authorizedRedirectUris:
      - http://localhost:3000/oauth2/redirect

ai.gebo.config:
  setupConfiguresWorkdir: false
  security: true
  setup: true
  customKeyStore: false
  enableCommunityModules: true

# MongoDB (shared metadata store).
ai.gebo.mongodb:
  enabled: true
  databaseName: gebo-ai
  connectionString: mongodb://mongoroot:mongopwd@mongo:27017/gebo-ai?authSource=admin

# Qdrant vector store (used by the RAG / vectorizator / brain services).
ai.gebo.vectorstore:
  use: QDRANT
  qdrant:
    host: qdrant
    port: 6334
    tls: false
    apiKey: ce7c85bc-f037-4c64-91d8-70335638329d

# OpenSearch (used by the fulltextor / full-text service).
ai.gebo.opensearch:
  enabled: true
  protocol: https
  host: opensearch
  port: 9200
  username: admin
  password: dothesearch1973-Advanced

# LLM providers - supply real API keys via the shared config or per-service env.
ai.gebo.llms.config:
  openAIEnabled: true
  anthropicEnabled: true
  ollamaEnabled: true
spring.ai:
  openai:
    api-key: DUMMYKEY
    embedding:
      enabled: true
      options:
        model: text-embedding-3-large
    chat:
      api-key: DUMMYKEY
      options:
        model: gpt-3.5-turbo-16k

# ---------------------------------------------------------------------------
# The Gebo.ai SYSTEM IDENTITY: who the platform is when it acts on its own behalf.
#
# Needed because a great deal of work runs on NO user's thread - LLM clients are
# built at startup and on model replication, MCP connectors reconnect in the
# background, schedulers run jobs. Those threads hold no token to forward (under
# IdentityUtil.doAs they hold an authentication synthesized locally, with null
# credentials), so a call they make to another service would arrive anonymous and be
# refused. Instead the platform mints a short-lived LOCAL_JWT for THIS identity and
# presents that - an ordinary token, validated on the ordinary path.
#
# The defaults below are what ships; they are spelled out here because they are
# security-relevant, not because they must be set.
#
# This user is VIRTUAL: it has no Mongo document, cannot log in (its password is a
# random value nobody - not even this process - retains), cannot be created by an
# admin, and cannot be auto-provisioned by an OAuth2 login. ADMIN is in its role set
# on purpose: with GrantedAuthorityDefaults("") an ADMIN authority is exactly what
# the ~90 @PreAuthorize("hasRole('ADMIN')") endpoints test for.
#
# Its tokens are signed with ai.gebo.security.auth.tokenSecret above - the same key
# every service already shares - so changing that key rotates them too.
# ---------------------------------------------------------------------------
ai.gebo.security.system-user:
  username: heimdall@bifrost.gebo.ai
  roles: [SYSTEM, ADMIN]
  token-expiration-msec: 300000

# ---------------------------------------------------------------------------
# Secrets client (gebo.microservices.secrets.client) - INERT TODAY.
#
# Commented out on purpose: no service has the client module on its classpath yet,
# so these keys would bind to nothing. Every service still carries gebo.secrets.impl
# and reads secrets from its own Mongo. Uncomment when a service is switched over to
# heimdall by swapping gebo.secrets.impl for gebo.microservices.secrets.client in its
# pom - at which point this block, being shared, configures all of them at once.
#
# There is no base-url: the client resolves heimdall's address from the topology
# (GeboMicroserviceUrlResolver), so it follows the deployment's addressing strategy.
#
# There is no service-token either. A call with no caller token to forward does NOT
# fall back to a shared static credential - it falls back to a freshly minted token
# for the system identity configured above.
#
#ai.gebo.secrets.client:
#  microservice-id: heimdall_gebo_ai
#  base-path: api/cluster/SecretsController
# ---------------------------------------------------------------------------

reactor.schedulers.defaultPoolSize: 16
