# Scrape config for the Gebo.ai microservices stack.
#
# Every service - the gateway and each backend - serves its actuator on the
# separate management port 13990 (MANAGEMENT_SERVER_PORT in docker-compose.yml),
# which no service publishes: only this network reaches it. There
# /actuator/prometheus needs no login, while on the application ports every
# actuator call of a backend needs an authenticated user. The management server
# ignores the servlet context path (/brain, /tyr, ...), so every target answers
# at the same /actuator/prometheus.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:13990"]

  - job_name: gebo-microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["brain:13990"]
        labels: { service: brain }
      - targets: ["vectorizator:13990"]
        labels: { service: vectorizator }
      - targets: ["graphicator:13990"]
        labels: { service: graphicator }
      - targets: ["chunker:13990"]
        labels: { service: chunker }
      - targets: ["git:13990"]
        labels: { service: git }
      - targets: ["filesystem:13990"]
        labels: { service: filesystem }
      - targets: ["uploads:13990"]
        labels: { service: uploads }
      - targets: ["userspace:13990"]
        labels: { service: userspace }
      - targets: ["sharepoint:13990"]
        labels: { service: sharepoint }
      - targets: ["confluence:13990"]
        labels: { service: confluence }
      - targets: ["jira:13990"]
        labels: { service: jira }
      - targets: ["aws-s3:13990"]
        labels: { service: aws-s3 }
      - targets: ["googledrive:13990"]
        labels: { service: googledrive }
      - targets: ["mcpclient:13990"]
        labels: { service: mcpclient }
      - targets: ["integration:13990"]
        labels: { service: integration }
      - targets: ["fulltextor:13990"]
        labels: { service: fulltextor }
      - targets: ["heimdall:13990"]
        labels: { service: heimdall }
      - targets: ["tyr:13990"]
        labels: { service: tyr }
      - targets: ["webdav:13990"]
        labels: { service: webdav }
