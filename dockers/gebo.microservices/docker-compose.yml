# ===========================================================================
# Gebo.ai MICROSERVICES deployment.
#
# Infra (mongo, rabbit, qdrant, neo4j, opensearch) + the eureka registry + the
# api gateway + every backend microservice.
#
# 1. Build the images first (from gebo.apps.parent/gebo.microservices.apps.parent):
#        mvn -P docker package -DskipTests
#    -> produces geboai/<artifactId>:<version> in the local Docker daemon.
# 2. Then:  docker compose up -d
#
# App-to-app calls resolve via Eureka + client-side LoadBalancer by service-id, so
# nothing here NEEDS a host port except the gateway. Every microservice publishes
# one anyway, on its own dedicated port from the 13000-13020 block, so each service
# can be reached (and its /v3/api-docs scraped by the generated client stubs)
# without going through the gateway:
#
#   13000 gateway (edge: Angular UI + aggregated API)   13009 sharepoint
#   13001 brain                                         13010 confluence
#   13002 vectorizator                                  13011 jira
#   13003 graphicator                                   13012 aws-s3
#   13004 chunker                                       13013 googledrive
#   13005 git                                           13014 mcpclient
#   13006 filesystem                                    13015 integration
#   13007 uploads                                       13016 fulltextor
#   13008 userspace                                     13017 eureka (registry)
#                                                       13018 heimdall (security)
#                                                       13019 tyr (workflows/usage/jobs)
#                                                       13020 webdav
#
# 13018 extends what used to be a full 13000-13017 block; heimdall was added after
# every slot in it was taken. 13019 (tyr) and 13020 (webdav) followed the same way.
#
# Each port is fixed in that service's application.yml, so the container port and
# the published port are the same number - no translation to keep in sync.
# Override the image tag with GEBO_VERSION in .env.
# ===========================================================================
name: gebo-microservices

# Common definition shared by every backend microservice.
x-microservice-env: &microservice-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:13017/eureka/
  SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/gebo.ai/config/
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1g"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces

# The config mount is the only volume every service shares verbatim, so it is the
# only one this anchor can carry: /opt/gebo.ai/{home,work,logs} has to be a NAMED
# volume PER SERVICE, and a YAML anchor cannot parameterise a volume name. Every
# service therefore restates the full list - see the persistence note at the
# bottom of this file for why they are named and why they are not shared.
x-microservice: &microservice
  restart: unless-stopped
  depends_on: [eureka, rabbit, mongo]
  environment:
    <<: *microservice-env
  networks: [gebo-net]

services:
  # ---------------- Infrastructure ----------------
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoroot
      MONGO_INITDB_ROOT_PASSWORD: mongopwd
    command: ["mongod", "--wiredTigerCacheSizeGB=1"]
    volumes: [mongo-data:/data/db]
    networks: [gebo-net]

  rabbit:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "127.0.0.1:15672:15672"   # management UI (loopback only)
    # /var/lib/rabbitmq is the mnesia store: durable queue/exchange/binding
    # definitions, users, and any persistent message not yet acked. Without it an
    # upgrade silently drops the ingestion work still sitting in the broker along
    # with the topology the services declared.
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks: [gebo-net]

  qdrant:
    image: qdrant/qdrant
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ce7c85bc-f037-4c64-91d8-70335638329d
      QDRANT__STORAGE__OPTIMIZE_INDEXING: "true"
    volumes: [qdrant-data:/qdrant/storage]
    networks: [gebo-net]

  neo4j:
    image: neo4j:5
    restart: always
    environment:
      NEO4J_AUTH: "neo4j/neo4jmaster"
      NEO4JLABS_PLUGINS: '["apoc"]'
    volumes: [neo4j-data:/data]
    networks: [gebo-net]

  opensearch:
    image: opensearchproject/opensearch:latest
    restart: always
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=dothesearch1973-Advanced
      - plugins.security.ssl.http.enabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [opensearch-data:/usr/share/opensearch/data]
    networks: [gebo-net]

  # ---------------- Service registry ----------------
  eureka:
    image: geboai/eureka.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    restart: unless-stopped
    ports:
      - "13017:13017"             # Eureka dashboard / registry
    # The registry is intentionally stateless - it rebuilds itself from the
    # heartbeats of the services that re-register - so no home/work here. It
    # does write the security audit trail, which must outlive the container.
    volumes:
      - eureka-logs:/opt/gebo.ai/logs
    networks: [gebo-net]

  # ---------------- API gateway (the edge: Angular UI + aggregated API) --------
  gateway:
    image: geboai/gateway.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    restart: unless-stopped
    depends_on: [eureka]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:13017/eureka/
    ports:
      - "13000:13000"
    # Routes are resolved from Eureka at request time, so the edge holds no
    # durable state of its own - but it is where every unauthenticated request
    # first lands, which makes its audit trail the one you least want to lose.
    volumes:
      - gateway-logs:/opt/gebo.ai/logs
    networks: [gebo-net]

  # ---------------- Observability stack (metrics, traces, dashboards) --------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"     # OTLP HTTP (loopback only)
    networks: [gebo-net]

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"     # Prometheus UI (loopback only)
    networks: [gebo-net]

  tempo:
    image: grafana/tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [gebo-net]

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"     # Grafana UI (loopback only)
    networks: [gebo-net]

  # ---------------- Security service ----------------
  # heimdall keeps the secrets - but note it is NOT the only holder of the crypting
  # keys, and it never decrypts on a caller's behalf. The keystore is shared (bundled,
  # or pointed at by configuration), so the cluster surface hands back the STORED
  # CIPHERTEXT and the caller decrypts locally. No secret is ever in the clear on the
  # network. Everyone else reaches it through gebo.microservices.secrets.client, which
  # speaks to api/cluster/SecretsController - a surface heimdall serves ONLY to callers
  # whose address is that of an instance currently registered in Eureka.
  #
  # So the eureka dependency it already inherits from *microservice is load-bearing
  # here in a way it is not elsewhere: with the registry unreachable heimdall knows of
  # no participant and denies every call (it fails closed), so secrets stop flowing
  # rather than flowing to anyone.
  #
  # GEBO_HOME / GEBO_WORK_DIRECTORY and the config mount come from *microservice and
  # the parent's Jib directive, like every other service - nothing to restate here.
  # The published 13018 is for direct access / api-docs scraping. The gateway does NOT
  # route the cluster surface (see the gateway's application.yml) - only heimdall's
  # admin API is reachable from the edge.
  heimdall:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - heimdall-home:/opt/gebo.ai/home
      - heimdall-work:/opt/gebo.ai/work
      - heimdall-logs:/opt/gebo.ai/logs
    image: geboai/heimdall.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13018:13018"

  # ---------------- LLM / RAG backends ----------------
  # Every backend publishes its own port to the host as well, so each service's
  # /v3/api-docs (and its Swagger UI, in a swagger-on build) is reachable directly
  # at localhost:<port> - which is exactly what the generated client stubs under
  # gebo.microservices.clients.parent point their <swagger.file> at.
  brain:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - brain-home:/opt/gebo.ai/home
      - brain-work:/opt/gebo.ai/work
      - brain-logs:/opt/gebo.ai/logs
    image: geboai/brain.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    depends_on: [eureka, rabbit, mongo, qdrant]
    ports:
      - "13001:13001"

  vectorizator:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - vectorizator-home:/opt/gebo.ai/home
      - vectorizator-work:/opt/gebo.ai/work
      - vectorizator-logs:/opt/gebo.ai/logs
    image: geboai/vectorizator.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    depends_on: [eureka, rabbit, mongo, qdrant]
    ports:
      - "13002:13002"

  graphicator:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - graphicator-home:/opt/gebo.ai/home
      - graphicator-work:/opt/gebo.ai/work
      - graphicator-logs:/opt/gebo.ai/logs
    image: geboai/graphicator.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    depends_on: [eureka, rabbit, mongo, neo4j]
    ports:
      - "13003:13003"

  chunker:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - chunker-home:/opt/gebo.ai/home
      - chunker-work:/opt/gebo.ai/work
      - chunker-logs:/opt/gebo.ai/logs
    image: geboai/chunker.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13004:13004"

  fulltextor:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - fulltextor-home:/opt/gebo.ai/home
      - fulltextor-work:/opt/gebo.ai/work
      - fulltextor-logs:/opt/gebo.ai/logs
    image: geboai/fulltextor.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    depends_on: [eureka, rabbit, mongo, opensearch]
    ports:
      - "13016:13016"

  # ---------------- Content-handler microservices ----------------
  git:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - git-home:/opt/gebo.ai/home
      - git-work:/opt/gebo.ai/work
      - git-logs:/opt/gebo.ai/logs
    image: geboai/git.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13005:13005"
  filesystem:
    <<: *microservice
    image: geboai/filesystem.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    environment:
      <<: *microservice-env
      # Off by default (GeboAiFilesystemsConfig) since it lets an admin point a
      # share at any path the container can see; the test cluster exercises the
      # file-share admin flow (FileSystemSharesSettingController), so opt in here
      # rather than flipping the shared, security-relevant default for every
      # deployment.
      AI_GEBO_FILESYSTEM_ALLOWFILESYSTEMSHARESUI: "true"
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - filesystem-home:/opt/gebo.ai/home
      - filesystem-work:/opt/gebo.ai/work
      - filesystem-logs:/opt/gebo.ai/logs
      # microservices-integration-tests creates its shared test folder under the
      # HOST's system temp dir and hands this service that same absolute path -
      # a container with its own filesystem can't see it otherwise. Local test
      # cluster only; do not carry this into a real deployment's compose file.
      - /tmp:/tmp
    ports:
      - "13006:13006"
  uploads:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - uploads-home:/opt/gebo.ai/home
      - uploads-work:/opt/gebo.ai/work
      - uploads-logs:/opt/gebo.ai/logs
    image: geboai/uploads.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13007:13007"
  userspace:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - userspace-home:/opt/gebo.ai/home
      - userspace-work:/opt/gebo.ai/work
      - userspace-logs:/opt/gebo.ai/logs
    image: geboai/userspace.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13008:13008"
  sharepoint:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - sharepoint-home:/opt/gebo.ai/home
      - sharepoint-work:/opt/gebo.ai/work
      - sharepoint-logs:/opt/gebo.ai/logs
    image: geboai/sharepoint.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13009:13009"
  confluence:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - confluence-home:/opt/gebo.ai/home
      - confluence-work:/opt/gebo.ai/work
      - confluence-logs:/opt/gebo.ai/logs
    image: geboai/confluence.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13010:13010"
  jira:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - jira-home:/opt/gebo.ai/home
      - jira-work:/opt/gebo.ai/work
      - jira-logs:/opt/gebo.ai/logs
    image: geboai/jira.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13011:13011"
  aws-s3:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - aws-s3-home:/opt/gebo.ai/home
      - aws-s3-work:/opt/gebo.ai/work
      - aws-s3-logs:/opt/gebo.ai/logs
    image: geboai/aws-s3.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13012:13012"
  googledrive:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - googledrive-home:/opt/gebo.ai/home
      - googledrive-work:/opt/gebo.ai/work
      - googledrive-logs:/opt/gebo.ai/logs
    image: geboai/googledrive.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13013:13013"
  mcpclient:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - mcpclient-home:/opt/gebo.ai/home
      - mcpclient-work:/opt/gebo.ai/work
      - mcpclient-logs:/opt/gebo.ai/logs
    image: geboai/mcpclient.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13014:13014"
  webdav:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - webdav-home:/opt/gebo.ai/home
      - webdav-work:/opt/gebo.ai/work
      - webdav-logs:/opt/gebo.ai/logs
    image: geboai/webdav.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13020:13020"
  integration:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - integration-home:/opt/gebo.ai/home
      - integration-work:/opt/gebo.ai/work
      - integration-logs:/opt/gebo.ai/logs
    image: geboai/integration.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13015:13015"
  tyr:
    <<: *microservice
    volumes:
      - ./config:/opt/gebo.ai/config:ro
      - tyr-home:/opt/gebo.ai/home
      - tyr-work:/opt/gebo.ai/work
      - tyr-logs:/opt/gebo.ai/logs
    image: geboai/tyr.gebo.ai:${GEBO_VERSION:-1.0.2.4-SNAPSHOT}
    ports:
      - "13019:13019"

# ===========================================================================
# NAMED volumes only, deliberately.
#
# /opt/gebo.ai/{home,work} used to be ANONYMOUS here, which looks like
# persistence and is not: Compose carries an anonymous volume across a container
# RECREATE, but `docker compose down` - the first half of every upgrade - leaves
# it dangling, and the next `up` creates a fresh empty one. A later
# `docker system prune --volumes` then deletes it for good. Naming them is what
# actually makes the data survive an update/upgrade.
#
# Each service gets its OWN work volume rather than one shared across the
# cluster. That is the architecture, not caution: DocumentsCacheServiceImpl
# writes <work>/DOCUMENTSCACHE files keyed by a Mongo entry and deletes them on
# eviction, so a shared work directory would put every service in a multi-writer
# race over the same files. Services exchange documents over the content-handler
# seam (REST + RabbitMQ), never through a shared filesystem.
#
# What each one holds:
#   <svc>-work  DURABLE user data - chat SESSIONS_AREA, per-endpoint content
#               mirrors, the document cache, uploads, Google Workspace OAuth
#               tokens. Mongo only INDEXES it; the bytes live here, so losing it
#               leaves dangling Mongo references. Back these up.
#   <svc>-home  GEBO_HOME, the service's own home area.
#   <svc>-logs  security-log.jsonl, the append-only GDPR Art.32 / NIS2 Art.21
#               audit trail. deploy/wazuh/docker/docker-compose.security-logs
#               .override.yml replaces these with host binds at the SAME
#               container path - Compose merges volume lists by target - so that
#               override still wins wherever it is layered on.
#
# Migrating a cluster whose data is still in anonymous volumes: do that BEFORE
# the first `up` with this file. See dockers/PERSISTENCE.md.
# ===========================================================================
volumes:
  # ---- infrastructure ----
  mongo-data:
  rabbit-data:
  qdrant-data:
  neo4j-data:
  opensearch-data:
  # ---- observability ----
  prometheus-data:
  grafana-data:
  tempo-data:
  # ---- edge + registry: audit trail only ----
  eureka-logs:
  gateway-logs:
  # ---- one home/work/logs triple per backend microservice ----
  heimdall-home:
  heimdall-work:
  heimdall-logs:
  brain-home:
  brain-work:
  brain-logs:
  vectorizator-home:
  vectorizator-work:
  vectorizator-logs:
  graphicator-home:
  graphicator-work:
  graphicator-logs:
  chunker-home:
  chunker-work:
  chunker-logs:
  fulltextor-home:
  fulltextor-work:
  fulltextor-logs:
  git-home:
  git-work:
  git-logs:
  filesystem-home:
  filesystem-work:
  filesystem-logs:
  uploads-home:
  uploads-work:
  uploads-logs:
  userspace-home:
  userspace-work:
  userspace-logs:
  sharepoint-home:
  sharepoint-work:
  sharepoint-logs:
  confluence-home:
  confluence-work:
  confluence-logs:
  jira-home:
  jira-work:
  jira-logs:
  aws-s3-home:
  aws-s3-work:
  aws-s3-logs:
  googledrive-home:
  googledrive-work:
  googledrive-logs:
  mcpclient-home:
  mcpclient-work:
  mcpclient-logs:
  webdav-home:
  webdav-work:
  webdav-logs:
  integration-home:
  integration-work:
  integration-logs:
  tyr-home:
  tyr-work:
  tyr-logs:

networks:
  gebo-net:
    driver: bridge
