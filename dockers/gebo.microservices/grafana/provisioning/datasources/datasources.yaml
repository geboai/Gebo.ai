apiVersion: 1

datasources:
  - name: Prometheus
    uid: gebo-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: gebo-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: gebo-prometheus
      serviceMap:
        datasourceUid: gebo-prometheus
      nodeGraph:
        enabled: true
