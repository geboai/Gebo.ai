#================================================================
# Gebo.ai - enterprise retrieval augmented generation platform.
#
# This compose file runs Gebo.ai together with the four data services it needs:
# MongoDB (application state), Qdrant (vectors), Neo4j (GraphRAG) and OpenSearch
# (full text). Once started, open http://<your host address>:12999/ with your
# browser: it will ask you to create the administrative account and you are then
# ready to set the system up and share it with your company or team.
#
#   docker compose pull
#   docker compose up -d
#
# ---------------------------------------------------------------------------
# RUNS EVERYWHERE - Linux, macOS and Windows / Docker Desktop, unchanged.
#
# It is portable because it contains NO host bind mounts at all: every path is a
# NAMED volume, so there is no host directory to pre-create, no path syntax that
# differs per operating system, and nothing that goes through the Windows
# filesystem translation layer whose file-locking and fsync semantics MongoDB,
# Neo4j and OpenSearch all dislike. It is also self-contained: downloading this
# one file into an empty directory is a complete install.
#
# /opt/gebo.ai/config is deliberately left unmounted. The image already ships
# the application.yml that wires gebo.ai to the four services below, and Compose
# silently CREATES a missing bind source - so a ./config that is not there would
# become an empty directory mounted over the real configuration.
#
# ---------------------------------------------------------------------------
# OPTIONAL DASHBOARDS
#
# Metrics, traces and Grafana are a separate overlay in this same directory.
# Unlike this file it is not self-contained (it mounts prometheus.yml,
# tempo-config.yaml, otel-collector-config.yaml and grafana/provisioning), so it
# needs a checkout of the repository:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# ---------------------------------------------------------------------------
# PERSISTENCE - NAMED VOLUMES ONLY
#
# Named volumes survive `docker compose down` and every image upgrade; only
# `docker compose down -v` or an explicit `docker volume rm` removes them. The
# `name:` below is fixed to `gebo-monolith`, so the volumes have stable,
# predictable names (`gebo-monolith_<key>`) you can target in backup and restore
# commands.
#
#   gebo-mongo   all application state: users, LLM/KB config, chat history, and
#                the INDEX of everything in gebo-work
#   gebo-qdrant  vector store - embeddings; re-ingesting to rebuild costs real
#                LLM money
#   gebo-neo4j-* GraphRAG knowledge graphs (data + logs)
#   gebo-os      OpenSearch full-text index
#   gebo-work    GEBO_WORK_DIRECTORY - DURABLE user data: chat SESSIONS_AREA,
#                per-endpoint content mirrors, the document cache, uploads,
#                Google Workspace OAuth tokens. Mongo only INDEXES it; the bytes
#                live here, so gebo-mongo and gebo-work are ONE backup unit.
#   gebo-home    GEBO_HOME
#   gebo-logs    security-log.jsonl, the append-only GDPR Art.32 / NIS2 Art.21
#                audit trail, plus gc.log
#
# An ANONYMOUS volume is the thing that does NOT survive: it is what you get for
# any path listed as VOLUME in the image but not mounted here. Every such path in
# geboai/gebo.ai is mounted below; if you add one, mount it too.
#
# Back up (stack stopped, so the copy is consistent):
#   docker compose stop
#   docker run --rm -v gebo-monolith_gebo-work:/data -v gebo-monolith_gebo-mongo:/db \
#     -v "$PWD:/backup" alpine tar czf /backup/gebo.tgz -C / data db
#   docker compose start
#
# Memory: this stack asks for roughly 8 GB of JVM/cache heaps across the five
# containers. On Docker Desktop give the VM at least 10 GB (Settings >
# Resources > Memory); on a Linux host that is just free RAM.
#
# See dockers/PERSISTENCE.md.
# ---------------------------------------------------------------------------
name: gebo-monolith

services:
  # =======================
  # MongoDB
  # =======================
  # Bound only on loopback interface for security reasons
  mongo:
    # Pinned to the 8.2 line on purpose, NOT to :8 / :latest.
    # MongoDB 8.0+ is incompatible with Linux kernel 6.19 and newer (TCMalloc
    # violates the upstream rseq ABI - SERVER-121912), and 8.0.30 / 8.3.9 refuse
    # to start there rather than segfault later. Ubuntu 24.04 LTS ships kernel
    # 7.0 in its HWE line, so that is a mainstream host, not an edge case.
    # 8.2.12 is the newest release that still starts on those kernels; the
    # GLIBC_TUNABLES below disables the rseq fast path the bug lives in.
    # REVERT TO `mongo:8` once MongoDB ships the TCMalloc fix.
    image: mongo:8.2
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoroot
      MONGO_INITDB_ROOT_PASSWORD: mongopwd
      # See the note above the image tag.
      GLIBC_TUNABLES: glibc.pthread.rseq=0:glibc.cpu.hwcaps=-SHSTK
    command: ["mongod", "--wiredTigerCacheSizeGB=1"]
    # All application state: users, LLM/knowledge-base configuration, chat
    # history, and the INDEX of every file stored in gebo-work below. Back this
    # up together with gebo-work - one without the other leaves dangling refs.
    volumes:
      - gebo-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [gebo-monolith-net]

  # =======================
  # Qdrant
  # =======================
  # Bound only on loopback interface for security reasons
  qdrant:
    image: qdrant/qdrant:v1
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ce7c85bc-f037-4c64-91d8-70335638329d
      QDRANT__STORAGE__OPTIMIZE_INDEXING: "true"
      QDRANT__STORAGE__RAM_DISK_SIZE: "256MB"
      QDRANT__STORAGE__MAX_SEGMENT_SIZE: "1000000"
    # The vector store. Rebuildable by re-ingesting everything, but re-embedding
    # a corpus costs real money at the LLM provider - treat it as data.
    volumes:
      - gebo-qdrant:/qdrant/storage
    # The image carries no curl/wget, but it does carry bash, so the readiness
    # probe is a plain TCP connect through a bash built-in.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [gebo-monolith-net]

  neo4j:
    image: neo4j:5
    restart: always
    # HTTP (7474) and Bolt (7687), on loopback only
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/neo4jmaster"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512M
      # NEO4J_PLUGINS is the Neo4j 5 name; NEO4JLABS_PLUGINS is the Neo4j 4 one
      # and only survives as a deprecated alias.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    # GraphRAG knowledge graphs. /plugins is deliberately NOT persisted:
    # NEO4J_PLUGINS re-resolves APOC for the running Neo4j version at every
    # start, and a stale jar pinned in a volume is what breaks a version bump.
    volumes:
      - gebo-neo4j-data:/data
      - gebo-neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [gebo-monolith-net]

  opensearch:
    image: opensearchproject/opensearch:3
    restart: always
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=dothesearch1973-Advanced
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.transport.enabled=true
      # recommended under docker (avoids the memlock bootstrap check)
      - bootstrap.memory_lock=true
      # heap: tune to the memory of the machine
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    # Full-text index. Rebuildable by re-ingesting, but not for free.
    volumes:
      - gebo-os:/usr/share/opensearch/data
    # Loopback only, like every other data service: gebo.ai reaches OpenSearch
    # over the compose network, so nothing needs these published to the LAN.
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sfk -u admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s
    networks: [gebo-monolith-net]

  # =======================
  # gebo.ai
  # =======================
  # Bound to all host interfaces
  gebo.ai:
    image: geboai/gebo.ai
    restart: always
    ports:
      - "12999:12999"
    # Wait for the data services to be READY, not merely created. OpenSearch and
    # Neo4j take up to a minute; without this gebo.ai starts against nothing and
    # crash-loops through the whole first boot.
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Container ceiling. Keep it comfortably above -Xmx below: metaspace,
          # code cache, thread stacks and direct buffers all live outside the
          # heap, and a heap sized to the limit gets the container OOM-killed.
          memory: 4G

    # geboai/gebo.ai declares VOLUME on /opt/gebo.ai/{home,work,logs,shares}.
    # Anything NOT named here gets an ANONYMOUS volume, which `docker compose
    # down` leaves dangling and the next `up` replaces with an empty one - so
    # every one of them is named.
    volumes:
      # THE one to back up. GEBO_WORK_DIRECTORY holds the chat SESSIONS_AREA,
      # per-endpoint content mirrors, the document cache, uploads and the Google
      # Workspace OAuth tokens. Mongo only INDEXES it; the bytes are here.
      - gebo-work:/opt/gebo.ai/work
      - gebo-home:/opt/gebo.ai/home
      # security-log.jsonl - the append-only GDPR Art.32 / NIS2 Art.21 audit
      # trail - plus gc.log from the -Xlog:gc flag below. A Wazuh agent tails
      # this via the named volume - see docs/wazuh-integration.md.
      - gebo-logs:/opt/gebo.ai/logs
      # Host content to INGEST, read-only. This is content Gebo.ai reads, not
      # storage it owns, so it is the one mount that usually wants to be a real
      # host path. Left as a named volume so the image's VOLUME does not become
      # anonymous; to expose a host tree, replace this line with a bind:
      #   Linux/macOS   - /srv/company-shares:/opt/gebo.ai/shares:ro
      #   Windows       - C:/Users/Public/Documents:/opt/gebo.ai/shares:ro
      - gebo-shares:/opt/gebo.ai/shares:ro
      # NOTE: /opt/gebo.ai/config is deliberately NOT mounted - see the header.
      # Only mount your own directory here if it contains a complete
      # application.yml:
      #   - ./config:/opt/gebo.ai/config:ro

    environment:
      # No OpenTelemetry collector in this file: without this the app samples
      # 100% of traces and retries them against localhost:4318 forever. The
      # observability overlay turns sampling back on and points it at the
      # collector.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"
      # JVM settings. -Xmx stays well under the 4G container limit above.
      # No -XX:+AggressiveHeap: it silently swaps G1 for the throughput
      # collector. No -XX:+PrintGCDetails: it is deprecated and re-routes the
      # whole GC stream to stdout, i.e. into `docker logs`, instead of gc.log.
      JAVA_TOOL_OPTIONS:
        --enable-native-access=ALL-UNNAMED
        -Dsun.jnu.encoding=UTF-8
        -Dfile.encoding=UTF-8
        -Dai.gebo.neo4j.enabled=true
        -Xms1g
        -Xmx3g
        -XX:MaxMetaspaceSize=512m
        -Xlog:gc:file=/opt/gebo.ai/logs/gc.log:time,uptime:filecount=5,filesize=20M
        --add-opens=java.base/java.nio.charset=ALL-UNNAMED
    networks: [gebo-monolith-net]

# Named volumes - the whole persistent surface of this stack. They survive
# `docker compose down` and any image upgrade; only `down -v` / `docker volume
# rm` destroys them. With `name: gebo-monolith` above, the real names are
# `gebo-monolith_<key>` (see `docker volume ls`).
volumes:
  # ---- infrastructure ----
  gebo-mongo:
  gebo-qdrant:
  gebo-neo4j-data:
  gebo-neo4j-logs:
  gebo-os:
  # ---- application ----
  # gebo-work and gebo-mongo are one backup unit - see the header.
  gebo-work:
  gebo-home:
  gebo-logs:
  gebo-shares:

networks:
  gebo-monolith-net:
    driver: bridge
