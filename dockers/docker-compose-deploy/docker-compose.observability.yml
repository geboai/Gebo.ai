#================================================================
# OPTIONAL observability overlay for the Gebo.ai monolith.
#
# Adds metrics, distributed traces and Grafana dashboards on top of
# docker-compose.yml, and points gebo.ai's OTLP exporter at the collector.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Grafana is then on http://localhost:3000 (anonymous viewer access),
# pre-provisioned with Prometheus and Tempo datasources and a starter
# "Gebo overview" dashboard: services up, HTTP request rate and latency,
# message-broker throughput, JVM memory.
#
# UNLIKE docker-compose.yml, this overlay is NOT self-contained: it mounts
# otel-collector-config.yaml, prometheus.yml, tempo-config.yaml and
# grafana/provisioning from this directory, so it needs the repository:
#
#   git clone --depth 1 https://github.com/geboai/Gebo.ai
#   cd Gebo.ai/dockers/gebo.ai
#
# To stop collecting telemetry, bring the stack back up with docker-compose.yml
# alone; the application keeps running untouched.
#
# The images are pinned to the versions these configuration files are verified
# against (ObservabilityOverlayCompatibilityTest in gebo.ai.app): an unpinned
# grafana/tempo stopped starting when Tempo 3 dropped the ingester/compactor
# sections of tempo-config.yaml. Raise a version only together with that test.
#
# Prometheus scrapes gebo.ai on its separate management port (12998), where
# /actuator/prometheus and /actuator/health answer without a login. The port is
# deliberately NOT published: only the containers of this network reach it.
#
# See dockers/PERSISTENCE.md - the three volumes here hold telemetry history
# only, and are safe to discard.
# ---------------------------------------------------------------------------

services:
  # Turn tracing back on and ship it to the collector. Without the overlay the
  # base file pins sampling to 0, because there is nothing listening.
  gebo.ai:
    environment:
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      # Spring Boot 4 name: the old MANAGEMENT_OTLP_TRACING_ENDPOINT is no longer read.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      # Actuator management port for the Prometheus scrape: internal only, not published.
      MANAGEMENT_SERVER_PORT: "12998"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    networks: [gebo-monolith-net]

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [gebo-monolith-net]

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [gebo-monolith-net]

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [gebo-monolith-net]

# Telemetry history only - reconstructible, not part of the backup set.
volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
