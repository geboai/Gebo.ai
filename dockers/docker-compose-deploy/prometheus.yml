# Scrape config for the Gebo.ai monolith deployment.
# The actuator answers on the separate management port 12998 that the
# observability overlay sets (MANAGEMENT_SERVER_PORT) and keeps unpublished:
# there /actuator/prometheus needs no login, while on the application port
# 12999 every actuator call needs an authenticated user.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gebo-ai-monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gebo.ai:12998"]
