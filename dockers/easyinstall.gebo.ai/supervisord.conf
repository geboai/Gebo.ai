[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
# OpenSearch benefits from a high file-descriptor limit
minfds=65536

[program:mongod]
command=/usr/bin/mongod --bind_ip_all --dbpath=/data/db --logpath=/var/log/mongodb/mongod.log
; Disables the glibc rseq fast path that MongoDB's TCMalloc misuses on
; Linux kernel 6.19+ (SERVER-121912). Harmless on older kernels.
environment=GLIBC_TUNABLES="glibc.pthread.rseq=0:glibc.cpu.hwcaps=-SHSTK"
autorestart=true
startsecs=3
stdout_logfile=/var/log/mongodb/stdout.log
stderr_logfile=/var/log/mongodb/stderr.log

[program:qdrant]
command=/usr/bin/qdrant --config-path /etc/qdrant/config.yaml
autorestart=true
startsecs=3
stdout_logfile=/var/log/qdrant/stdout.log
stderr_logfile=/var/log/qdrant/stderr.log

[program:neo4j]
command=/bin/neo4j-entry.sh
user=neo4j
autorestart=true
startsecs=10
stdout_logfile=/var/log/neo4j/stdout.log
stderr_logfile=/var/log/neo4j/stderr.log
environment=NEO4J_PASSWORD="neo4jmaster",HOME="/var/lib/neo4j"

[program:opensearch]
command=/opt/opensearch/bin/opensearch
user=opensearch
directory=/opt/opensearch
autorestart=true
startsecs=15
stdout_logfile=/var/log/opensearch/stdout.log
stderr_logfile=/var/log/opensearch/stderr.log
; OPENSEARCH_JAVA_HOME pins OpenSearch to the JDK its tarball bundles. Without it the
; launcher takes the image-wide JAVA_HOME - Gebo.ai's Java 25 - and OpenSearch 2.x
; dies at VM init: it enables the Security Manager, which JDK 24+ no longer has.
environment=OPENSEARCH_JAVA_HOME="/opt/opensearch/jdk",OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m",HOME="/opt/opensearch"

[program:gebo.ai]
command=/bin/gebo.ai.sh
directory=/opt/gebo.ai
; Non-root (uid 10001). HOME must be set explicitly: supervisord's user= switches
; the uid but keeps root's environment, and the app writes native-library caches
; under $HOME (DJL tokenizers for the local ONNX embeddings).
user=gebo
environment=JAVA_HOME="/opt/java/openjdk",HOME="/home/gebo",JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 --add-opens=java.base/java.nio.charset=ALL-UNNAMED --enable-native-access=ALL-UNNAMED -Xms2g -Xmx4g -XX:MaxMetaspaceSize=512m -Xlog:gc:file=/opt/gebo.ai/logs/gc.log:time,uptime:filecount=5,filesize=20M"
autorestart=true
startsecs=10
stdout_logfile=/var/log/gebo.ai/stdout.log
stderr_logfile=/var/log/gebo.ai/stderr.log


[group:services]
programs=mongod,qdrant,neo4j,opensearch,gebo.ai
