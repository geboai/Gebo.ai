  #            delivery/**/*.rpm

  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same JDK as the .deb job, for the same reasons - see the comment there.
      # This used to be "22": not an LTS, and with java/22/latest gone setup-java
      # fell back to the JDK 22 GA build of March 2024, which the .msi bundled.
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Refuse an unpatched GA JDK
        shell: bash
        run: |
          v=$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java\.version = //p')
          echo "Bundling Java $v"
          case "$v" in
            *.*.*) ;;  # an update release, e.g. 25.0.5
            *) echo "::error::setup-java installed the unpatched GA build (java.version=$v): Oracle no longer serves free updates for this LTS under java/<major>/latest - move java-version to the next LTS"; exit 1 ;;
          esac

      - name: Install WiX Toolset (per MSI)
        run: |
          choco install wixtoolset -y

      - name: Build MSI with Maven
        run: |
          mvn -B clean package -P bootables,angular-ui,package-windows -DskipTests

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: |
            **/target/installer/*.msi

  release:
    runs-on: ubuntu-latest
    needs:
      - build-deb
      - build-msi
    # future pubblications
    #  - build-rpm
    #

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/**/*
            docs/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
